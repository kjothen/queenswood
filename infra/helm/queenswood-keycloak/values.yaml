# The two knobs that change per environment. Everything else
# (resource names, app namespace) derives from `env.name`.
env:
  name: queenswood
  domain: queenswood.repldriven.com

# Subdomain on which Keycloak is exposed. Combined with env.domain
# (e.g. `keycloak.queenswood.repldriven.com`).
host:
  subdomain: keycloak

# Gateway that fronts the realm endpoint. Created by the queenswood
# application chart; we attach an HTTPRoute to its `https` section.
gateway:
  name: queenswood-gateway
  sectionName: https
  # GKE-specific: a HealthCheckPolicy overriding the default `/`-on-the-
  # serving-port probe, which Keycloak answers 302 to. Turn off for a
  # non-GKE gateway, where the CRD doesn't exist.
  healthCheck:
    enabled: true
    port: 9000
    requestPath: /health/ready

# Keycloak's files-plaintext vault. Each key is a file in `dir` named
# <realm>_<key>, so the queenswood realm's ${vault.google-client-secret}
# reads queenswood_google-client-secret. The Secret is created out of
# band (`just gcp-keycloak-vault-secret`) and never lives in git.
#
# The volume is optional, so enabling the vault before the Secret
# exists leaves Keycloak running with the expression unresolved rather
# than wedging the pod on a missing mount.
vault:
  enabled: false
  secretName: queenswood-keycloak-vault
  dir: /opt/keycloak/data/vault

# CoreDNS rewrite: in-cluster pods need the public `keycloak.<domain>`
# to resolve to the internal Service so the JWT `iss` claim matches
# inside and outside the cluster.
coredns:
  rewrite:
    enabled: true
    namespace: kube-system
    configMapName: coredns-custom

# ArgoCD sync-wave annotation rendered onto chart resources. The
# chart is installed onto GKE by a Crossplane provider-helm Release
# templated from queenswood-platform; the outer Release sync-wave is
# set there.
argocd:
  syncWave: "8"

# Keycloak instance config consumed by the operator's `Keycloak` CR.
keycloak:
  image: quay.io/keycloak/keycloak:26.7.0
  instances: 1
  # The realm import lives in `files/queenswood-realm.json` — a
  # symlink to `components/resources/resources/bank/keycloak-
  # realm.json`, the canonical realm for the queenswood platform.

# Postgres backing.
#
# - `local` spins up an in-chart Postgres StatefulSet (kind / dev).
# - `external` skips the Postgres render and stands up a
#   cloud-sql-proxy Deployment + Service pointed at a CloudSQL
#   instance provisioned by the flat MRs in `infra/gcp/database/`.
#   The proxy speaks Postgres on the in-cluster Service; the
#   Keycloak CR connects to that Service.
postgresql:
  mode: local
  local:
    image: postgres:18
    storage: 1Gi
    # Dev-only default. Production deployments must use `mode:
    # external` and reference a real Secret.
    password: keycloak-dev-password
  external:
    # Service name + port the Keycloak CR connects to. The chart
    # renders this Service in front of the cloud-sql-proxy pods.
    serviceName: queenswood-keycloak-cloudsql
    port: 5432
    database: keycloak
    # Name of the Secret (`username`/`password` keys) the chart
    # renders on GKE via `external-db-secret.yaml`. The Keycloak CR
    # mounts it for its usernameSecret/passwordSecret refs.
    secretName: queenswood-keycloak-conn
    # Cloud SQL Auth Proxy config — needed for `mode: external`.
    proxy:
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.24.1
      # `<project>:<region>:<instance>` — surfaced on the
      # CloudSQL DatabaseInstance MR's
      # `status.atProvider.connectionName`. Pinned into
      # queenswood-platform's values.yaml by
      # `just gcp-cloudsql-wire` once Crossplane has
      # provisioned the instance.
      connectionName: ""
      # GCP service account email bound to the K8s SA via Workload
      # Identity. The GCP SA needs `roles/cloudsql.client`; the
      # `iam.workloadIdentityUser` binding from the K8s SA to the
      # GCP SA is one-time setup outside the chart.
      gcpServiceAccount: ""

# ---------------------------------------------------------------------
# Where the realm import takes its definition from -- see
# templates/realm-import.yaml. Not a separate restore path: the same
# Job imports the chart's committed realms when this is empty.
#
# `realms` is a target, not a mode. It names the export this
# environment's realms should come from
# (`keycloak/realms/<YYYY>/<MM>/<DD>/<HHMMSSZ>`, or `LATEST`), recorded
# by `just gcp-keycloak-export` at teardown. Empty imports the
# committed definitions instead, which is right for an environment that
# has never been torn down and wrong for one that has -- restoring FDB
# beside a freshly minted realm duplicates the bank.
# ---------------------------------------------------------------------
restore:
  realms: ""
  bucket: ""
  project: ""
  # Made by `just gcp-keycloak-restore-sa-create` -- needs only object
  # read on the backup bucket, where the CloudSQL import it replaced
  # needed cloudsql.instances.import and a per-instance service-agent
  # binding that did not survive a rebuild.
  gcpServiceAccount: ""
  # Needs curl and jq: it POSTs the realm to Keycloak's Admin API and
  # checks the restored user ids over the same API. No kubectl -- the
  # operator's import CR is not used, so the Job touches no Kubernetes
  # API at all.
  toolsImage: alpine/k8s:1.30.14
  gcloudImage: google/cloud-sdk:slim
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ---------------------------------------------------------------------
# Scheduled realm export, using Keycloak's own tooling rather than a
# database dump -- see templates/cronjob-backup.yaml for why. External
# mode only: the dump lands in the tier-0 bucket.
# ---------------------------------------------------------------------
backup:
  enabled: false
  # Hourly. The export is realm JSON, tens of kilobytes, so frequency
  # costs little; what it buys is a smaller window of lost realm
  # changes between a teardown and the export that precedes it.
  schedule: "0 * * * *"
  bucket: ""
  project: ""
  # Made by `just gcp-keycloak-backup-sa-create` -- needs only
  # object write on the backup bucket.
  gcpServiceAccount: ""
  # Defaults to the same image the Keycloak instance runs, so the
  # export is always produced by the version that wrote the data.
  keycloakImage: ""
  gcloudImage: google/cloud-sdk:slim
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
