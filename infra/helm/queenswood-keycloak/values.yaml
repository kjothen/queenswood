# The two knobs that change per environment. Everything else
# (resource names, app namespace) derives from `env.name`.
env:
  name: queenswood
  domain: queenswood.repldriven.com

# Subdomain on which Keycloak is exposed. Combined with env.domain
# (e.g. `keycloak.queenswood.repldriven.com`).
host:
  subdomain: keycloak

# Gateway that fronts the realm endpoint. Created by the queenswood
# application chart; we attach an HTTPRoute to its `https` section.
gateway:
  name: queenswood-gateway
  sectionName: https

# CoreDNS rewrite: in-cluster pods need the public `keycloak.<domain>`
# to resolve to the internal Service so the JWT `iss` claim matches
# inside and outside the cluster.
coredns:
  rewrite:
    enabled: true
    namespace: kube-system
    configMapName: coredns-custom

# ArgoCD Application sync-wave annotation rendered onto chart
# resources. The Application resource itself lives in
# `infra/bootstrap/apps/queenswood-keycloak.yml`.
argocd:
  syncWave: "8"

# Keycloak instance config consumed by the operator's `Keycloak` CR.
keycloak:
  image: quay.io/keycloak/keycloak:26.6.1
  instances: 1
  # The realm import lives in `files/queenswood-realm.json` — a
  # symlink to `components/bank-resources/resources/bank/keycloak-
  # realm.json`, the canonical realm for the queenswood platform.

# Postgres backing — `local` spins up an in-chart Postgres
# StatefulSet (suitable for kind / dev); `external` expects a
# pre-provisioned database referenced by host + Secret. Override via
# `values-gcp.yaml` (or similar) for managed-DB deployments.
postgresql:
  mode: local
  local:
    image: postgres:16
    storage: 1Gi
    # Dev-only default. Production deployments must use `mode:
    # external` and reference a real Secret.
    password: keycloak-dev-password
  external:
    host: ""
    port: 5432
    database: keycloak
    # Name of an existing Secret carrying `username` and `password`
    # keys. Caller is responsible for creating / rotating it.
    secretName: ""
