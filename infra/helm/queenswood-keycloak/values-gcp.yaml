# Local-helm reference for the GCP overlay — no longer consumed by
# Argo or Crossplane in production. The production path is
# `infra/helm/queenswood-platform/templates/queenswood-keycloak-
# release.yaml`, which inlines these same fields under
# `spec.forProvider.values` of a Crossplane provider-helm `Release`.
# `just gcp-cloudsql-wire` pins
# `connectionName` + `gcpServiceAccount` in queenswood-platform's
# `values.yaml`, not here.
#
# Use this file only when testing the chart standalone, e.g.:
#   helm install qk infra/helm/queenswood-keycloak \
#     -f infra/helm/queenswood-keycloak/values-test.yaml \
#     -f infra/helm/queenswood-keycloak/values-gcp.yaml \
#     --set postgresql.external.proxy.connectionName=<conn> \
#     --set postgresql.external.proxy.gcpServiceAccount=<sa>
postgresql:
  mode: external
  external:
    proxy:
      connectionName: ""
      gcpServiceAccount: ""
