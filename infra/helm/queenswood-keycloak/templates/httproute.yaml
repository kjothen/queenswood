# Public traffic on :443 → in-cluster Keycloak. The :80 HTTP→HTTPS
# redirect is provided by the queenswood chart's redirect HTTPRoute,
# which matches against the apex hostname only; we explicitly attach
# Keycloak's subdomain to the https listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ include "queenswood-keycloak.host" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.keycloak.fullnameOverride }}
          port: 80
