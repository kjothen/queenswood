{{- if .Values.coredns.rewrite.enabled }}
# CoreDNS rewrite: in-cluster pods resolve `keycloak.<env-domain>` to
# the internal Service so the JWT `iss` claim that Keycloak issues
# (which embeds the external hostname) round-trips correctly when
# the bank-api validates a token without ever leaving the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.coredns.rewrite.configMapName }}
  namespace: {{ .Values.coredns.rewrite.namespace }}
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
data:
  queenswood-keycloak.override: |
    rewrite name exact {{ include "queenswood-keycloak.host" . }} {{ .Release.Name }}-keycloak-service.{{ .Values.env.name }}.svc.cluster.local
{{- end }}
