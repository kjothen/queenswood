{{- if eq .Values.postgresql.mode "external" }}
# Database credentials Secret the Keycloak CR reads for its
# `usernameSecret` + `passwordSecret` refs. In external mode the
# values flow in from the Crossplane provider-helm `Release` (see
# `queenswood-platform/templates/queenswood-keycloak-release.yaml`),
# which pins them at chart-install time. We *don't* sync the
# Crossplane-composed conn Secret across from the kind management
# plane: cross-cluster Secret sync would need provider-kubernetes
# pointed at GKE, and the credentials are static at deploy time
# anyway -- the chart owns the Secret on the target cluster.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.external.secretName }}
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
type: Opaque
stringData:
  username: {{ required "postgresql.external.username required in external mode" .Values.postgresql.external.username | quote }}
  password: {{ required "postgresql.external.password required in external mode" .Values.postgresql.external.password | quote }}
{{- end }}
