{{- if eq .Values.postgresql.mode "external" }}
# Cloud SQL Auth Proxy fronting the CloudSQL instance provisioned
# by the flat MRs in `infra/gcp/database/`. The proxy authenticates
# to CloudSQL via Workload Identity (the K8s ServiceAccount below is
# annotated with a GCP SA the operator has pre-bound to
# `roles/cloudsql.client`). Keycloak talks plain Postgres to the
# Service; the proxy handles GCP-side IAM.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.postgresql.external.serviceName }}-proxy
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
    {{- with .Values.postgresql.external.proxy.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ . }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgresql.external.serviceName }}
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
spec:
  ports:
    - port: {{ .Values.postgresql.external.port }}
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: queenswood-keycloak-cloudsql-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.postgresql.external.serviceName }}-proxy
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queenswood-keycloak-cloudsql-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queenswood-keycloak-cloudsql-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.postgresql.external.serviceName }}-proxy
      containers:
        - name: cloud-sql-proxy
          image: {{ .Values.postgresql.external.proxy.image | quote }}
          args:
            - "--address=0.0.0.0"
            - "--port=5432"
            - {{ .Values.postgresql.external.proxy.connectionName | quote }}
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            runAsNonRoot: true
{{- end }}
