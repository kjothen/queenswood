# `Keycloak` CR consumed by the operator (installed cluster-wide by
# the keycloak-operator chart — see queenswood-platform's
# `templates/keycloak-operator-release.yaml`). The operator
# reconciles this into a StatefulSet + Service + everything else a
# running Keycloak needs. Database is parameterised through the
# `postgresql.mode` switch in values.yaml — see _helpers.tpl.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
spec:
  instances: {{ .Values.keycloak.instances }}
  image: {{ .Values.keycloak.image | quote }}
  # The upstream `quay.io/keycloak/keycloak` image ships
  # *unbuilt* -- production images are expected to bake the
  # `kc.sh build` step into their Dockerfile. The operator
  # defaults to `start --optimized`, which crashes on first run
  # against the upstream image with "The '--optimized' flag was
  # used for first ever server start". Setting this to false
  # makes the operator run the build step inside the pod before
  # starting.
  startOptimized: false
  db:
    vendor: postgres
    host: {{ include "queenswood-keycloak.dbHost" . | quote }}
    port: {{ include "queenswood-keycloak.dbPort" . }}
    database: {{ include "queenswood-keycloak.dbName" . | quote }}
    usernameSecret:
      name: {{ include "queenswood-keycloak.dbSecret" . | quote }}
      key: username
    passwordSecret:
      name: {{ include "queenswood-keycloak.dbSecret" . | quote }}
      key: password
  hostname:
    # Full URL so Keycloak embeds the same iss in every token
    # regardless of how it was reached -- see _helpers.tpl. strict:
    # false keeps the operator from rejecting in-cluster Host
    # headers that don't match.
    hostname: {{ include "queenswood-keycloak.hostUrl" . | quote }}
    strict: false
  http:
    # The gateway terminates TLS; the Keycloak pod itself serves
    # plain HTTP and trusts `X-Forwarded-*` headers.
    httpEnabled: true
  proxy:
    headers: xforwarded
  {{- if .Values.vault.enabled }}
  # `unsupported` is the operator's own name for the escape hatch, not
  # a warning about this usage -- it's the only way to add a volume to
  # the pod it manages.
  unsupported:
    podTemplate:
      spec:
        volumes:
          - name: keycloak-vault
            secret:
              secretName: {{ .Values.vault.secretName | quote }}
              optional: true
        containers:
          - volumeMounts:
              - name: keycloak-vault
                mountPath: {{ .Values.vault.dir | quote }}
                readOnly: true
  {{- end }}
  additionalOptions:
    {{- if .Values.vault.enabled }}
    - name: vault
      value: files-plaintext
    - name: vault-dir
      value: {{ .Values.vault.dir | quote }}
    {{- end }}
    {{- if eq .Values.postgresql.mode "external" }}
    # cloud-sql-proxy fronts CloudSQL with a plain-TCP listener on
    # localhost; auth/encryption terminates at the proxy via
    # Workload Identity. The Postgres JDBC driver defaults to
    # sslmode=prefer and crashes on the proxy's SSL handshake
    # close, so force-disable client-side SSL.
    - name: db-url-properties
      value: "?sslmode=disable"
    {{- end }}
