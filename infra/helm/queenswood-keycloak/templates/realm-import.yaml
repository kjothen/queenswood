# `KeycloakRealmImport` CRs — the operator picks each one up, runs a
# Job that imports the realm against the Keycloak instance, and marks
# the CR as Done. Re-imports happen if the realm spec changes.
#
# Both payloads come from `files/*.json` symlinks pointing at the
# canonical realm definitions in `components/resources/resources/
# bank/`. The same files back the testcontainer-fixture realm (in
# `bank-test-resources/`), so the helm-deployed realm, the operator-
# managed realm, and the testcontainer realm all trace to one source.
#
# Two realms live on this Keycloak: `queenswood` is the
# organisation-user realm (console SPA + per-org service
# accounts); `queenswood-ops` is the operator realm (operator SPA).
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: {{ .Release.Name }}-realm
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
spec:
  keycloakCRName: {{ .Release.Name }}-keycloak
  realm:
    {{- .Files.Get "files/queenswood-realm.json" | fromJson | toYaml | nindent 4 }}
---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: {{ .Release.Name }}-realm-ops
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
spec:
  keycloakCRName: {{ .Release.Name }}-keycloak
  realm:
    {{- .Files.Get "files/queenswood-ops-realm.json" | fromJson | toYaml | nindent 4 }}
