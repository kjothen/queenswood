# RecordSet for keycloak.<env-domain> pointing at the same external IP
# as the apex (managed by queenswood-platform). The Gateway routes both
# the apex hostname and this subdomain to in-cluster Services via
# HTTPRoutes, so they share the same listener IP.
apiVersion: dns.gcp.m.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: {{ .Values.env.name }}-keycloak
  namespace: {{ .Values.env.name }}
  labels:
    {{- include "queenswood-keycloak.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.argocd.syncWave }}"
spec:
  forProvider:
    name: {{ include "queenswood-keycloak.host" . }}.
    type: A
    ttl: 300
    rrdatas:
      - "" # filled in by Crossplane from the managed Address; see queenswood-platform/apex.yaml
    managedZoneRef:
      name: {{ .Values.env.name }}-zone
