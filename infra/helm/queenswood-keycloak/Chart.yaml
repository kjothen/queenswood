apiVersion: v2
name: queenswood-keycloak
description: |
  Per-environment Keycloak instance for queenswood, deployed via the
  official Keycloak Operator. Emits a `Keycloak` CR + a
  `KeycloakRealmImport` CR plus the supporting plumbing (HTTPRoute on
  the queenswood gateway, CoreDNS rewrite so in-cluster pods resolve
  the public hostname to the in-cluster Service, and — in local mode
  — an in-chart Postgres StatefulSet). The `keycloak.<env-domain>`
  DNS record lives on the apex composite, since `RecordSet` is a
  Crossplane managed resource that can't run on the GKE target. The
  Operator + CRDs are cluster-scoped and installed separately by the
  `keycloak-operator` chart (sibling of this one).

  Parameterised on `env.name` and `env.domain` so the same chart
  drives queenswood, queenswood-test, etc. The `postgresql.mode`
  switch flips between a local Postgres pod (for kind clusters) and
  an externally-provisioned database (CloudSQL via Crossplane in
  GCP).
type: application
version: 0.4.2
appVersion: "26.7.0"
