{{- /*
  Where this instance reads secrets from. No auth block: the
  controller's pod carries the annotated service account, so the
  provider takes the identity it already has -- the same property the
  plane's own store has, arrived at the same way.

  The project is the instance's own. Secret Manager is enabled there and
  the instance's secrets identity holds accessor on it, so nothing here
  reaches across into the management project.

  Wave 1, and SkipDryRunOnMissingResource: this is a custom resource of
  a kind the external-secrets Application registers, and the two are
  ordered by the waves on those Applications rather than inside either.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "queenswood-config.instance" . | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.projectId | quote }}
{{- if .Values.recoveryProjectId }}
---
{{- /*
  A second store, for the installation's recovery project. The entry
  holding this instance's backup encryption key lives there rather than
  in the instance's own project, because it has to survive whatever
  loses the instance -- and a store names one project, so reaching a
  second one takes a second store rather than a field.

  The same identity reads through both. It is granted on that one entry
  rather than project-wide, since the recovery project holds every
  instance's key.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ printf "%s-recovery" (include "queenswood-config.instance" .) | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.recoveryProjectId | quote }}
{{- end }}
