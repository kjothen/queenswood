apiVersion: v2
name: queenswood-gcp
description: |
  Crossplane MRs for every project-scoped GCP resource queenswood
  needs (API enablement, IAM bindings, VPC, GKE cluster + node pool,
  Cloud SQL, Cloud SQL Proxy SA + Workload Identity). The chart's
  single mandatory value is `gcpProjectId`; everything else (env
  namespace, region, zone) has env-appropriate defaults.
type: application
version: 0.1.0
appVersion: "0.1.0"
icon: https://avatars.githubusercontent.com/repldriven
kubeVersion: ">=1.27.0-0"
