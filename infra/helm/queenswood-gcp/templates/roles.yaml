{{- $projectId := include "queenswood-gcp.projectId" . -}}
{{- $member := include "queenswood-gcp.crossplaneSaMember" . -}}
# Project IAM bindings for the crossplane-provider SA. Bootstrap
# roles (projectIamAdmin, serviceUsageAdmin) are bound by
# `just gcp-iam-bootstrap`. serviceAccountAdmin (not just User) is
# required so the SA can manage IAM policies on workload-identity
# SAs it creates downstream.
{{- $roles := list
  (dict "slug" "container-admin"               "role" "roles/container.admin"           "desc" "GKE admin")
  (dict "slug" "compute-network-admin"         "role" "roles/compute.networkAdmin"      "desc" "Compute network admin")
  (dict "slug" "dns-admin"                     "role" "roles/dns.admin"                 "desc" "Cloud DNS admin")
  (dict "slug" "certificatemanager-owner"      "role" "roles/certificatemanager.owner"  "desc" "Certificate Manager owner")
  (dict "slug" "cloudsql-admin"                "role" "roles/cloudsql.admin"            "desc" "Cloud SQL admin")
  (dict "slug" "iam-service-account-admin"     "role" "roles/iam.serviceAccountAdmin"   "desc" "IAM service-account admin")
}}
{{- range $roles }}
---
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: {{ printf "%s-%s" $.Values.crossplaneSaName .slug }}
  namespace: crossplane-system
  annotations:
    description: Crossplane SA — {{ .desc }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    project: {{ $projectId | quote }}
    role: {{ .role | quote }}
    member: {{ $member | quote }}
{{- end }}
