{{- $projectId := include "queenswood-gcp.projectId" . -}}
# v2 ClusterProviderConfig referenced by every namespaced v2
# (`*.gcp.m.upbound.io`) MR in this chart.
apiVersion: gcp.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
  annotations:
    description: GCP credentials (v2 cluster-scoped)
spec:
  projectID: {{ $projectId | quote }}
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: creds
