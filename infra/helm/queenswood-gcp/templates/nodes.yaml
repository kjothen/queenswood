{{- $member := include "queenswood-gcp.gkeNodeSaMember" . -}}
# Dedicated SA the GKE NodePool runs under. GKE's current best-
# practice replaces the default Compute Engine SA (which has the
# broad roles/editor) with this narrow account holding just
# roles/container.defaultNodeServiceAccount -- the bundle that
# covers node logging, monitoring, metric writing, and image pull
# from project-scoped Artifact Registry. Without it, GKE surfaces
# the "Node service account in cluster is missing
# roles/container.defaultNodeServiceAccount" health recommendation.
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: {{ .Values.gkeNodeSa }}
  namespace: crossplane-system
  annotations:
    description: GKE node-pool GCP SA
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    displayName: "Queenswood GKE Nodes"
  initProvider:
    accountId: {{ .Values.gkeNodeSa }}
---
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: {{ printf "%s-default-node-sa" .Values.gkeNodeSa }}
  namespace: crossplane-system
  annotations:
    description: GKE nodes SA — defaultNodeServiceAccount
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    project: {{ include "queenswood-gcp.projectId" . | quote }}
    role: roles/container.defaultNodeServiceAccount
    member: {{ $member | quote }}
