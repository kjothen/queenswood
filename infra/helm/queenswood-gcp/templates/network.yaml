apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Network
metadata:
  name: queenswood-vpc
  namespace: crossplane-system
  annotations:
    description: Queenswood VPC
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    autoCreateSubnetworks: false
    routingMode: REGIONAL
---
apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Subnetwork
metadata:
  name: queenswood-subnet
  namespace: crossplane-system
  annotations:
    description: Queenswood primary subnet (pods + services)
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    region: {{ .Values.region | quote }}
    ipCidrRange: 10.10.0.0/16
    networkRef:
      name: queenswood-vpc
    secondaryIpRange:
      - rangeName: pods
        ipCidrRange: 10.20.0.0/16
      - rangeName: services
        ipCidrRange: 10.30.0.0/20
    privateIpGoogleAccess: true
---
# Proxy-only subnet for the regional external Application LB used by
# the gke-l7-regional-external-managed Gateway. Without it the GKE
# Gateway controller fails to create the forwarding rule.
apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Subnetwork
metadata:
  name: queenswood-proxy-only
  namespace: crossplane-system
  annotations:
    description: Regional proxy-only subnet for the Gateway
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    region: {{ .Values.region | quote }}
    ipCidrRange: 10.40.0.0/24
    networkRef:
      name: queenswood-vpc
    purpose: REGIONAL_MANAGED_PROXY
    role: ACTIVE
