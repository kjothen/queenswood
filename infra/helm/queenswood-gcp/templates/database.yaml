# CloudSQL Postgres for queenswood-keycloak. ENTERPRISE +
# db-custom-1-3840 + PD_HDD is the cheapest legal Postgres combo.
apiVersion: sql.gcp.m.upbound.io/v1beta2
kind: DatabaseInstance
metadata:
  name: queenswood-keycloak
  namespace: crossplane-system
  annotations:
    description: CloudSQL Postgres for Keycloak
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    databaseVersion: POSTGRES_16
    region: {{ .Values.region | quote }}
    deletionProtection: false
    settings:
      edition: ENTERPRISE
      tier: db-custom-1-3840
      diskSize: 10
      diskType: PD_HDD
      backupConfiguration:
        enabled: true
        pointInTimeRecoveryEnabled: false
      ipConfiguration:
        ipv4Enabled: true
---
apiVersion: sql.gcp.m.upbound.io/v1beta1
kind: Database
metadata:
  name: keycloak
  namespace: crossplane-system
  annotations:
    description: Keycloak's `keycloak` database
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    instanceRef:
      name: queenswood-keycloak
---
apiVersion: sql.gcp.m.upbound.io/v1beta1
kind: User
metadata:
  name: keycloak
  namespace: crossplane-system
  annotations:
    description: Keycloak DB user
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    instanceRef:
      name: queenswood-keycloak
    passwordSecretRef:
      namespace: crossplane-system
      name: queenswood-keycloak-password
      key: password
  writeConnectionSecretToRef:
    namespace: crossplane-system
    name: queenswood-keycloak-conn
---
apiVersion: v1
kind: Secret
metadata:
  name: queenswood-keycloak-password
  namespace: crossplane-system
  annotations:
    description: Keycloak DB password
type: Opaque
stringData:
  password: {{ .Values.keycloakDbPassword | quote }}
