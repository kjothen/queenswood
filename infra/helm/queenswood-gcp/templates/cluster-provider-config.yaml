{{- $projectId := required "queenswood-gcp: .Values.gcpProjectId must be set" .Values.gcpProjectId -}}
# v2 ClusterProviderConfig referenced by every namespaced v2
# (`*.gcp.m.upbound.io`) MR composed by the XPlatform Composition.
# Lives in this chart (not in `bootstrap`) so the gcpProjectId
# helm parameter that drives the XR also drives the ProviderConfig.
apiVersion: gcp.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
  annotations:
    description: GCP credentials (v2 cluster-scoped)
spec:
  projectID: {{ $projectId | quote }}
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: creds
