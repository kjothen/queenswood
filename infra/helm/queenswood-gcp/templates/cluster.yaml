{{- $projectId := include "queenswood-gcp.projectId" . -}}
apiVersion: container.gcp.upbound.io/v1beta2
kind: Cluster
metadata:
  name: queenswood-gke
  annotations:
    description: Queenswood GKE Cluster
spec:
  forProvider:
    location: {{ .Values.zone | quote }}
    initialNodeCount: 1
    removeDefaultNodePool: true
    deletionProtection: false
    nodeConfig:
      machineType: e2-standard-2
      diskType: pd-standard
      diskSizeGb: 50
    networkRef:
      name: queenswood-vpc
    subnetworkRef:
      name: queenswood-subnet
    ipAllocationPolicy:
      clusterSecondaryRangeName: pods
      servicesSecondaryRangeName: services
    workloadIdentityConfig:
      workloadPool: {{ printf "%s.svc.id.goog" $projectId | quote }}
    releaseChannel:
      channel: REGULAR
    addonsConfig:
      httpLoadBalancing:
        disabled: false
    # Upbound's CRD nests gateway_api_config at the top level (not under
    # networkConfig); placing it elsewhere is silently dropped.
    gatewayApiConfig:
      channel: CHANNEL_STANDARD
  writeConnectionSecretToRef:
    name: queenswood-gke-kubeconfig
    namespace: crossplane-system
---
apiVersion: container.gcp.upbound.io/v1beta2
kind: NodePool
metadata:
  name: queenswood-pool
  annotations:
    description: Queenswood GKE node pool
spec:
  forProvider:
    location: {{ .Values.zone | quote }}
    clusterRef:
      name: queenswood-gke
    autoscaling:
      minNodeCount: 3
      maxNodeCount: 6
    nodeConfig:
      machineType: e2-standard-2
      diskSizeGb: 50
      diskType: pd-standard
      oauthScopes:
        - https://www.googleapis.com/auth/cloud-platform
      workloadMetadataConfig:
        mode: GKE_METADATA
