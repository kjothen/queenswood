{{- $projectId := required "queenswood-gcp: .Values.gcpProjectId must be set" .Values.gcpProjectId -}}
# The one XPlatform XR for this install. Crossplane's Composition at
# infra/platform/crossplane-xrds/xplatform-composition.yml composes
# every project-scoped MR (ProviderConfigs, ProjectServices, IAM
# bindings, VPC, GKE, CloudSQL) from this XR's spec. Argo manages this
# XR; Crossplane manages the ~24 composed resources internally.
apiVersion: platform.queenswood.repldriven.com/v1alpha1
kind: XPlatform
metadata:
  name: queenswood
  namespace: crossplane-system
  annotations:
    description: Queenswood GCP platform (XPlatform composite)
spec:
  projectId: {{ $projectId | quote }}
  envNamespace: {{ .Values.envNamespace | quote }}
  region: {{ .Values.region | quote }}
  zone: {{ .Values.zone | quote }}
  sqlProxyGcpSa: {{ .Values.sqlProxyGcpSa | quote }}
  sqlProxyK8sSa: {{ .Values.sqlProxyK8sSa | quote }}
  gkeNodeSa: {{ .Values.gkeNodeSa | quote }}
