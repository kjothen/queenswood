# Static input Secret the composed CloudSQL User MR's
# `passwordSecretRef` consumes. Rendered by the chart (not by the
# Composition) because Secrets aren't Crossplane MRs -- the
# Composition can only compose Crossplane-managed kinds.
apiVersion: v1
kind: Secret
metadata:
  name: queenswood-keycloak-password
  namespace: crossplane-system
  annotations:
    description: Keycloak DB password
type: Opaque
stringData:
  password: {{ required "keycloakDbPassword must be set (root-app passes it from pass)" .Values.keycloakDbPassword | quote }}
