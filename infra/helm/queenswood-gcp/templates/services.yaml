{{- $projectId := include "queenswood-gcp.projectId" . -}}
# GCP APIs the crossplane-provider SA needs. Bootstrap APIs
# (cloudresourcemanager, iam, iamcredentials, serviceusage) are
# enabled by `just gcp-iam-bootstrap` before this chart installs.
{{- $services := list
  (dict "name" "container-googleapis-com" "service" "container.googleapis.com" "description" "Kubernetes Engine API")
  (dict "name" "compute-googleapis-com" "service" "compute.googleapis.com" "description" "Compute Engine API")
  (dict "name" "dns-googleapis-com" "service" "dns.googleapis.com" "description" "Cloud DNS API")
  (dict "name" "certificatemanager-googleapis-com" "service" "certificatemanager.googleapis.com" "description" "Certificate Manager API")
  (dict "name" "sqladmin-googleapis-com" "service" "sqladmin.googleapis.com" "description" "Cloud SQL Admin API")
}}
{{- range $services }}
---
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: ProjectService
metadata:
  name: {{ .name }}
  namespace: crossplane-system
  annotations:
    description: {{ .description }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    project: {{ $projectId | quote }}
    service: {{ .service | quote }}
    disableOnDestroy: false
{{- end }}
