# The installation's four-character code. Every name derived from it
# has to spell what the composition spelled -- the platform identity's
# address in particular, which Workload Identity matches literally.
code: ""

# The management project. Both the identity's address and the GCP
# provider configuration's projectID come from it.
managementProjectId: ""

# Where the child Applications read from. Set from the installation's
# management.source, the same value the root Application carrying this
# chart was given, so a fork reconciles itself rather than upstream.
repoURL: https://github.com/repldriven/queenswood
targetRevision: main

# Where this project sits inside that repository. A fork keeps the
# layout; a mirror vendoring it under a directory sets this, and the
# paths above are relative to it.
pathPrefix: "."

# The Kubernetes service account Crossplane's GCP providers run as.
# Workload Identity binds to this name, so it cannot be the generated
# one -- and the XRD's management.providerServiceAccount already
# assumes it.
providerServiceAccount: crossplane-provider-gcp

# The external-secrets operator, which reads Secret Manager on the
# secrets identity's behalf. Pinned here and nowhere else, so nothing
# can drift -- but Renovate does not read Argo Application sources out
# of a Helm template, so this is bumped by hand.
externalSecrets:
  version: "2.9.0"

# The repository this installation's manifest is committed to. Empty
# where there is none, and then no credential is fetched and no
# repository is registered with Argo.
manifestRepoURL: ""
