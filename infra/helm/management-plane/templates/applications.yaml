{{- /*
  The kinds this plane reconciles with, and the CRDs everything after
  this depends on. Wave 1: after the runtime configuration, which has
  to beat the provider pods it names, and before the provider
  configurations, which are resources of these kinds.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-providers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    description: Crossplane provider and function packages
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ printf "%s/infra/platform/crossplane-providers" .Values.pathPrefix | clean | quote }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
---
{{- /*
  How this plane authenticates and where it reads secrets from -- every
  one a custom resource of a kind installed at wave 1, and the reason
  they are a child Application rather than resources of this chart.
  Argo cannot build a sync task for a kind the cluster does not have,
  and a parent that fails there never applies the children that would
  install it. Here that failure is this Application's alone.

  Wave 2: after the installs, before the API that uses them.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-plane-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    description: Provider configurations, secret store and repository credential
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ printf "%s/infra/helm/management-plane-config" .Values.pathPrefix | clean | quote }}
    helm:
      valuesObject:
        code: {{ .Values.code | quote }}
        managementProjectId: {{ .Values.managementProjectId | quote }}
        manifestRepoURL: {{ .Values.manifestRepoURL | quote }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
---
{{- /*
  The installation API, and deliberately not any installation: the
  manifest naming one lives in a private repository and arrives
  separately.

  Wave 3: last, so the API arrives on a plane that can already
  authenticate.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-xrds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    description: Installation XRD and Composition
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ printf "%s/infra/platform/crossplane-xrds" .Values.pathPrefix | clean | quote }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
{{- if .Values.manifestRepoURL }}
---
{{- /*
  The installation itself, at last: this plane reconciling the composite
  that describes it, from the private repository the credential above
  unlocks. Everything before it was machinery for being able to.

  Wave 4, after the API it is an instance of.

  prune is off, deliberately. Removing the manifest would otherwise
  delete the composite, and deleting a composite deletes what it
  composes -- the cluster and its node pool carry no protection against
  that, and the folder and project only survive because their
  management policies withhold Delete. Retiring an installation is a
  deliberate act, not a consequence of a file going missing.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: installation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    description: This installation's own manifest
spec:
  project: default
  source:
    repoURL: {{ .Values.manifestRepoURL | quote }}
    targetRevision: {{ .Values.manifestRevision | quote }}
    path: {{ .Values.code | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
{{- end }}
