{{- /*
  The Kubernetes half of Workload Identity. The GCP half --
  roles/iam.workloadIdentityUser on the platform identity -- is bound by
  the installation composition, which names this service account
  literally, so it cannot be the generated one.

  Wave 0: a provider Deployment takes whatever service account exists
  when it starts.
*/}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Values.providerServiceAccount | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                {{- toYaml .Values.resources.providers | nindent 16 }}
  serviceAccountTemplate:
    metadata:
      name: {{ .Values.providerServiceAccount | quote }}
      annotations:
        # Without this a token minted for this account is
        # exchangeable for nothing.
        iam.gke.io/gcp-service-account: sa-{{ .Values.code }}-platform@{{ .Values.managementProjectId }}.iam.gserviceaccount.com
---
{{- /*
  provider-kubernetes writes objects on this cluster, so it needs no GCP
  identity at all -- its authority is Kubernetes RBAC, granted below.
  The service account is pinned for the same reason the GCP one is: a
  binding has to name something, and a generated name matches nothing.

  Wave 0: a provider Deployment takes whatever service account exists
  when it starts.
*/}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: crossplane-provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                {{- toYaml .Values.resources.providers | nindent 16 }}
  serviceAccountTemplate:
    metadata:
      name: crossplane-provider-kubernetes
---
{{- /*
  provider-helm, which pins nothing: its service account is the
  generated one and its authority comes with the package, so this
  exists only to say what the pod may take. A config that sets no
  serviceAccountTemplate leaves the generated name alone, which is
  what keeps this a resource change rather than an identity one.
*/}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: crossplane-provider-helm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                {{- toYaml .Values.resources.providers | nindent 16 }}
---
{{- /*
  The GCP family provider, which the package manager installs as a
  dependency of every service provider rather than anything declaring
  it. Left alone it takes Crossplane's `default` runtime config, which
  sets nothing -- so it was the one pod in this namespace still
  BestEffort after every declared one had a ceiling.

  Resources only, like provider-helm's: it holds the family's
  ProviderConfig and shared controller rather than calling GCP itself,
  so it has no business borrowing the platform identity.
*/}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: crossplane-provider-family
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                {{- toYaml .Values.resources.providers | nindent 16 }}
---
{{- /*
  The composition functions. Each is a pod like a provider's and an
  order of magnitude smaller -- tens of MB rather than hundreds -- but
  BestEffort either way without this, and a starved function is what a
  composite reports as `DeadlineExceeded` on a pipeline step rather
  than as anything about the node.
*/}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: crossplane-functions
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                {{- toYaml .Values.resources.functions | nindent 16 }}
---
{{- /*
  What it may write, and nothing more, in the one namespace it writes
  in. Two things today: the Secret registering an instance's cluster
  with Argo, and the annotation binding Argo's service accounts to a
  GCP identity -- which is composed rather than set in Argo's chart
  values because the Release installing Argo is Observe on this plane,
  so only a boot plane could change them.

  A Role rather than a ClusterRole: widening this should be a visible
  edit rather than something already permitted. This is one.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-provider-kubernetes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Annotated, never created or removed: the argo-cd chart owns these
  # accounts and this only claims a field it does not set.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-provider-kubernetes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-provider-kubernetes
subjects:
  - kind: ServiceAccount
    name: crossplane-provider-kubernetes
    namespace: crossplane-system
