{{- /*
  The Kubernetes half of Workload Identity. The GCP half --
  roles/iam.workloadIdentityUser on the platform identity -- is bound by
  the installation composition, which names this service account
  literally, so it cannot be the generated one.

  Wave 0: a provider Deployment takes whatever service account exists
  when it starts.
*/}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Values.providerServiceAccount | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceAccountTemplate:
    metadata:
      name: {{ .Values.providerServiceAccount | quote }}
      annotations:
        # Without this a token minted for this account is
        # exchangeable for nothing.
        iam.gke.io/gcp-service-account: sa-{{ .Values.code }}-platform@{{ .Values.managementProjectId }}.iam.gserviceaccount.com
---
{{- /*
  provider-kubernetes writes objects on this cluster, so it needs no GCP
  identity at all -- its authority is Kubernetes RBAC, granted below.
  The service account is pinned for the same reason the GCP one is: a
  binding has to name something, and a generated name matches nothing.

  Wave 0: a provider Deployment takes whatever service account exists
  when it starts.
*/}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: crossplane-provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceAccountTemplate:
    metadata:
      name: crossplane-provider-kubernetes
---
{{- /*
  What it may write, and nothing more, in the one namespace it writes
  in. Two things today: the Secret registering an instance's cluster
  with Argo, and the annotation binding Argo's service accounts to a
  GCP identity -- which is composed rather than set in Argo's chart
  values because the Release installing Argo is Observe on this plane,
  so only a boot plane could change them.

  A Role rather than a ClusterRole: widening this should be a visible
  edit rather than something already permitted. This is one.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-provider-kubernetes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Annotated, never created or removed: the argo-cd chart owns these
  # accounts and this only claims a field it does not set.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-provider-kubernetes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-provider-kubernetes
subjects:
  - kind: ServiceAccount
    name: crossplane-provider-kubernetes
    namespace: crossplane-system
