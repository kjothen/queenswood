{{- /*
  Reads Secret Manager and writes what it finds into cluster Secrets, so
  a credential reaches a workload without passing through git and
  without anyone holding write access to this cluster.

  Wave 1, with the provider packages: an operator install, and what
  follows it depends on the CRDs it registers. The chart comes from
  upstream directly, so nothing here needs a credential to install the
  thing that fetches credentials.

  The version is pinned in one place and cannot drift -- but it sits
  inside a Helm template, where Renovate's Argo CD manager does not look,
  so it is bumped by hand.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    description: Secret Manager to cluster Secrets
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.externalSecrets.version | quote }}
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          # The Kubernetes half of Workload Identity for the secrets
          # identity. Its GCP half is bound by the installation
          # composition, which names this namespace and this service
          # account literally.
          annotations:
            iam.gke.io/gcp-service-account: sa-{{ .Values.code }}-secrets@{{ .Values.managementProjectId }}.iam.gserviceaccount.com
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # SecretStore and ClusterSecretStore carry every provider's
      # schema and exceed 256KB. Argo's default client-side apply
      # writes a copy of the whole resource into
      # last-applied-configuration, which the API server then rejects
      # as too long -- so those two CRDs never install, and the
      # controller crash-loops looking for kinds nothing registered.
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
