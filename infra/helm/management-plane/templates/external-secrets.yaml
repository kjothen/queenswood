{{- /*
  Reads Secret Manager and writes what it finds into cluster Secrets, so
  a credential reaches a workload without passing through git and
  without anyone holding write access to this cluster.

  Wave 1, with the provider packages: an operator install, and what
  follows it depends on the CRDs it registers. The chart comes from
  upstream directly, so nothing here needs a credential to install the
  thing that fetches credentials.

  The version is pinned in one place and cannot drift -- but it sits
  inside a Helm template, where Renovate's Argo CD manager does not look,
  so it is bumped by hand.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    description: Secret Manager to cluster Secrets
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.externalSecrets.version | quote }}
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          # The Kubernetes half of Workload Identity for the secrets
          # identity. Its GCP half is bound by the installation
          # composition, which names this namespace and this service
          # account literally.
          annotations:
            iam.gke.io/gcp-service-account: sa-{{ .Values.code }}-secrets@{{ .Values.managementProjectId }}.iam.gserviceaccount.com
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
---
{{- /*
  Where secrets are read from, for the whole cluster. No auth block: the
  controller's pod carries the annotated service account, so the
  provider takes the identity it already has -- the same property the
  GCP provider configuration has, arrived at the same way.

  Wave 2, and SkipDryRunOnMissingResource, for the reason the provider
  configurations have both: this is a custom resource of a kind the
  wave-1 install registers.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.code }}-management
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.managementProjectId | quote }}
{{- if .Values.manifestRepoURL }}
---
{{- /*
  The GitHub App credential, fetched rather than placed. Argo matches a
  repository to its credentials by URL, and reads the three fields a
  GitHub App needs: the App and installation identify it, the private
  key authenticates it, and the token Argo uses is minted from that key
  and lasts an hour.

  All three come out of one Secret Manager entry as JSON, so the
  identifiers travel with the key rather than through a second channel
  -- and nothing about this installation's GitHub App reaches either
  repository.

  Rendered only where an installation has a manifest repository. One
  applied from a boot plane and nowhere else has nothing to read, and
  composes no credential at all.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: installations-repo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.code }}-management
  target:
    name: installations-repo
    template:
      engine: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ .Values.manifestRepoURL | quote }}
        githubAppID: {{ `"{{ .appID }}"` }}
        githubAppInstallationID: {{ `"{{ .installationID }}"` }}
        githubAppPrivateKey: {{ `"{{ .privateKey }}"` }}
  data:
    - secretKey: appID
      remoteRef:
        key: sec-{{ .Values.code }}-c-github-app
        property: appID
    - secretKey: installationID
      remoteRef:
        key: sec-{{ .Values.code }}-c-github-app
        property: installationID
    - secretKey: privateKey
      remoteRef:
        key: sec-{{ .Values.code }}-c-github-app
        property: privateKey
{{- end }}
