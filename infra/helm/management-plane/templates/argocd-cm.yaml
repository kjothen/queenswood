{{- /*
  How Argo reports the health of what this plane applies.

  Four sets of checks, in one `resource.customizations` block rather
  than as `resource.customizations.health.<group>_<kind>` keys: two of
  them are wildcard groups, and a ConfigMap key cannot contain a `*`.

  A patch rather than a file of its own: argocd-cm belongs to the Argo
  release, which is Observe on a running plane. This owns the keys
  below and Helm keeps the rest. Prune is off, or removing this file
  would take the whole ConfigMap with it. Argo re-reads argocd-cm, so
  nothing restarts.
*/}}

{{- /*
  Composites. Synced and Ready are the two conditions one carries.
  Argo ships no check for either group this plane serves, and a
  resource with no check is reported Healthy whatever it is doing.
*/}}
{{- $xrHealth := `
local hs = {
  status = "Progressing",
  message = "Composing"
}

if obj.status == nil or obj.status.conditions == nil then
  return hs
end

-- Two passes, so a composite that went out of sync after it was
-- once ready reports the failure rather than the stale success.
-- One loop would answer whichever condition the array held first.
for _, condition in ipairs(obj.status.conditions) do
  if condition.type == "Synced" and condition.status == "False" then
    return {
      status = "Degraded",
      message = condition.message or "Not synced"
    }
  end
end

for _, condition in ipairs(obj.status.conditions) do
  if condition.type == "Ready" and condition.status == "True" then
    return {
      status = "Healthy",
      message = "Composed"
    }
  end
end

return hs
` }}

{{- /*
  A child Application's health is its own, and Argo has none for the
  kind -- no Lua under resource_customizations/argoproj.io/Application,
  and the Go switch on argoproj.io handles only Workflow. A parent
  therefore reads Healthy however its children are doing, and a wave
  gate has nothing to wait on: gitops-engine treats a nil health as an
  immediate success, the way it does a Secret.

  Restoring it arms the wave gate. The cost is that a child which
  cannot become Healthy holds its parent's sync open -- so no parent
  should hold both an environment's Applications and anything that
  must keep reconciling without it.
*/}}
{{- $appHealth := `
local hs = {
  status = "Progressing",
  message = "Waiting for the child application"
}

if obj.status ~= nil and obj.status.health ~= nil and obj.status.health.status ~= nil then
  hs.status = obj.status.health.status
  hs.message = obj.status.health.message or ""
end

return hs
` }}

{{- /*
  Managed resources. Argo compiles in a copy of these two scripts, and
  both read as `A or (B and C)` where `(A or B) and C` was meant: a
  resource with no status answers Healthy from the nil branch before
  the list of status-less kinds is consulted. So a managed resource
  reports Healthy while it is still provisioning, and a status-less
  kind missing from the list is invisible until the precedence is
  corrected -- and permanently Progressing afterwards.

  The two below are the corrected scripts from argoproj/argo-cd#29382,
  transcribed rather than adapted so that the diff against upstream
  stays readable. Upstream they are
  resource_customizations/_.crossplane.io/_/health.lua and its upbound
  twin: a `_` path segment is how that tree spells the wildcard a
  directory name cannot carry, so `_.crossplane.io/_` is the
  `*.crossplane.io/*` below. They are temporary: when that lands in a release this
  plane runs, delete both entries and point HAS_NO_CONDITIONS in
  scripts/crossplane-statusless-kinds.py at the upstream lists.

  Kept as two copies, differing in their kind list and in which Ready-
  shaped conditions they accept, because upstream keeps two.
*/}}
{{- $crossplaneHealth := `
health_status = {
  status = "Progressing",
  message = "Provisioning ..."
}

local function contains(list, val)
  for _, v in ipairs(list) do
    if v == val then
      return true
    end
  end
  return false
end

-- Kinds that never get status.conditions, so would sit at Progressing
-- forever. Only consulted when there are none, so a kind that gains
-- them can stay.
local has_no_conditions = {
  "Composition",
  "CompositionRevision",
  "DeploymentRuntimeConfig",
  "EnvironmentConfig",
  "ImageConfig",
  "ProviderConfig",
  "ProviderConfigUsage",
  "ControllerConfig",
  "StoreConfig",
  "ClusterProviderConfig",
  "ClusterProviderConfigUsage"
}

if obj.status == nil or obj.status.conditions == nil or next(obj.status.conditions) == nil then
  if contains(has_no_conditions, obj.kind) then
    health_status.status = "Healthy"
    -- status.users affects the message, not the health status.
    if obj.status ~= nil and obj.status.users ~= nil then
      health_status.message = "Resource is in use."
    else
      health_status.message = "Resource is up-to-date."
    end
  end
  return health_status
end

for _, condition in ipairs(obj.status.conditions) do
  if contains({"LastAsyncOperation", "Synced"}, condition.type) and condition.status == "False" then
    health_status.status = "Degraded"
    health_status.message = condition.message
    return health_status
  end

  if contains({"Ready", "Healthy", "Offered", "Established", "ValidPipeline", "RevisionHealthy"}, condition.type) and condition.status == "True" then
    health_status.status = "Healthy"
    health_status.message = "Resource is up-to-date."
  end
end

return health_status
` }}
{{- $upboundHealth := `
health_status = {
  status = "Progressing",
  message = "Provisioning ..."
}

local function contains(list, val)
  for _, v in ipairs(list) do
    if v == val then
      return true
    end
  end
  return false
end

local has_no_conditions = {
  "ProviderConfig",
  "ProviderConfigUsage",
  "StoreConfig",
  "ClusterProviderConfig",
  "ClusterProviderConfigUsage"
}

if obj.status == nil or obj.status.conditions == nil or next(obj.status.conditions) == nil then
  if contains(has_no_conditions, obj.kind) then
    health_status.status = "Healthy"
    -- status.users affects the message, not the health status.
    if obj.status ~= nil and obj.status.users ~= nil then
      health_status.message = "Resource is in use."
    else
      health_status.message = "Resource is up-to-date."
    end
  end
  return health_status
end

for _, condition in ipairs(obj.status.conditions) do
  if contains({"LastAsyncOperation", "Synced"}, condition.type) and condition.status == "False" then
    health_status.status = "Degraded"
    health_status.message = condition.message
    return health_status
  end

  if condition.type == "Ready" and condition.status == "True" then
    health_status.status = "Healthy"
    health_status.message = "Resource is up-to-date."
  end
end

return health_status
` }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,ServerSideApply=true
data:
  resource.customizations: |
{{- /*
      One entry per composite group this plane serves, from values
      rather than spelled here. An XRD loaded onto the plane without
      its group added is a composite that can fail to compose and
      still read as though it worked.
    */}}
{{- range .Values.compositeGroups }}
    {{ . }}/*:
      health.lua: |
{{ $xrHealth | trim | indent 8 }}
{{- end }}
    argoproj.io/Application:
      health.lua: |
{{ $appHealth | trim | indent 8 }}
    "*.crossplane.io/*":
      health.lua: |
{{ $crossplaneHealth | trim | indent 8 }}
    "*.upbound.io/*":
      health.lua: |
{{ $upboundHealth | trim | indent 8 }}
{{- /*
    One of these exists per managed resource, carries no meaning of its
    own, and on a plane with a few hundred MRs is most of the tree by
    object count. Excluded so a resource tree stays readable.
  */}}
  resource.exclusions: |
    - apiGroups:
        - "*"
      kinds:
        - ProviderConfigUsage
        - ClusterProviderConfigUsage
