# Repo all child Applications point at. Same value flows into every
# Application's source.repoURL.
repoURL: https://github.com/repldriven/queenswood
targetRevision: main

# Required. Set on `helm install ... --set gcpProjectId=...`, or via
# `helm.parameters` when this chart is installed as the root Argo
# Application. Renders into queenswood-gcp's helm parameters so the
# queenswood-gcp chart in turn bakes the project ID into every
# Crossplane MR.
gcpProjectId: ""

# Environment name + public domain, passed through from the root
# Application's helm.parameters (which `kind-xp-install-root` fills from
# QUEENSWOOD_ENV / QUEENSWOOD_DOMAIN). Set, they override whatever the
# queenswood-platform chart's values files default to -- so the
# environment is chosen in one place instead of having to agree with a
# valueFiles selection. Empty leaves the chart defaults alone.
envName: ""
envDomain: ""

# Keycloak's CloudSQL password, from `pass` via the root Application.
# Two charts need the same value -- queenswood-gcp sets it on the
# CloudSQL user, queenswood-platform hands it to Keycloak -- and this
# is the single place it enters, so they cannot drift.
keycloakDbPassword: ""

# FDB's backup credentials, from `pass` via the root Application. The
# bucket is not passed: it is always `<gcpProjectId>-backups`, so the
# platform Application derives it rather than taking a value that could
# disagree with the one `just gcp-backup-bucket-create` made.
fdbBackupAccessKeyId: ""
fdbBackupSecretAccessKey: ""
fdbBackupEncryptionKey: ""

# Backup version a rebuilt cluster should restore from, recorded by
# `just gcp-fdb-export` at teardown. Empty means no restore, which is
# what a fresh environment wants.
fdbRestoreVersion: ""

# Keycloak realm export a rebuilt environment imports from, recorded
# by `just gcp-keycloak-export` at teardown. Empty imports the chart's
# committed realm definitions instead.
keycloakRestoreRealms: ""

# Default K8s namespace for the queenswood-* workloads on GKE. Falls
# back to envName when that is set.
envNamespace: queenswood-test

queenswoodPlatform:
  # Defaults for a bootstrap run that passes no envName/envDomain.
  valueFiles:
    - values-test.yaml
