apiVersion: v2
name: bootstrap
description: |
  Argo CD app-of-apps bootstrap chain rendered as Helm templates so
  the per-deploy GCP project ID can flow from the install boundary
  into the queenswood-gcp child Application's helm parameters. Lets
  root respect sync-wave ordering across crossplane-providers (0),
  crossplane-configs + crossplane-xrds + queenswood-gcp (1), and
  queenswood-platform (4) -- so queenswood-platform isn't created
  until queenswood-gcp is Healthy (i.e. GKE cluster Ready, kubeconfig
  secret written).
type: application
version: 0.1.0
appVersion: "0.1.0"
icon: https://avatars.githubusercontent.com/repldriven
kubeVersion: ">=1.27.0-0"
