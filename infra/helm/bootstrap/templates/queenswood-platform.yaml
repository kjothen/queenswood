# Wave 4 (was 4 historically; one wave gap above queenswood-gcp at 1
# leaves room for sync-wave 2/3 work-in-progress without renumbering).
# The chart's own per-resource sync-waves (4..7) order zone -> cert ->
# apex -> release internally.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: queenswood-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    description: Queenswood platform Helm chart
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: infra/helm/queenswood-platform
    helm:
      valueFiles:
{{- range .Values.queenswoodPlatform.valueFiles }}
        - {{ . | quote }}
{{- end }}
      # Parameters win over valueFiles, so a bootstrap that supplies
      # these picks the environment on its own and the values files
      # serve only as defaults.
{{- if or .Values.envName .Values.envDomain .Values.keycloakDbPassword .Values.fdbBackupAccessKeyId .Values.gcpProjectId }}
      parameters:
{{- if .Values.envName }}
        - name: env.name
          value: {{ .Values.envName | quote }}
{{- end }}
{{- if .Values.envDomain }}
        - name: env.domain
          value: {{ .Values.envDomain | quote }}
{{- end }}
{{- if .Values.keycloakDbPassword }}
        - name: queenswoodKeycloak.dbPassword
          value: {{ .Values.keycloakDbPassword | quote }}
{{- end }}
{{- if .Values.fdbBackupAccessKeyId }}
        - name: fdbBackup.accessKeyId
          value: {{ .Values.fdbBackupAccessKeyId | quote }}
        - name: fdbBackup.secretAccessKey
          value: {{ required "fdbBackupSecretAccessKey must accompany fdbBackupAccessKeyId" .Values.fdbBackupSecretAccessKey | quote }}
        - name: fdbBackup.encryptionKey
          value: {{ required "fdbBackupEncryptionKey must accompany fdbBackupAccessKeyId" .Values.fdbBackupEncryptionKey | quote }}
        # Derived, not passed: the bucket `gcp-backup-bucket-create`
        # makes is always named for the project.
        - name: fdbBackup.bucket
          value: {{ printf "%s-backups" (required "gcpProjectId must be set to enable FDB backup" .Values.gcpProjectId) | quote }}
{{- end }}
{{- if .Values.fdbBackupName }}
        - name: fdbBackup.name
          value: {{ .Values.fdbBackupName | quote }}
{{- end }}
{{- if .Values.fdbRestoreVersion }}
        - name: fdbRestore.version
          value: {{ .Values.fdbRestoreVersion | quote }}
{{- if .Values.fdbRestoreBackupName }}
        - name: fdbRestore.backupName
          value: {{ .Values.fdbRestoreBackupName | quote }}
{{- end }}
{{- end }}
{{- if .Values.gcpProjectId }}
        # The scheduled realm export. Needs no secret of its own -- the
        # CronJob writes through Workload Identity -- so it turns on
        # wherever there is a project to write into.
        - name: keycloakBackup.enabled
          value: "true"
        - name: keycloakBackup.project
          value: {{ .Values.gcpProjectId | quote }}
        - name: keycloakBackup.bucket
          value: {{ printf "%s-backups" .Values.gcpProjectId | quote }}
        - name: keycloakBackup.gcpServiceAccount
          value: {{ printf "keycloak-backup@%s.iam.gserviceaccount.com" .Values.gcpProjectId | quote }}
{{- end }}
{{- if .Values.keycloakRestoreRealms }}
        - name: keycloakRestore.realms
          value: {{ .Values.keycloakRestoreRealms | quote }}
        - name: keycloakRestore.project
          value: {{ required "gcpProjectId must be set to restore Keycloak" .Values.gcpProjectId | quote }}
        - name: keycloakRestore.bucket
          value: {{ printf "%s-backups" .Values.gcpProjectId | quote }}
        - name: keycloakRestore.gcpServiceAccount
          value: {{ printf "keycloak-restore@%s.iam.gserviceaccount.com" .Values.gcpProjectId | quote }}
{{- end }}
{{- end }}
  destination:
    server: https://kubernetes.default.svc
    # The chart's templates set explicit namespaces; this is the
    # fallback used by the Application's Namespace resource itself.
    namespace: {{ .Values.envName | default .Values.envNamespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    {{- include "bootstrap.syncRetry" . | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
