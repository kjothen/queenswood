{{- /*
  Where secrets are read from, for the whole cluster. No auth block: the
  controller's pod carries the annotated service account, so the
  provider takes the identity it already has -- the same property the
  GCP provider configuration has, arrived at the same way.

  Wave 2, and SkipDryRunOnMissingResource, for the reason the provider
  configurations have both: this is a custom resource of a kind the
  wave-1 install registers.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.code }}-mgmt
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.managementProjectId | quote }}
{{- if .Values.manifestRepoURL }}
---
{{- /*
  The GitHub App credential, fetched rather than placed. Argo matches a
  repository to its credentials by URL, and reads the three fields a
  GitHub App needs: the App and installation identify it, the private
  key authenticates it, and the token Argo uses is minted from that key
  and lasts an hour.

  All three come out of one Secret Manager entry as JSON, so the
  identifiers travel with the key rather than through a second channel
  -- and nothing about this installation's GitHub App reaches either
  repository.

  Rendered only where an installation has a manifest repository. One
  applied from a boot plane and nowhere else has nothing to read, and
  composes no credential at all.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: installations-repo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.code }}-mgmt
  target:
    name: installations-repo
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ .Values.manifestRepoURL | quote }}
        githubAppID: {{ `"{{ .appID }}"` }}
        githubAppInstallationID: {{ `"{{ .installationID }}"` }}
        githubAppPrivateKey: {{ `"{{ .privateKey }}"` }}
  data:
    - secretKey: appID
      remoteRef:
        key: sec-{{ .Values.code }}-c-github-app
        property: appID
    - secretKey: installationID
      remoteRef:
        key: sec-{{ .Values.code }}-c-github-app
        property: installationID
    - secretKey: privateKey
      remoteRef:
        key: sec-{{ .Values.code }}-c-github-app
        property: privateKey
{{- end }}
