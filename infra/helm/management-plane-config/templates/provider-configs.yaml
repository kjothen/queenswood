{{- /*
  InjectedIdentity: the provider uses the identity its pod already has,
  so no key and no ADC exist on this cluster. The boot plane runs
  outside any workload identity pool, which is why its equivalent is a
  secret.

  Wave 2, after the packages: these are custom resources of the kinds
  those packages install, so they cannot be validated -- or applied --
  before them. SkipDryRunOnMissingResource is what stops Argo rejecting
  the whole sync over a kind it cannot see yet, and a package install
  is asynchronous, so the retry on the Application carries them until
  the CRDs are registered.
*/}}
apiVersion: gcp.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  projectID: {{ .Values.managementProjectId | quote }}
  credentials:
    source: InjectedIdentity
---
{{- /*
  Same name as the boot plane's, deliberately different content: the
  composed Releases name it by value, so it is <code>-mgmt on whichever
  plane reconciles them. The boot plane reaches this cluster across a
  network and needs a kubeconfig; this one is already inside it.
*/}}
apiVersion: helm.m.crossplane.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: {{ .Values.code }}-mgmt
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: InjectedIdentity
---
{{- /*
  InjectedIdentity, as the others are: the provider writes to the
  cluster it runs on, using its own service account and the RBAC bound
  to it. No kubeconfig and no credential.
*/}}
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: InjectedIdentity
