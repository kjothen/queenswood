apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  # Helm release name (and therefore every templated resource name)
  # inherits from metadata.name. Keeping it plain (e.g. `queenswood`)
  # matches the release name used by `just helm-install` locally and
  # by the quickstart README, so the same kubectl recipes work
  # everywhere.
  name: {{ .Values.env.name }}
  namespace: {{ .Values.env.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    description: Queenswood platform on GKE
spec:
  forProvider:
    chart:
      name: {{ .Values.release.chart.name }}
      repository: {{ .Values.release.chart.repository }}
      version: {{ .Values.release.chart.version }}
    namespace: {{ .Values.env.name }}
    values:
      image:
        registry: {{ .Values.release.image.registry }}
        tag: {{ .Values.release.image.tag }}
      {{- if and .Values.fdbBackup.enabled .Values.fdbBackup.accessKeyId }}
      # Credentials travel in the Release's values, the same path the
      # Keycloak DB password takes -- readable to anyone who can read
      # the MR on the management plane, which is the same audience that
      # can read the Secret they end up in.
      fdb:
        backup:
          enabled: true
          bucket: {{ required "fdbBackup.bucket must be set (the root Application derives it from gcpProjectId)" .Values.fdbBackup.bucket | quote }}
          region: {{ .Values.fdbBackup.region | quote }}
          accessKeyId: {{ .Values.fdbBackup.accessKeyId | quote }}
          secretAccessKey: {{ .Values.fdbBackup.secretAccessKey | quote }}
          encryptionKey: {{ .Values.fdbBackup.encryptionKey | quote }}
          {{- with .Values.fdbBackup.name }}
          # One container per cluster generation. Two generations in one
          # container leave `fdbbackup describe` choosing by version
          # number, and a rebuilt cluster's numbers start again near
          # zero -- so it answers with the older generation.
          backupName: {{ . | quote }}
          {{- end }}
        {{- if .Values.fdbRestore.version }}
        restore:
          version: {{ .Values.fdbRestore.version | quote }}
          {{- with .Values.fdbRestore.backupName }}
          # The generation that version belongs to, which is the one
          # this cluster replaced -- never the one it writes to.
          backupName: {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
      gateway:
        enabled: true
        host: {{ .Values.env.domain }}
        # The console SPA keeps its own hostname -- the realm's
        # queenswood-console client only accepts redirectUris under
        # https://console.*.repldriven.com/*.
        consoleHost: {{ printf "console.%s" .Values.env.domain | quote }}
        apiHost: {{ printf "api.%s" .Values.env.domain | quote }}
        gcp:
          enabled: true
          # Apex cert plus the subdomain wildcard: *.<domain> does not
          # cover <domain>, so the listener binds both.
          certManagerCerts: queenswood-cert,queenswood-wildcard-cert
      # Server-side Keycloak config: bank-api + bootstrap call the
      # Admin REST API to register per-org service accounts, and
      # bank-api validates JWTs via the realm JWKS. The admin client
      # secret is generated by the queenswood chart and pushed into
      # Keycloak by its bootstrap Job, so it appears in neither this
      # file nor the realm import.
      keycloak:
        # The realm is imported by the queenswood-keycloak chart's Job
        # in every environment, restore or not, and bootstrap must not
        # register its signing key ahead of it.
        waitForRealmImport: true
        # On GKE, the operator-driven queenswood-keycloak chart
        # (sync-wave 6) provides Keycloak -- keep the bundled dev
        # Keycloak off so we don't run two side by side. (The
        # queenswood chart defaults `dev.enabled: true` for
        # standalone installs.)
        dev:
          enabled: false
        # The in-cluster Service, so admin REST and token exchange stay
        # inside the cluster. Tokens still embed the public hostname as
        # iss, which expectedIssuer below accounts for -- and since
        # mono v0.0.22 the `private_key_jwt` client assertion takes its
        # audience from that same expectedIssuer rather than from
        # base-url, which is what makes an internal base-url viable
        # again (repldriven/mono#128).
        baseUrl: "http://queenswood-keycloak-keycloak-service:8080"
        expectedIssuer: {{ printf "https://keycloak.%s/realms/%s" .Values.env.domain .Values.queenswoodKeycloak.serverSide.realm | quote }}
        opsExpectedIssuer: {{ printf "https://keycloak.%s/realms/queenswood-ops" .Values.env.domain | quote }}
        realm: {{ .Values.queenswoodKeycloak.serverSide.realm | quote }}
        adminClientId: {{ .Values.queenswoodKeycloak.serverSide.adminClientId | quote }}
        # Admin REST credentials for the bootstrap Job's client-secret
        # push. Minted by the Keycloak operator for its own instance,
        # in this namespace.
        adminSecret:
          name: queenswood-keycloak-keycloak-initial-admin
      # Both SPAs read Keycloak URL from /env.js at runtime. The
      # chart defaults route the browser through each SPA's own
      # nginx (`http://localhost:808{1,2}/keycloak`) for the
      # single-port-forward local install. On GKE Keycloak has its
      # own DNS + cert, so we point the browser directly at the
      # public hostname and skip the SPA-side reverse proxy.
      bankApp:
        keycloakPublicUrl: {{ printf "https://keycloak.%s" .Values.env.domain | quote }}
      console:
        keycloakPublicUrl: {{ printf "https://keycloak.%s" .Values.env.domain | quote }}
  providerConfigRef:
    name: {{ .Values.release.providerConfigRef }}
