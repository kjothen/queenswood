{{- if .Values.keycloakOperator.enabled }}
# Vendored Keycloak Operator chart, installed onto GKE via
# Crossplane provider-helm. The operator owns the cluster-scoped
# `Keycloak` and `KeycloakRealmImport` CRDs that the
# queenswood-keycloak chart (sync-wave 6) emits — so this lands
# first, alongside the namespace setup.
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: keycloak-operator
  namespace: {{ .Values.env.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  forProvider:
    chart:
      name: {{ .Values.keycloakOperator.chart.name }}
      repository: {{ .Values.keycloakOperator.chart.repository }}
      version: {{ .Values.keycloakOperator.chart.version }}
    namespace: keycloak-operator
  providerConfigRef:
    name: {{ .Values.release.providerConfigRef }}
{{- end }}
