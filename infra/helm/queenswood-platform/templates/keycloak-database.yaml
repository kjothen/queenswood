{{- if .Values.keycloakDatabase.enabled }}
# CloudSQL Postgres for the queenswood-keycloak chart. The composition
# (infra/platform/crossplane-xrds/xkeycloakdatabase-composition.yml)
# creates the instance + database + user, and publishes the connection
# Secret (`<instanceName>-conn` in `crossplane-system`) that the
# keycloak chart's cloud-sql-proxy reads.
apiVersion: platform.queenswood.repldriven.com/v1alpha1
kind: XKeycloakDatabase
metadata:
  name: {{ .Values.keycloakDatabase.instanceName }}
  namespace: {{ .Values.env.name }}
  annotations:
    # Sits between the network/cert (waves 4-6) and the application
    # Helm release (wave 7) so the DB is provisioning while the
    # cluster is still spinning up the rest of the platform; CloudSQL
    # takes several minutes to come up so getting an early start
    # matters.
    argocd.argoproj.io/sync-wave: "5"
spec:
  region: {{ .Values.keycloakDatabase.region }}
  instanceName: {{ .Values.keycloakDatabase.instanceName }}
  databaseName: {{ .Values.keycloakDatabase.databaseName }}
  username: {{ .Values.keycloakDatabase.username }}
  tier: {{ .Values.keycloakDatabase.tier }}
  postgresVersion: {{ .Values.keycloakDatabase.postgresVersion }}
{{- end }}
