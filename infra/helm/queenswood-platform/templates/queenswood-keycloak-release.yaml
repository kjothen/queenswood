{{- if .Values.queenswoodKeycloak.enabled }}
# Per-environment Keycloak instance, installed onto GKE via
# Crossplane provider-helm. The chart emits a `Keycloak` CR (consumed
# by the operator from sync-wave 3), a `KeycloakRealmImport`, the
# HTTPRoute on the gateway, the keycloak DNS record, and — in
# `postgresql.mode: external` — a `cloud-sql-proxy` Deployment that
# fronts the CloudSQL instance provisioned by the flat MRs in
# `infra/gcp/database/` (sync-wave 3).
#
# `proxy.connectionName` + `proxy.gcpServiceAccount` are pinned by
# `just gcp-cloudsql-wire` once the DatabaseInstance
# MR has published `status.atProvider.connectionName` and the
# Workload Identity binding has been minted.
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: queenswood-keycloak
  namespace: {{ .Values.env.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    description: Keycloak instance on GKE
spec:
  forProvider:
    chart:
      name: {{ .Values.queenswoodKeycloak.chart.name }}
      repository: {{ .Values.queenswoodKeycloak.chart.repository }}
      version: {{ .Values.queenswoodKeycloak.chart.version }}
    namespace: {{ .Values.env.name }}
    values:
      env:
        name: {{ .Values.env.name }}
        domain: {{ .Values.env.domain }}
      # Google IdP client secret via Keycloak's files-plaintext vault.
      # The Secret is applied by `just gcp-keycloak-vault-secret`, and
      # the mount is optional -- safe to enable before the Secret
      # exists, since Google sign-in is already unavailable until it
      # does.
      vault:
        enabled: true
      postgresql:
        mode: external
        external:
          # Username + password match the CloudSQL User MR + Secret
          # in `infra/gcp/database/`. The chart renders these into
          # a Secret on GKE that the Keycloak CR's usernameSecret /
          # passwordSecret refs point at -- sidesteps the cross-
          # cluster sync we'd otherwise need to pull the Crossplane-
          # composed conn Secret from
          # kind to GKE.
          # Must match the CloudSQL User MR + Secret defined in
          # `infra/gcp/database/`. Hardcoded here so both sides
          # share the same source-of-truth in the repo; rotating
          # means changing both files.
          username: "keycloak"
          password: "change-me-keycloak-db-password"
          proxy:
            connectionName: {{ .Values.queenswoodKeycloak.proxy.connectionName | quote }}
            gcpServiceAccount: {{ .Values.queenswoodKeycloak.proxy.gcpServiceAccount | quote }}
  providerConfigRef:
    name: {{ .Values.release.providerConfigRef }}
{{- end }}
