{{- if .Values.keycloakDatabase.enabled }}
# Input Secret the XKeycloakDatabase composite's `User` resource
# reads via `passwordSecretRef`. Crossplane writes this same value
# back out into `<instanceName>-conn` (alongside the username) for
# downstream consumers; the keycloak chart mounts that one.
#
# Default value here is a dev-only placeholder. For production,
# override via a values file or pre-create the Secret out-of-band
# (Sealed Secret, Vault sync, etc.) before Argo first syncs this
# chart — the operator's reconcile will adopt whatever's there.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloakDatabase.instanceName }}-password
  namespace: {{ .Values.env.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
type: Opaque
stringData:
  password: {{ .Values.keycloakDatabase.password | quote }}
{{- end }}
