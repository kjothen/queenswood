apiVersion: v2
name: queenswood-platform
description: |
  Per-environment GCP platform resources for queenswood: a Cloud DNS
  ManagedZone, the apex A-record + reserved IP, a Certificate Manager
  certificate, and the Crossplane Helm Release that installs the
  application chart. Parameterised on env.name and env.domain so the
  same chart drives queenswood, queenswood-test, etc.
type: application
version: 0.1.0
appVersion: "0.1.0"
