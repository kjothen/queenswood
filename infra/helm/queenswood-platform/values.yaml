# The two knobs that change per environment. Everything else
# (resource names, app namespace) derives from `env.name`.
env:
  name: queenswood
  domain: queenswood.repldriven.com

apex:
  region: europe-west2

cert:
  location: europe-west2

# Keycloak's Postgres backing — `enabled: true` on GCP spins up a
# CloudSQL Postgres instance via Crossplane (XKeycloakDatabase) so
# the queenswood-keycloak chart can run in `postgresql.mode:
# external` mode. The chart writes connection details into a Secret
# the cloud-sql-proxy in the queenswood-keycloak chart consumes.
keycloakDatabase:
  enabled: true
  region: europe-west2
  instanceName: queenswood-keycloak
  databaseName: keycloak
  username: keycloak
  # Initial password the composite's `User` resource picks up via
  # `passwordSecretRef`. Dev-only placeholder; rotate post-deploy
  # (or pre-create the Secret out-of-band before first sync).
  password: change-me-keycloak-db-password
  # `db-custom-<vCPUs>-<memMB>` — smallest legal Postgres shape;
  # shared-core (`db-f1-micro`) is MySQL-only.
  tier: db-custom-1-3840
  postgresVersion: POSTGRES_16

release:
  chart:
    name: queenswood
    repository: oci://ghcr.io/repldriven
    version: 0.5.3
  # The Crossplane provider-config that owns GKE-bound Helm releases.
  # Shared by the queenswood, queenswood-keycloak, and
  # keycloak-operator Release resources below.
  providerConfigRef: queenswood-gke
  image:
    registry: ghcr.io/repldriven
    tag: latest

# Cluster-scoped Keycloak Operator (CRDs + controller). Pulled onto
# GKE via the same Crossplane provider-helm path as the app chart.
keycloakOperator:
  enabled: true
  chart:
    name: keycloak-operator
    repository: oci://ghcr.io/repldriven
    version: 0.1.2

# Per-env Keycloak instance + cloud-sql-proxy. The two `proxy.*`
# fields are pinned by `just gcp-keycloak-cloudsql-pin-values` once
# the XKeycloakDatabase composite has published its
# `status.connectionName`. Empty defaults are the cold-start state;
# the recipe rewrites them in place.
queenswoodKeycloak:
  enabled: true
  chart:
    name: queenswood-keycloak
    repository: oci://ghcr.io/repldriven
    version: 0.2.3
  proxy:
    connectionName: ""
    gcpServiceAccount: ""
