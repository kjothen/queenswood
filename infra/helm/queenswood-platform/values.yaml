# The two knobs that change per environment. Everything else
# (resource names, app namespace) derives from `env.name`.
env:
  name: queenswood
  domain: queenswood.repldriven.com

apex:
  region: europe-west2

cert:
  location: europe-west2

release:
  chart:
    name: queenswood
    repository: oci://ghcr.io/repldriven
    version: 0.8.0
  # The Crossplane provider-config that owns GKE-bound Helm releases.
  # Shared by the queenswood, queenswood-keycloak, and
  # keycloak-operator Release resources below.
  providerConfigRef: queenswood-gke
  image:
    registry: ghcr.io/repldriven/queenswood
    tag: latest

# Cluster-scoped Keycloak Operator (CRDs + controller). Pulled onto
# GKE via the same Crossplane provider-helm path as the app chart.
keycloakOperator:
  enabled: true
  chart:
    name: keycloak-operator
    repository: oci://ghcr.io/repldriven
    version: 0.1.2

# Per-env Keycloak instance + cloud-sql-proxy. The two `proxy.*`
# fields are pinned by `just gcp-cloudsql-wire` once
# the CloudSQL DatabaseInstance MR (in `infra/gcp/database/`) has
# published its `status.atProvider.connectionName`. Empty defaults
# are the cold-start state; the recipe rewrites them in place.
queenswoodKeycloak:
  enabled: true
  chart:
    name: queenswood-keycloak
    repository: oci://ghcr.io/repldriven
    version: 0.3.1
  proxy:
    connectionName: queenswood-820d84:europe-west2:queenswood-keycloak
    gcpServiceAccount: keycloak-sql-proxy@queenswood-820d84.iam.gserviceaccount.com
  # Server-side Keycloak config consumed by the queenswood chart's
  # bank-api + bootstrap. baseUrl is derived from env.domain in the
  # Release template (https://keycloak.<env-domain>) -- the EXTERNAL
  # hostname, with one LB round-trip per call. The alternative
  # in-cluster Service URL mints tokens whose `iss` claim embeds
  # the configured `hostname.hostname` (external), which doesn't
  # match what bank-api derives from base-url (internal). Aligning
  # at external keeps the iss match without code changes; a future
  # Envoy egress would let us go internal again while preserving
  # the external iss. The admin client secret is not configured here:
  # the queenswood chart generates it and its bootstrap Job pushes it
  # into Keycloak, so no copy of it exists in git.
  serverSide:
    realm: queenswood
    adminClientId: queenswood-admin
