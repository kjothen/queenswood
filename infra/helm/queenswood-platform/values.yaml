# The two knobs that change per environment. Everything else
# (resource names, app namespace) derives from `env.name`.
env:
  name: queenswood
  domain: queenswood.repldriven.com

apex:
  region: europe-west2

# Continuous FDB backup to the tier-0 bucket. The three credentials are
# supplied by the root Application from `pass`, and the bucket is
# derived there from the project id; empty defaults are the state
# before a bootstrap has passed them, and leave the backup off.
fdbBackup:
  enabled: true
  bucket: ""
  # Container this cluster's backup writes to, one per cluster
  # generation. Minted by `just gcp-up` and rotated by `gcp-down`, so a
  # rebuilt cluster never shares a container with the one it replaced --
  # which is what let `fdbbackup describe` answer with a previous
  # generation's restore point.
  name: ""
  # Must match the bucket's location -- it is what the SigV4 signature
  # is computed over, not merely where requests are routed.
  region: europe-west2
  accessKeyId: ""
  secretAccessKey: ""
  encryptionKey: ""

# Backup version a rebuilt cluster restores from before anything
# writes to it. A target rather than a mode -- see the queenswood
# chart's fdb.restore values. Supplied by the root Application from
# what `just gcp-fdb-export` recorded at teardown; empty means a
# fresh environment that has nothing to restore.
fdbRestore:
  version: ""
  # Container that version lives in -- the generation recorded at the
  # last teardown, not the one this cluster is about to write. Empty
  # falls back to the backup container, right only where there has been
  # exactly one generation.
  backupName: ""

cert:
  location: europe-west2

release:
  chart:
    name: queenswood
    repository: oci://ghcr.io/repldriven
    version: 0.11.4
  # The Crossplane provider-config that owns GKE-bound Helm releases.
  # Shared by the queenswood, queenswood-keycloak, and
  # keycloak-operator Release resources below.
  providerConfigRef: queenswood-gke
  image:
    registry: ghcr.io/repldriven/queenswood
    tag: latest

# Cluster-scoped Keycloak Operator (CRDs + controller). Pulled onto
# GKE via the same Crossplane provider-helm path as the app chart.
keycloakOperator:
  enabled: true
  chart:
    name: keycloak-operator
    repository: oci://ghcr.io/repldriven
    version: 0.1.2

# Per-env Keycloak instance + cloud-sql-proxy. The two `proxy.*`
# fields are pinned by `just gcp-cloudsql-wire` once
# the CloudSQL DatabaseInstance MR (in `infra/gcp/database/`) has
# published its `status.atProvider.connectionName`. Empty defaults
# are the cold-start state; the recipe rewrites them in place.
# Keycloak realm export a rebuilt environment imports from, instead of
# the chart's committed realm definitions. Supplied by the root
# Application from what `just gcp-keycloak-export` recorded at
# teardown; empty imports the committed definitions, which mints new
# user ids and so duplicates a bank restored from FDB alongside it.
keycloakRestore:
  realms: ""
  bucket: ""
  project: ""
  gcpServiceAccount: ""

# Scheduled realm export, the other half of the pair above. Supplied by
# the root Application from the project id -- it needs no credential of
# its own, writing through Workload Identity.
keycloakBackup:
  enabled: false
  bucket: ""
  project: ""
  gcpServiceAccount: ""

queenswoodKeycloak:
  enabled: true
  chart:
    name: queenswood-keycloak
    repository: oci://ghcr.io/repldriven
    version: 0.6.1
  # Supplied by the root Application from `pass`, the same substitution
  # that sets it on the CloudSQL user -- which is what keeps the two
  # sides in step. Previously a literal in two files with a comment
  # asking whoever rotated it to remember both.
  dbPassword: ""
  proxy:
    connectionName: queenswood-820d84:europe-west2:queenswood-keycloak
    gcpServiceAccount: keycloak-sql-proxy@queenswood-820d84.iam.gserviceaccount.com
  # Server-side Keycloak config consumed by the queenswood chart's
  # bank-api + bootstrap. baseUrl is derived from env.domain in the
  # Release template (https://keycloak.<env-domain>) -- the EXTERNAL
  # hostname, with one LB round-trip per call. The alternative
  # in-cluster Service URL mints tokens whose `iss` claim embeds
  # the configured `hostname.hostname` (external), which doesn't
  # match what bank-api derives from base-url (internal). Aligning
  # at external keeps the iss match without code changes; a future
  # Envoy egress would let us go internal again while preserving
  # the external iss. The admin client secret is not configured here:
  # the queenswood chart generates it and its bootstrap Job pushes it
  # into Keycloak, so no copy of it exists in git.
  serverSide:
    realm: queenswood
    adminClientId: queenswood-admin
