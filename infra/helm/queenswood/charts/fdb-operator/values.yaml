---
image:
  repository: foundationdb/fdb-kubernetes-operator
  tag: v2.33.0
  pullPolicy: IfNotPresent
initContainers:
  # Each key is an FDB minor version and the init container copies
  # libfdb_c_<key>.so out of the image, so the tag MUST stay on that
  # same minor. Renovate cannot see that constraint -- the monitor
  # image is disabled in renovate.json for this reason.
  7.1:
    image:
      repository: foundationdb/fdb-kubernetes-monitor
      tag: 7.1.67
      pullPolicy: IfNotPresent
  7.3:
    image:
      repository: foundationdb/fdb-kubernetes-monitor
      tag: 7.3.75
      pullPolicy: IfNotPresent
  7.4:
    image:
      repository: foundationdb/fdb-kubernetes-monitor
      tag: 7.4.6
      pullPolicy: IfNotPresent
globalMode:
  enabled: false
replicas: null
imagePullSecrets: []
annotations: {}
podAnnotations: {}
podLabels: {}
serviceAccount:
  create: true
  name: null
  imagePullSecrets: []
  annotations: {}
priorityClassName: null
securityContext:
  runAsUser: 4059
  runAsGroup: 4059
  fsGroup: 4059
containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - all
  readOnlyRootFilesystem: true
nodeSelector: {}
affinity: {}
tolerations: {}
extraEnv: []
volumes: []
volumeMounts: []
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 500m
    memory: 256Mi
initContainersResources:
  limits:
    cpu: 10m
    memory: 50Mi
  requests:
    cpu: 10m
    memory: 50Mi
initContainerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - all
  readOnlyRootFilesystem: true
nodeReadClusterRole: true
