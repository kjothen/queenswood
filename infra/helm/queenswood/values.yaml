# -- Container image registry + tag shared by every Queenswood service.
# The image NAME is taken from the service entry's key in `services` below
# (e.g. {{ image.registry }}/bank-api-service:{{ image.tag }}).
image:
  registry: ghcr.io/repldriven
  tag: "0.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# -- Required secrets.
secrets:
  # The Keycloak admin client secret matches the realm-import JSON's
  # `queenswood-admin` client. Used by bank-api / bootstrap to mint
  # admin tokens against the Keycloak Admin REST API (creating per-
  # org service-account clients on org-create). Override at install:
  #   --set secrets.keycloakAdminClientSecret=...
  keycloakAdminClientSecret: ""

# -- Keycloak connection details for server-side calls (bank-api +
# bootstrap reach the Keycloak Admin REST API to register service
# accounts; bank-api also validates JWTs via the realm's JWKS). The
# default baseUrl assumes Keycloak runs in the same namespace via
# the operator-published Service `queenswood-keycloak-keycloak-
# service` -- override to an external URL (or an Envoy egress
# entry) if Keycloak lives elsewhere.
keycloak:
  baseUrl: "http://queenswood-keycloak-keycloak-service:8080"
  realm: queenswood
  adminClientId: queenswood-admin
  # Public client id the bank-console SPA uses for Authorization
  # Code + PKCE. Must match the `clientId` of the corresponding
  # `clients[]` entry in `files/keycloak-realm.json`.
  consoleClientId: queenswood-console
  # Second realm hosting Queenswood operator users (bank-app SPA).
  # Same Keycloak instance, separate realm. bank-api wires a second
  # identity-provider pointed at this realm.
  opsRealm: queenswood-ops
  # Override the iss claim the verifier expects on the ops realm
  # when base-url is an in-cluster Service URL but Keycloak embeds
  # its public hostname in tokens. Leave empty to default to
  # `<baseUrl>/realms/<opsRealm>`.
  opsExpectedIssuer: ""
  # Public client id the bank-app SPA uses against the ops realm.
  opsClientId: queenswood-app
  # Override the iss the verifier expects on incoming JWTs. Leave
  # empty to default to `<baseUrl>/realms/<realm>`. Set when
  # Keycloak's public `hostname.hostname` differs from base-url --
  # the typical deployed shape where base-url is the in-cluster
  # Service URL for fast admin REST calls but tokens carry the
  # public issuer URL.
  expectedIssuer: ""
  # -- Bundled dev Keycloak for any standalone install of this chart
  # (local kind/k3s, the published OCI artifact). Renders a single-
  # replica Deployment + matching Service + ConfigMap-mounted realm
  # import. On GKE this is explicitly disabled by queenswood-platform's
  # Release, because Keycloak is provided there by the operator-driven
  # queenswood-keycloak chart (its operator-published Service shares
  # the same `queenswood-keycloak-keycloak-service` name so
  # `keycloak.baseUrl` resolves either way).
  dev:
    enabled: true
    image: quay.io/keycloak/keycloak:26.0
    # Keycloak's master-realm bootstrap admin. Dev-only credentials.
    adminUser: admin
    adminPassword: admin
    # When .Values.secrets.keycloakAdminClientSecret is empty AND
    # dev.enabled is true, the secret-keycloak template falls back to
    # this value so it matches the dev realm's queenswood-admin client
    # secret. The realm JSON committed under files/ hardcodes the same
    # literal -- keep them in sync.
    realmAdminClientSecret: "queenswood-admin-secret-change-me"

# -- OpenTelemetry collector endpoint (gets passed as OTEL_ENDPOINT env
# to every service). Leave empty to disable.
otel:
  endpoint: ""

# -- One-shot migrator Job. Applies FDB record metadata (via
# fdb/meta-store-write) and declares the Pulsar topology
# (tenants/namespaces/topics/schemas). Runs first; bootstrap Job
# waits on its completion before seeding domain records.
migrator:
  enabled: true
  resources:
    limits: { cpu: "1000m", memory: "1Gi" }
    requests: { cpu: "100m", memory: "512Mi" }

# -- One-shot bootstrap Job. Idempotently seeds the singleton
# internal Queenswood organization + platform/micro Policy records.
# Runs after the migrator Job; service Deployments block on this
# Job (kubectl wait) before starting their main container, so the
# whole chain is migrator → bootstrap → services.
bootstrap:
  enabled: true
  resources:
    limits: { cpu: "1000m", memory: "1Gi" }
    requests: { cpu: "100m", memory: "512Mi" }

# -- Public Gateway for the bank-app SPA (which proxies `/v1/*` to
# bank-api internally). When `gcp.enabled` is true the templates
# emit a Gateway with gatewayClassName gke-l7-regional-external-managed,
# a NamedAddress reference to a regional Address, an annotation
# binding it to a Certificate Manager CertificateMap, plus two
# HTTPRoutes (production traffic + an HTTP->HTTPS redirect). When
# false the Gateway uses `className` and serves plain HTTP for
# non-GKE setups.
gateway:
  enabled: false
  className: ""
  host: bank-api.local
  # Second hostname the public Gateway terminates on, routed to the
  # bank-console SPA. Kept distinct from `host` so the SPA can keep
  # its keycloak-js redirectUris + post-logout origins clean.
  consoleHost: console.bank-api.local
  gcp:
    enabled: false
    # Regional Address provisioned in infra/gcp/networking.yml.
    staticIpName: queenswood-ingress-ip
    # Certificate Manager certs to bind to the HTTPS listener.
    # Comma-separated for multiple. Cert provisioned in
    # infra/gcp/certificates.yml.
    certManagerCerts: queenswood-cert

# -- Frontend SPA (Svelte/Vite served by nginx). Image name is `bank-app`
# under {{ image.registry }}. The container's nginx proxies `/v1/*` to
# `apiUpstream`; the value supports `{{ .Release.Name }}` interpolation
# so the default points at the in-cluster bank-api service.
bankApp:
  enabled: true
  port: 8080
  replicas: 1
  apiUpstream: "http://{{ .Release.Name }}-bank-api-service:8080"
  # Public URL of the realm the bank-app SPA authenticates against.
  # Empty falls back to the build-time default (useful for Vite dev
  # against the chart's bundled dev Keycloak via port-forward); set
  # to `https://keycloak.<env>.repldriven.com` on GKE.
  keycloakPublicUrl: ""
  # Optional federated IdP alias for skip-straight-to-Google flows.
  # Empty in dev so the Keycloak login form renders for the seeded
  # `ops` / `ops` user; set to `google` once real Google OAuth
  # credentials are wired into the ops realm.
  keycloakIdpHint: ""
  resources:
    limits: { cpu: "200m", memory: "128Mi" }
    requests: { cpu: "50m", memory: "64Mi" }

# -- Human-identity SPA. nginx in the pod proxies `/v1/*` to bank-api
# (same pattern as bank-app) and serves a synthesised /env.js so the
# SPA picks up its Keycloak URL at runtime. Image name is `bank-console`.
bankConsole:
  enabled: true
  port: 8080
  replicas: 1
  apiUpstream: "http://{{ .Release.Name }}-bank-api-service:8080"
  # Public URL of the realm endpoint the browser calls. Empty means
  # the SPA falls back to its build-time default — leave empty for
  # Vite dev (which uses VITE_KEYCLOAK_URL) and set to e.g.
  # `https://keycloak.<env>.repldriven.com` on GKE.
  keycloakPublicUrl: ""
  # Optional federated IdP alias. When set (e.g. "google"), the SPA
  # skips Keycloak's own login form and redirects straight to that
  # provider. Empty by default so the realm's login screen renders;
  # set to "google" in production values for a one-click Sign-In-
  # with-Google flow.
  keycloakIdpHint: ""
  resources:
    limits: { cpu: "200m", memory: "128Mi" }
    requests: { cpu: "50m", memory: "64Mi" }

# ---------------------------------------------------------------------
# Per-service settings. Each key maps to one Deployment + (if http=true)
# one Service. Set enabled: false to skip a service.
# Image name is the same as the key.
# ---------------------------------------------------------------------
services:
  bank-api-service:
    enabled: true
    http: true
    port: 8080
    replicas: 1
    resources:
      limits: { cpu: "1000m", memory: "1500Mi" }
      requests: { cpu: "200m", memory: "768Mi" }
    extraEnv:
      CLEARBANK_ADAPTER_URL: "http://{{ .Release.Name }}-bank-clearbank-adapter-service:8082"

  bank-cash-account-processor-service:
    enabled: true
    replicas: 1
    resources:
      limits: { cpu: "750m", memory: "1Gi" }
      requests: { cpu: "100m", memory: "512Mi" }

  bank-party-processor-service:
    enabled: true
    replicas: 1

  bank-payment-processor-service:
    enabled: true
    replicas: 1

  bank-interest-processor-service:
    enabled: true
    replicas: 1

  bank-transaction-processor-service:
    enabled: true
    replicas: 1

  bank-idv-processor-service:
    enabled: true
    replicas: 1

  bank-clearbank-adapter-service:
    enabled: true
    http: true
    port: 8082
    replicas: 1
    waitFor:
      - service: bank-clearbank-simulator-service
        port: 8081
    extraEnv:
      CLEARBANK_SIMULATOR_URL: "http://{{ .Release.Name }}-bank-clearbank-simulator-service:8081"
      CLEARBANK_ADAPTER_PUBLIC_URL: "http://{{ .Release.Name }}-bank-clearbank-adapter-service:8082"

  bank-clearbank-simulator-service:
    # Disabled in production values; enable for dev/non-prod.
    enabled: true
    http: true
    port: 8081
    replicas: 1

  bank-onfido-adapter-service:
    enabled: true
    http: true
    port: 8084
    replicas: 1
    waitFor:
      - service: bank-onfido-simulator-service
        port: 8083
    extraEnv:
      ONFIDO_URL: "http://{{ .Release.Name }}-bank-onfido-simulator-service:8083"
      IDV_ONFIDO_ADAPTER_PUBLIC_URL: "http://{{ .Release.Name }}-bank-onfido-adapter-service:8084"

  bank-onfido-simulator-service:
    enabled: true
    http: true
    port: 8083
    replicas: 1

# ---------------------------------------------------------------------
# FDB cluster managed by the FDB Kubernetes operator. The version MUST
# match the FDB client (libfdb_c) baked into the service image (7.3.75).
# Defaults are sized for a single-node dev cluster (kind/k3s); raise
# processCounts and resources for production.
# ---------------------------------------------------------------------
fdb:
  enabled: true
  version: "7.3.75"
  storageEngine: "ssd-redwood-1"
  processCounts:
    cluster_controller: 1
    storage: 1
    log: 1
    stateless: -1
  storage:
    storageClass: ""
    size: "4Gi"
  # Per-process resource caps. The operator default is ~8Gi per pod,
  # which doesn't fit a kind/k3s single-node cluster. Bump for prod.
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# Sub-chart: FDB Kubernetes Operator (CRDs + controller).
# nameOverride forces lowercase resource names — the chart derives
# them from `.Chart.Name` which (because we alias the dependency as
# `fdbOperator`) would otherwise produce mixed-case names that fail
# RFC-1123 validation on apply.
fdbOperator:
  enabled: true
  nameOverride: fdb-operator

# ---------------------------------------------------------------------
# Sub-chart: Apache Pulsar. Override anything from
# https://github.com/apache/pulsar-helm-chart/blob/master/charts/pulsar/values.yaml
# ---------------------------------------------------------------------
pulsar:
  enabled: true
  initialize: true
  components:
    bookkeeper: true
    broker: true
    zookeeper: true
    proxy: false
    autorecovery: false
    functions: false
    pulsar_manager: false
    toolset: true
  # Skip the victoria-metrics-k8s-stack sub-subchart (VMSingle, VMAgent,
  # VMRule, VMServiceScrape, VMNodeScrape, plus operator + node-exporter)
  # — adds significant memory pressure unsuited for dev. Pulsar chart
  # 3.7.x switched its monitoring stack from Prometheus operator
  # (kube-prometheus-stack) to VictoriaMetrics; the older
  # `kube-prometheus-stack.*` keys are now no-ops. Re-enable for
  # non-trivial environments.
  victoria-metrics-k8s-stack:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  # Per-component scrape objects (PodMonitor pre-3.7, VMServiceScrape
  # post-3.7) depend on the monitoring stack's CRDs; disabling the stack
  # means we must skip these too or helm install fails on `no matches
  # for kind ...`.
  zookeeper:
    replicaCount: 1
    persistence: false
    podMonitor: { enabled: false }
  bookkeeper:
    replicaCount: 1
    persistence: false
    podMonitor: { enabled: false }
  broker:
    replicaCount: 1
    podMonitor: { enabled: false }
    configData:
      managedLedgerDefaultEnsembleSize: "1"
      managedLedgerDefaultWriteQuorum: "1"
      managedLedgerDefaultAckQuorum: "1"
      allowAutoTopicCreation: "false"
      isAllowAutoUpdateSchemaEnabled: "false"
      isSchemaValidationEnforced: "true"
  proxy:
    podMonitor: { enabled: false }
  autorecovery:
    podMonitor: { enabled: false }
