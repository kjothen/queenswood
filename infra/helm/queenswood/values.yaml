# -- Container image registry + tag shared by every Queenswood service.
# The image NAME is taken from the service entry's key in `services` below
# (e.g. {{ image.registry }}/api-service:{{ image.tag }}).
image:
  registry: ghcr.io/repldriven/queenswood
  tag: "0.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# -- Required secrets.
secrets:
  # The Keycloak admin client secret matches the realm-import JSON's
  # `queenswood-admin` client. Used by bank-api / bootstrap to mint
  # admin tokens against the Keycloak Admin REST API (creating per-
  # org service-account clients on org-create). Override at install:
  #   --set secrets.keycloakAdminClientSecret=...
  keycloakAdminClientSecret: ""

# -- Keycloak connection details for server-side calls (bank-api +
# bootstrap reach the Keycloak Admin REST API to register service
# accounts; bank-api also validates JWTs via the realm's JWKS). The
# default baseUrl assumes Keycloak runs in the same namespace via
# the operator-published Service `queenswood-keycloak-keycloak-
# service` -- override to an external URL (or an Envoy egress
# entry) if Keycloak lives elsewhere.
keycloak:
  # Gate bootstrap on the queenswood-keycloak chart's realm import.
  # Registering the admin signing key before the realm is imported
  # would be undone by it. Off by default because a standalone install
  # runs the bundled dev Keycloak, where no such Job exists and the
  # gate would wait for something that never appears.
  waitForRealmImport: false
  # The bundled dev Keycloak runs under the `/keycloak/` path
  # (KC_HTTP_RELATIVE_PATH) so the SPA's same-origin proxy carries a
  # consistent prefix and Keycloak's own generated URLs include it.
  # bank-api's admin REST calls land at this baseUrl too. On GKE the
  # operator-driven Keycloak runs at the root of its dedicated
  # hostname, so queenswood-platform overrides this back to "...:8080".
  baseUrl: "http://queenswood-keycloak-keycloak-service:8080/keycloak"
  realm: queenswood
  adminClientId: queenswood-admin
  # Public client id the console SPA uses for Authorization
  # Code + PKCE. Must match the `clientId` of the corresponding
  # `clients[]` entry in `files/keycloak-realm.json`.
  consoleClientId: queenswood-console
  # Second realm hosting Queenswood operator users. Same Keycloak
  # instance, separate realm. bank-api wires a second identity-provider
  # pointed at this realm so it still accepts operator JWTs; there is
  # no operator SPA in this chart any more, so
  # the realm currently has no first-party browser client.
  opsRealm: queenswood-ops
  # Override the iss claim the verifier expects on the ops realm when
  # base-url is an in-cluster Service URL but Keycloak embeds its
  # public hostname in tokens. The localhost:8081 default is a legacy
  # value from the removed operator SPA's same-origin Keycloak proxy;
  # GKE overrides to the public hostname.
  opsExpectedIssuer: "http://localhost:8081/keycloak/realms/queenswood-ops"
  # Operator-realm client id retained for the second identity-provider.
  opsClientId: queenswood-app
  # Override the iss the verifier expects on incoming JWTs. Same
  # shape as opsExpectedIssuer above: default matches the console
  # SPA's same-origin Keycloak proxy at `localhost:8081/keycloak`;
  # GKE overrides to the public hostname.
  expectedIssuer: "http://localhost:8081/keycloak/realms/queenswood"
  # -- Bundled dev Keycloak for any standalone install of this chart
  # (local kind/k3s, the published OCI artifact). Renders a single-
  # replica Deployment + matching Service + ConfigMap-mounted realm
  # import. On GKE this is explicitly disabled by queenswood-platform's
  # Release, because Keycloak is provided there by the operator-driven
  # queenswood-keycloak chart (its operator-published Service shares
  # the same `queenswood-keycloak-keycloak-service` name so
  # `keycloak.baseUrl` resolves either way).
  dev:
    enabled: true
    image: quay.io/keycloak/keycloak:26.7.0
    # Keycloak's master-realm bootstrap admin. Dev-only credentials.
    adminUser: admin
    adminPassword: admin

  # Admin REST credentials the bootstrap Job uses to push the generated
  # admin client secret into Keycloak. Empty means the bundled dev
  # Keycloak, whose credentials are the dev.admin* values above; on GKE
  # queenswood-platform points this at the Secret the Keycloak operator
  # mints for its own instance.
  adminSecret:
    name: ""
    usernameKey: username
    passwordKey: password

  # Services that call the Admin REST API and therefore need the admin
  # client's signing key mounted. `bank` issues a per-bank service-
  # account client on creation and runs in the operational group, which
  # is why that service is on the list. Everything else gets nothing --
  # previously every service carried the credential whether or not it
  # had any use for it.
  consumers:
    - api-service
    - operational-processors-service
    - monolith-service

# -- OpenTelemetry collector endpoint (gets passed as OTEL_ENDPOINT env
# to every service). Empty falls back to the in-chart Jaeger when
# jaeger.enabled=true, and disables the SDK otherwise. Set explicitly to
# ship elsewhere.
otel:
  endpoint: ""

# ---------------------------------------------------------------------
# All-in-one Jaeger for the kind dev loop. Receives OTLP/HTTP on 4318 and
# serves its UI on 16686. Storage is in-memory. Production sets
# enabled=false and points otel.endpoint at a real collector.
jaeger:
  enabled: true
  image: jaegertracing/jaeger:2.20.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- One-shot migrator Job. Applies FDB record metadata (via
# fdb/meta-store-write) and creates the Kafka topics. Runs first;
# bootstrap Job waits on its completion before seeding domain records.
migrator:
  enabled: true
  resources:
    limits: { cpu: "1000m", memory: "1Gi" }
    requests: { cpu: "100m", memory: "512Mi" }

# -- One-shot bootstrap Job. Idempotently seeds the platform and micro
# Policy records and the four cash-account-product templates. There is
# no organization to seed -- a user's first login creates their own
# bank. Runs after the migrator Job; service Deployments block on this
# Job (kubectl wait) before starting their main container, so the
# whole chain is migrator → bootstrap → services.
bootstrap:
  enabled: true
  resources:
    limits: { cpu: "1000m", memory: "1Gi" }
    requests: { cpu: "100m", memory: "512Mi" }

# -- Public Gateway for the console SPA (which proxies `/v1/*` to
# bank-api internally). When `gcp.enabled` is true the templates
# emit a Gateway with gatewayClassName gke-l7-regional-external-managed,
# a NamedAddress reference to a regional Address, an annotation
# binding it to a Certificate Manager CertificateMap, plus two
# HTTPRoutes (production traffic + an HTTP->HTTPS redirect). When
# false the Gateway uses `className` and serves plain HTTP for
# non-GKE setups.
gateway:
  enabled: false
  className: ""
  host: api.local
  # Second hostname the public Gateway terminates on, routed to the
  # console SPA. Kept distinct from `host` so the SPA can keep
  # its keycloak-js redirectUris + post-logout origins clean.
  consoleHost: console.api.local
  # Third hostname, routed to bank-api. Its own origin so CORS stays an
  # explicit allowlist and the API shares no origin with browser JS.
  apiHost: api.api.local
  gcp:
    enabled: false
    # Regional Address provisioned in infra/gcp/networking.yml.
    staticIpName: queenswood-ingress-ip
    # Certificate Manager certs to bind to the HTTPS listener.
    # Comma-separated for multiple. Cert provisioned in
    # infra/gcp/certificates.yml.
    certManagerCerts: queenswood-cert

# -- Human-identity SPA. nginx in the pod proxies `/v1/*` to bank-api
# and serves a synthesised /env.js so the SPA picks up its Keycloak
# URL at runtime. Image name is `console`.
console:
  enabled: true
  port: 8080
  replicas: 1
  apiUpstream: "http://{{ .Release.Name }}-api-service:8080"
  # In-cluster Service the nginx `/keycloak/*` reverse-proxies to so
  # the SPA stays same-origin. Defaults to the bundled dev Keycloak
  # Service; GKE overrides to the operator-published Service URL.
  keycloakUpstream: "http://queenswood-keycloak-keycloak-service:8080"
  # Public URL of the realm endpoint the browser calls. Default is
  # the SPA's own same-origin `/keycloak` path so a bare `helm install`
  # works after one `kubectl port-forward svc/<release>-console
  # 8081:8080`; GKE overrides via queenswood-platform.
  keycloakPublicUrl: "http://localhost:8081/keycloak"
  # Optional federated IdP alias. When set (e.g. "google"), the SPA
  # skips Keycloak's own login form and redirects straight to that
  # provider. Empty by default so the realm's login screen renders;
  # set to "google" in production values for a one-click Sign-In-
  # with-Google flow.
  keycloakIdpHint: ""
  resources:
    limits: { cpu: "200m", memory: "128Mi" }
    requests: { cpu: "50m", memory: "64Mi" }

# ---------------------------------------------------------------------
# Per-service settings. Each key maps to one Deployment + (if http=true)
# one Service. Set enabled: false to skip a service.
# Image name is the same as the key.
# ---------------------------------------------------------------------
services:
  api-service:
    enabled: true
    http: true
    port: 8080
    replicas: 1
    resources:
      limits: { cpu: "1000m", memory: "1500Mi" }
      requests: { cpu: "200m", memory: "768Mi" }

  # Money path: payment, transaction, interest, payee-check processors
  # in one JVM. Payee-check invokes the ClearBank adapter for
  # Confirmation of Payee, hence CLEARBANK_ADAPTER_URL.
  financial-processors-service:
    enabled: true
    replicas: 1
    resources:
      limits: { cpu: "1500m", memory: "2Gi" }
      requests: { cpu: "300m", memory: "1Gi" }
    extraEnv:
      CLEARBANK_ADAPTER_URL: "http://{{ .Release.Name }}-external-adapters-service:8082"

  # Provisioning + identity: bank, party, cash-account, product, idv
  # processors in one JVM. Bank provisioning issues service-account
  # clients, hence the Keycloak env (from the shared env block).
  operational-processors-service:
    enabled: true
    replicas: 1
    resources:
      limits: { cpu: "1000m", memory: "1536Mi" }
      requests: { cpu: "200m", memory: "768Mi" }

  # Work that must have exactly one dispatcher, whatever else scales:
  # the changelog runners that own every store's cursor, and the Quartz
  # scheduler that registers a trigger per enabled job. Both would
  # double-act on a second replica, so this stays at 1 — scale the
  # relay tier by sharding stores across deployments, not by adding
  # replicas here. Keeping them together is what leaves every other
  # group free of the constraint.
  exclusive-dispatchers-service:
    enabled: true
    replicas: 1
    resources:
      limits: { cpu: "1000m", memory: "1536Mi" }
      requests: { cpu: "200m", memory: "768Mi" }

  # Every external-vendor adapter and the simulators that stand in for
  # those vendors, in one JVM: ClearBank (8081 simulator / 8082
  # adapter), Onfido (8083 / 8084), Companies House (8085 simulator,
  # bus-only adapter). Adapters reach their simulator over localhost, so
  # there is no cross-pod wait and no webhook registration race. The
  # `_URL` env vars stay so a deployment can point an adapter at the
  # real vendor instead. Port 8082 is the probe target because it is
  # the one financial-processors calls (Confirmation of Payee).
  external-adapters-service:
    enabled: true
    http: true
    port: 8082
    extraPorts:
      - name: clearbank-sim
        port: 8081
      - name: onfido-sim
        port: 8083
      - name: onfido
        port: 8084
      - name: companies-sim
        port: 8085
    replicas: 1
    resources:
      limits: { cpu: "1500m", memory: "2Gi" }
      requests: { cpu: "300m", memory: "1Gi" }
    extraEnv:
      CLEARBANK_SIMULATOR_URL: "http://localhost:8081"
      CLEARBANK_ADAPTER_PUBLIC_URL: "http://localhost:8082"
      ONFIDO_URL: "http://localhost:8083"
      IDV_ONFIDO_ADAPTER_PUBLIC_URL: "http://localhost:8084"
      COMPANIES_HOUSE_URL: "http://localhost:8085"

# ---------------------------------------------------------------------
# FDB cluster managed by the FDB Kubernetes operator. The version MUST
# match the FDB client (libfdb_c) baked into the service image (7.3.75).
# Defaults are sized for a single-node dev cluster (kind/k3s); raise
# processCounts and resources for production.
# ---------------------------------------------------------------------
fdb:
  enabled: true
  version: "7.3.75"
  storageEngine: "ssd-redwood-1"
  processCounts:
    cluster_controller: 1
    storage: 1
    log: 1
    stateless: -1
  storage:
    storageClass: ""
    size: "4Gi"
  # Per-process resource caps. The operator default is ~8Gi per pod,
  # which doesn't fit a kind/k3s single-node cluster. Bump for prod.
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  # Continuous backup to object storage. Off by default: a local kind
  # install has no bucket to write to, and the credentials only exist
  # in a cloud environment. See templates/fdb-backup.yaml.
  backup:
    enabled: false
    # S3-compatible endpoint. GCS serves one for interop; the access
    # key id is prefixed onto this to form `accountName`.
    endpoint: storage.googleapis.com
    # Plaintext, because FDB's blobstore cannot be given a CA through
    # the operator -- see templates/fdb-backup.yaml. The backup files
    # are encrypted instead.
    port: 80
    bucket: ""
    # The bucket's region, which the SigV4 signature is computed over.
    region: ""
    # <service>/<backup-type>[/<generation>], the bucket's convention.
    # No environment segment: the bucket belongs to one project, the
    # project to one environment, and that environment to this system
    # alone. A project hosting a second system would need a <system>
    # segment in front -- this is a path, so it takes one. fdbbackup
    # appends the whole thing to its own `backups/` and `data/` roots
    # rather than treating it as a bucket prefix, so objects land under
    # `data/<backupName>/`.
    #
    # `gcp-up` overrides this with a third segment naming the cluster
    # generation, because a folder holds one backup and version numbers
    # restart with each cluster. The type stays a segment of its own:
    # it is what let Keycloak's `keycloak/export` (database dump) and
    # `keycloak/realms` (realm export) coexist rather than collide. The
    # two-segment default here is the single-generation case -- a
    # standalone install that is never rebuilt.
    backupName: fdb/continuous
    accessKeyId: ""
    secretAccessKey: ""
    # Base64 AES-256 key from `just gcp-backup-key-create`. Lose it and
    # the bucket is undecryptable.
    encryptionKey: ""
    # Extra blobstore URL parameters (e.g. request timeouts), beyond
    # the region and secure_connection the template always sets.
    urlParameters: []
    agentCount: 2
    # FDB paces a snapshot across this whole window rather than writing
    # it at once, and a backup is not restorable until its first
    # snapshot completes -- so this is how long a fresh cluster is
    # unprotected, not just how often a full copy lands. An hour suits a
    # test environment's data volume; raise it where the write
    # amplification of frequent full copies costs more than the exposure.
    snapshotPeriodSeconds: 3600
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  # Restore before anything writes. A target, not a mode: the version
  # says where this cluster's data should come from, so leaving it set
  # is safe -- the Job's name embeds it, and re-applying the same value
  # resolves to the same completed Job. Empty means no restore, which is
  # what a fresh environment with no prior backup wants.
  # `just gcp-fdb-export` records the version to use.
  restore:
    version: ""
    # Container the restore reads from, which is NOT the one this
    # cluster backs up to. A rebuilt cluster starts its version numbers
    # again from near zero, so two generations sharing a container
    # leave `fdbbackup describe` picking by version number -- and the
    # older generation's numbers are the higher ones. It reported a
    # restore point belonging to a cluster two rebuilds back. Empty
    # falls back to backup.backupName, which is right only for an
    # environment that has never been rebuilt.
    backupName: ""
    # Defaults to foundationdb/foundationdb:<fdb.version>. Needs
    # fdbrestore and fdbcli, which the official image carries.
    image: ""
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

# Sub-chart: FDB Kubernetes Operator (CRDs + controller).
# nameOverride forces lowercase resource names — the chart derives
# them from `.Chart.Name` which (because we alias the dependency as
# `fdbOperator`) would otherwise produce mixed-case names that fail
# RFC-1123 validation on apply.
#
# Replace the default initContainers map (which ships entries for
# FDB 7.1, 7.3, and 7.4) with the single 7.4 entry we actually use.
# Otherwise each FDB pod pulls all three monitor images (~600MB
# total) on first install when only 7.4 is referenced by
# `fdb.version` above -- the unused 7.1 and 7.3 pulls just slow
# `helm install` down without anyone ever running them.
fdbOperator:
  enabled: true
  nameOverride: fdb-operator
  # `fdbbackup start`, `status` and `discontinue` run in the operator
  # pod, not in an agent, so the operator needs the blobstore
  # credentials and the encryption key too -- see
  # templates/fdb-backup.yaml for why the Secret has no release prefix.
  # Mounted optional and set unconditionally so an install with
  # `fdb.backup.enabled: false` still starts.
  extraEnv:
    - name: FDB_BLOB_CREDENTIALS
      value: /var/backup-credentials/credentials
  volumes:
    - name: backup-credentials
      secret:
        secretName: fdb-backup-credentials
        optional: true
  volumeMounts:
    - name: backup-credentials
      mountPath: /var/backup-credentials
  # Helm merges submap entries rather than replacing the map, so
  # we have to explicitly null the unused 7.1 and 7.3 keys to keep
  # only the 7.4 monitor binaries the chart actually uses.
  initContainers:
    "7.1": null
    # 7.3.75 rather than 7.4.x: fdb-kubernetes-monitor:7.4.6 is published
    # amd64-only, so on an arm64 node the operator's fdbcli runs under
    # Rosetta and `configure new` never executes — the cluster is created
    # but never configured. The 7.3.75 image is multi-arch.
    "7.3":
      image:
        repository: foundationdb/fdb-kubernetes-monitor
        tag: 7.3.75
        pullPolicy: IfNotPresent
    "7.4": null

# ---------------------------------------------------------------------
# Single-broker Kafka (KRaft, no ZooKeeper) for the kind dev loop. Production
# sets enabled=false and points services at an external broker.
kafka:
  enabled: true
  image: apache/kafka:4.3.1
  # Read only when enabled=false: external broker address (host:port).
  bootstrapServers: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
