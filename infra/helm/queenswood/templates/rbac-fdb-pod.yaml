{{- if .Values.fdb.enabled }}
---
# The FDB Kubernetes sidecar in each fdbserver pod has to write
# locality data onto its own pod via the
# `foundationdb.org/launcher-environment` annotation. Without
# `pods/patch` permission the operator never sees a process
# eligible to be a coordinator and reconciliation stalls on
# "Could only select 0 processes, but 1 are required". The chart
# also reads the operator-managed ConfigMap, so list/watch on
# configmaps is needed too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-fdb-pod
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-fdb-pod
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-fdb-pod
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-fdb-pod
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-fdb-pod
    namespace: {{ .Release.Namespace }}
{{- end }}
