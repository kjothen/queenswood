{{- if and (eq (include "queenswood.keycloakMode" .) "operator") .Values.gateway.enabled }}
# Public traffic on :443 → in-cluster Keycloak. The :80 HTTP→HTTPS
# redirect is provided by the queenswood chart's redirect HTTPRoute,
# which matches against the apex hostname only; we explicitly attach
# Keycloak's subdomain to the https listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  # The same parent the chart's other routes attach to. Named from the
  # release rather than from a value, because `gateway.name` and
  # `gateway.sectionName` do not exist -- they rendered as null, which
  # the API server rejects, and one invalid object holds up the sync of
  # every other one beside it.
  parentRefs:
    # group and kind are what the API server defaults a parentRef to.
    # Stated rather than left out so the rendered manifest matches the
    # live object -- unstated, every comparison reports the route
    # OutOfSync and a sync that succeeds changes nothing.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: https
  hostnames:
    - {{ include "queenswood.keycloakHost" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The Keycloak Operator creates `<keycloak-cr-name>-service`
        # on port 8080 (plain HTTP — TLS terminates at the queenswood
        # gateway and the Keycloak pod trusts `X-Forwarded-*`). group,
        # kind and weight are the API server's defaults, stated so the
        # manifest matches the live object.
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-keycloak-service
          port: 8080
          weight: 1
{{- end }}
