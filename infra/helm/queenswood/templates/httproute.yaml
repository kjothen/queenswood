{{- if .Values.gateway.enabled }}
{{- if .Values.bankConsole.enabled }}
# Production traffic on :443 → bank-console SPA. nginx in the
# bank-console pod proxies /v1/* to the in-cluster bank-api service.
# The console keeps its own hostname so its redirectUris + webOrigins
# stay clean (Keycloak's Authorization Code flow validates these
# strictly per-client).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-bank-console
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: https
  hostnames:
    - {{ .Values.gateway.consoleHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-bank-console
          port: {{ .Values.bankConsole.port }}
{{- end }}
---
# HTTP→HTTPS redirect on :80. Replaces the legacy FrontendConfig's
# redirectToHttps; Gateway API expresses it as an HTTPRoute filter
# on the :80 listener instead of a controller-specific CRD.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-redirect
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: http
  hostnames:
    - {{ .Values.gateway.host | quote }}
{{- if .Values.bankConsole.enabled }}
    - {{ .Values.gateway.consoleHost | quote }}
{{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
