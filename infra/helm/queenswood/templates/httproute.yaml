{{- if .Values.gateway.enabled }}
{{- if .Values.console.enabled }}
# Production traffic on :443 → console SPA. nginx in the
# console pod proxies /v1/* to the in-cluster bank-api service.
# The console keeps its own hostname so its redirectUris + webOrigins
# stay clean (Keycloak's Authorization Code flow validates these
# strictly per-client).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-console
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  parentRefs:
    # group and kind are what the API server defaults a parentRef to.
    # Stated rather than left out so the rendered manifest matches the
    # live object -- unstated, every comparison reports the route
    # OutOfSync and a sync that succeeds changes nothing.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: https
  hostnames:
    - {{ .Values.gateway.consoleHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Defaulted by the API server, and stated for the same reason
        # as the parentRef above.
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-console
          port: {{ .Values.console.port }}
          weight: 1
{{- end }}
---
{{- if (index .Values.services "api-service").enabled }}
# Production traffic on :443 → bank-api. Its own hostname, so an
# integrator reaches the banking API directly rather than through the
# console pod's nginx, and so the API never shares an origin with a
# surface that runs browser JS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: https
  hostnames:
    - {{ .Values.gateway.apiHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-api-service
          port: {{ (index .Values.services "api-service").port }}
          weight: 1
{{- end }}
---
# HTTP→HTTPS redirect on :80. Replaces the legacy FrontendConfig's
# redirectToHttps; Gateway API expresses it as an HTTPRoute filter
# on the :80 listener instead of a controller-specific CRD.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-redirect
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: http
  hostnames:
    - {{ .Values.gateway.host | quote }}
{{- if .Values.console.enabled }}
    - {{ .Values.gateway.consoleHost | quote }}
{{- end }}
{{- if (index .Values.services "api-service").enabled }}
    - {{ .Values.gateway.apiHost | quote }}
{{- end }}
  rules:
    # A rule with no matches matches everything, which the API server
    # writes out as this. Stated so the two agree.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
