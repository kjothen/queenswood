{{- if .Values.ingress.enabled }}
{{- $gcp := .Values.ingress.gcp }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-bank-app
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
  annotations:
    {{- if $gcp.enabled }}
    kubernetes.io/ingress.global-static-ip-name: {{ $gcp.globalStaticIpName | quote }}
    networking.gke.io/managed-certificates: {{ .Release.Name }}-cert
    networking.gke.io/v1beta1.FrontendConfig: {{ .Release.Name }}-frontend
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $gcp.enabled }}
  ingressClassName: gce
  defaultBackend:
    service:
      name: {{ .Release.Name }}-bank-app
      port:
        number: {{ .Values.bankApp.port }}
  {{- else if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-bank-app
                port:
                  number: {{ .Values.bankApp.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
