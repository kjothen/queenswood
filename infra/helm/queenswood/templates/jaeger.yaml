{{- if .Values.jaeger.enabled }}
# All-in-one Jaeger for the kind dev loop: OTLP/HTTP in on 4318, UI on 16686.
# In-memory storage -- spans are lost on restart. Production sets
# jaeger.enabled=false and points otel.endpoint at a real collector.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jaeger
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: jaeger
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-jaeger
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        {{- include "queenswood.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image | quote }}
          # The packaged config binds the OTLP receiver to loopback; bind all
          # interfaces so the Service can reach it.
          args:
            - "--set"
            - "receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 15
            periodSeconds: 10
{{- end }}
