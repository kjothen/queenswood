{{- if .Values.gateway.enabled }}
{{- $gcp := .Values.gateway.gcp }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
  {{- if $gcp.enabled }}
  annotations:
    # Binds the Gateway to a Certificate Manager CertificateMap. The
    # map (and its DNSAuthorization, Certificate, CertificateMapEntry)
    # are provisioned outside the chart, via Crossplane manifests in
    # infra/gcp/certificates.yml. ManagedCertificate (the legacy
    # resource) is not compatible with Gateway API; Certificate
    # Manager is the GA path.
    networking.gke.io/certmap: {{ $gcp.certMap | quote }}
  {{- end }}
spec:
  {{- if $gcp.enabled }}
  # Regional external Application Load Balancer. Matches the
  # single-zone cluster footprint (europe-west2-a) and is cheaper
  # than the global-anycast variant. Switch to
  # gke-l7-global-external-managed if multi-region traffic ever
  # justifies the premium tier.
  gatewayClassName: gke-l7-regional-external-managed
  addresses:
    - type: NamedAddress
      value: {{ $gcp.staticIpName | quote }}
  {{- else if .Values.gateway.className }}
  gatewayClassName: {{ .Values.gateway.className | quote }}
  {{- end }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      # TLS is supplied by the certmap annotation above. The listener
      # still needs protocol: HTTPS so the LB serves on 443; the
      # actual cert material is fetched from Certificate Manager by
      # the gke-l7 controller using the map.
      tls:
        mode: Terminate
    - name: http
      protocol: HTTP
      port: 80
{{- end }}
