{{- if .Values.gateway.enabled }}
{{- $gcp := .Values.gateway.gcp }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  {{- if $gcp.enabled }}
  # Regional external Application Load Balancer. Matches the
  # single-zone cluster footprint (europe-west2-a) and is cheaper
  # than the global-anycast variant. Switch to
  # gke-l7-global-external-managed if multi-region traffic ever
  # justifies the premium tier (and use the certmap annotation
  # pattern instead of cert-manager-certs).
  gatewayClassName: gke-l7-regional-external-managed
  addresses:
    - type: NamedAddress
      value: {{ $gcp.staticIpName | quote }}
  {{- else if .Values.gateway.className }}
  gatewayClassName: {{ .Values.gateway.className | quote }}
  {{- end }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      {{- if $gcp.enabled }}
      # Regional Gateways reference Certificate Manager certs
      # directly via tls.options. Global Gateways use the
      # `networking.gke.io/certmap` annotation pointing at a
      # CertificateMap instead -- different patterns for different
      # GatewayClasses. The referenced cert is provisioned via
      # Crossplane in infra/gcp/certificates.yml.
      tls:
        mode: Terminate
        options:
          networking.gke.io/cert-manager-certs: {{ $gcp.certManagerCerts | quote }}
      {{- end }}
    - name: http
      protocol: HTTP
      port: 80
{{- end }}
