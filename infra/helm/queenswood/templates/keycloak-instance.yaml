{{- if eq (include "queenswood.keycloakMode" .) "operator" }}
# `Keycloak` CR consumed by the operator, which this chart installs
# cluster-wide as a subchart. The operator reconciles this into a
# StatefulSet + Service + everything else a
# running Keycloak needs. Database is parameterised through the
# `postgresql.mode` switch in values.yaml — see _helpers.tpl.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.keycloak.instances }}
  image: {{ .Values.keycloak.image | quote }}
  # The upstream `quay.io/keycloak/keycloak` image ships
  # *unbuilt* -- production images are expected to bake the
  # `kc.sh build` step into their Dockerfile. The operator
  # defaults to `start --optimized`, which crashes on first run
  # against the upstream image with "The '--optimized' flag was
  # used for first ever server start". Setting this to false
  # makes the operator run the build step inside the pod before
  # starting.
  startOptimized: false
  db:
    vendor: postgres
    host: {{ include "queenswood.postgresHost" . | quote }}
    port: {{ .Values.postgres.port }}
    database: {{ .Values.keycloak.database.name | quote }}
    usernameSecret:
      name: {{ .Values.keycloak.database.secretName | quote }}
      key: username
    {{- if eq (include "queenswood.postgresProvider" .) "local" }}
    passwordSecret:
      name: {{ .Values.keycloak.database.secretName | quote }}
      key: password
    {{- end }}
  hostname:
    # Full URL so Keycloak embeds the same iss in every token
    # regardless of how it was reached -- see _helpers.tpl for which
    # URL that is. strict: false keeps the operator from rejecting
    # in-cluster Host headers that don't match.
    hostname: {{ include "queenswood.keycloakIssuer" . | quote }}
    strict: false
  http:
    # The gateway terminates TLS; the Keycloak pod itself serves
    # plain HTTP and trusts `X-Forwarded-*` headers.
    httpEnabled: true
  proxy:
    headers: xforwarded
  {{- if .Values.keycloak.vault.enabled }}
  # `unsupported` is the operator's own name for the escape hatch, not
  # a warning about this usage -- it's the only way to add a volume to
  # the pod it manages.
  unsupported:
    podTemplate:
      spec:
        volumes:
          - name: keycloak-vault
            secret:
              secretName: {{ .Values.keycloak.vault.secretName | quote }}
              optional: true
        containers:
          - volumeMounts:
              - name: keycloak-vault
                mountPath: {{ .Values.keycloak.vault.dir | quote }}
                readOnly: true
  {{- end }}
  additionalOptions:
    {{- if .Values.keycloak.vault.enabled }}
    # `file`, not `files-plaintext`. The provider is named
    # files-plaintext internally and in the SPI options, but the CLI
    # option takes file or keystore -- anything else fails the server at
    # startup rather than falling back.
    - name: vault
      value: file
    - name: vault-dir
      value: {{ .Values.keycloak.vault.dir | quote }}
    {{- end }}
    {{- if and (ne (include "queenswood.postgresProvider" .) "off") (eq (include "queenswood.postgresProvider" .) "cloudsql") }}
    # cloud-sql-proxy fronts CloudSQL with a plain-TCP listener;
    # auth and encryption terminate at the proxy via Workload
    # Identity. The Postgres JDBC driver defaults to sslmode=prefer
    # and crashes on the proxy's SSL handshake close, so force-disable
    # client-side SSL. A provider that has the client reach the
    # database directly wants the opposite of this.
    - name: db-url-properties
      value: "?sslmode=disable"
    {{- end }}
{{- end }}
