{{- $secretName := printf "%s-admin-api-key" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingKey := "" -}}
{{- if $existing -}}
  {{- $existingKey = b64dec (index $existing.data "MONO_ADMIN_API_KEY") -}}
{{- end -}}
{{- $adminKey := coalesce $existingKey .Values.secrets.adminApiKey (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONO_ADMIN_API_KEY: {{ $adminKey | quote }}
