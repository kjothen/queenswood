{{- if .Values.bankConsole.enabled }}
---
# Human-identity SPA. Mirrors bank-app's standalone template (TCP
# probes, no FDB volumes, no bootstrap dependency) — the SPA only
# proxies to bank-api at runtime, so a TCP-only probe is sufficient.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bank-console
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: bank-console
spec:
  replicas: {{ default 1 .Values.bankConsole.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: bank-console
  template:
    metadata:
      labels:
        {{- include "queenswood.labels" . | nindent 8 }}
        app.kubernetes.io/component: bank-console
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bank-console
          image: "{{ .Values.image.registry }}/bank-console:{{ .Values.image.tag }}"
          imagePullPolicy: {{ include "queenswood.imagePullPolicy" $ }}
          ports:
            - name: http
              containerPort: {{ .Values.bankConsole.port }}
              protocol: TCP
          env:
            # nginx upstreams. KEYCLOAK_UPSTREAM is what the
            # `/keycloak/*` location reverse-proxies to; defaults to
            # the bundled dev Keycloak's Service in-cluster, and
            # GKE overrides via queenswood-platform.
            - name: API_UPSTREAM
              value: {{ tpl .Values.bankConsole.apiUpstream . | quote }}
            - name: KEYCLOAK_UPSTREAM
              value: {{ tpl .Values.bankConsole.keycloakUpstream . | quote }}
            # Runtime config the SPA reads via /env.js. The default
            # `keycloakPublicUrl` points at the SPA's own same-origin
            # `/keycloak` path so a bare `helm install` works after
            # one port-forward to the SPA; GKE overrides to the
            # public Keycloak hostname.
            - name: KEYCLOAK_URL
              value: {{ .Values.bankConsole.keycloakPublicUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.consoleClientId | quote }}
            - name: KEYCLOAK_IDP_HINT
              value: {{ .Values.bankConsole.keycloakIdpHint | quote }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          {{- with .Values.bankConsole.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-bank-console
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: bank-console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: bank-console
  ports:
    - name: http
      port: {{ .Values.bankConsole.port }}
      targetPort: http
      protocol: TCP
{{- end }}
