{{- /*
  Secret carrying the Keycloak admin client secret bank-api +
  bootstrap use to mint admin tokens against the Admin REST API.
  Mirrors the lookup-then-coalesce pattern in `secret.yaml` so a
  helm upgrade preserves any previously-set secret rather than
  re-randomising on each install. Override at install:
    --set secrets.keycloakAdminClientSecret=<value>
*/ -}}
{{- $secretName := printf "%s-keycloak-admin" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingKey := "" -}}
{{- if $existing -}}
  {{- $existingKey = b64dec (index $existing.data "KEYCLOAK_ADMIN_CLIENT_SECRET") -}}
{{- end -}}
{{- /* dev Keycloak bundled in this chart imports a realm with a fixed client
       secret; fall back to that value so the chart-rendered Secret matches
       the realm's `queenswood-admin` client. Production installs that don't
       enable dev get random unless explicitly overridden. */ -}}
{{- $devFallback := "" -}}
{{- if .Values.keycloak.dev.enabled -}}
  {{- $devFallback = .Values.keycloak.dev.realmAdminClientSecret -}}
{{- end -}}
{{- $clientSecret := coalesce $existingKey .Values.secrets.keycloakAdminClientSecret $devFallback (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ $clientSecret | quote }}
