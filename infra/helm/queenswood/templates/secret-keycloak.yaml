{{- /*
  Secret carrying the Keycloak admin client secret bank-api +
  bootstrap use to mint admin tokens against the Admin REST API.

  When `keycloak.dev.enabled` is true (bundled dev Keycloak in this
  chart), the value MUST equal the literal in the realm-import JSON
  -- otherwise Keycloak rejects the token request and bank-api gets
  "admin token response missing access_token". The realm has a fixed
  client secret per files/keycloak-realm.json, so the chart writes
  that exact value: no lookup-and-preserve dance (which would keep an
  old random secret from a pre-dev-Keycloak install).

  When dev is off (the GKE path), preserve any previously-set value
  on upgrade so admin tokens survive helm-upgrade cycles. Override at
  install: --set secrets.keycloakAdminClientSecret=<value>.
*/ -}}
{{- $secretName := printf "%s-keycloak-admin" .Release.Name -}}
{{- $clientSecret := "" -}}
{{- if .Values.keycloak.dev.enabled -}}
  {{- $clientSecret = .Values.keycloak.dev.realmAdminClientSecret -}}
{{- else -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
  {{- $existingKey := "" -}}
  {{- if $existing -}}
    {{- $existingKey = b64dec (index $existing.data "KEYCLOAK_ADMIN_CLIENT_SECRET") -}}
  {{- end -}}
  {{- $clientSecret = coalesce $existingKey .Values.secrets.keycloakAdminClientSecret (randAlphaNum 32) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ $clientSecret | quote }}
