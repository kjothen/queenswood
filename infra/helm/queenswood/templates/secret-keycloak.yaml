{{- /*
  Secret carrying the RSA private key bank-api + bootstrap sign their
  Keycloak client assertions with (private_key_jwt).

  Nobody chooses this key and nobody stores it. It is generated on
  first install, preserved across upgrades by looking up the live
  Secret, and its public half is derived and registered on the
  `queenswood-admin` client by the bootstrap Job's
  sync-admin-client-key initContainer.

  It isn't kept in `pass` or Secret Manager on purpose: nothing outside
  this cluster holds the matching half, so losing it costs a
  regenerate-and-re-register rather than a coordinated rotation with a
  third party. Delete this Secret and the bootstrap Job, upgrade, and
  restart the pods that mount it.

  A file rather than an env var because a multi-line PEM does not
  survive an environment variable intact -- see the
  `:admin-client-private-key-file` docstring in mono's keycloak
  component.

  The certificate is generated here alongside the key rather than
  derived at registration time, because the image the bootstrap Job
  runs has no openssl. Helm can mint both at once, which removes the
  derivation step entirely -- the Job only has to read a file and PUT
  it.
*/ -}}
{{- $secretName := printf "%s-keycloak-admin" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := "" -}}
{{- $crt := "" -}}
{{- /*
  Both halves or neither: a key preserved without its certificate would
  no longer match what Keycloak holds. Guard on the keys themselves --
  upgrading from a release that stored a client secret finds a Secret
  whose only entry is KEYCLOAK_ADMIN_CLIENT_SECRET, and indexing a
  missing key yields nil rather than "", which b64dec rejects.
*/ -}}
{{- if and $existing (hasKey $existing.data "admin-client.pem") (hasKey $existing.data "admin-client.crt") -}}
  {{- $key = b64dec (index $existing.data "admin-client.pem") -}}
  {{- $crt = b64dec (index $existing.data "admin-client.crt") -}}
{{- else -}}
  {{- $pair := genSelfSignedCert (printf "%s-admin" .Release.Name) nil nil 3650 -}}
  {{- $key = $pair.Key -}}
  {{- $crt = $pair.Cert -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-client.pem: |
{{ $key | indent 4 }}
  admin-client.crt: |
{{ $crt | indent 4 }}
