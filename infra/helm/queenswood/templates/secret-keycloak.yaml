{{- /*
  Container for the RSA key bank-api + bootstrap sign their Keycloak
  client assertions with (private_key_jwt), and the certificate whose
  public half is registered on the `queenswood-admin` client.

  Declares that the Secret exists, never what it holds. The bootstrap
  Job's ensure-admin-client-key initContainers generate the pair and
  write it here, so under server-side apply Argo never manages `data`
  and cannot replace it on a sync. Rendering key material here instead
  mints a fresh pair on every render -- Argo runs `helm template`,
  where `lookup` returns nothing -- while the certificate registered on
  the client stays whatever bootstrap last pushed.

  Nothing outside the cluster holds either half. The pair is
  self-signed and ours to mint, so losing it costs a regenerate and
  re-register: the rotatable case in
  docs/recipes/infra/external-secrets.md, which keeps no copy anywhere.

  A file rather than an env var because a multi-line PEM does not
  survive an environment variable intact -- see the
  `:admin-client-private-key-file` docstring in mono's keycloak
  component.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "queenswood.keycloakAdminKeySecret" . }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
type: Opaque
