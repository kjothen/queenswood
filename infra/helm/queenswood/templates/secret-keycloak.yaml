{{- /*
  Secret carrying the Keycloak admin client secret bank-api +
  bootstrap use to mint admin tokens against the Admin REST API.

  Nobody chooses this value. It is generated on first install,
  preserved across upgrades by looking up the live Secret, and pushed
  into Keycloak's `queenswood-admin` client by the bootstrap Job's
  sync-admin-client-secret initContainer -- so the realm-import JSON
  carries no client secret and neither does git.

  The realm and this Secret must agree or Keycloak rejects the token
  request and bank-api reports "admin token response missing
  access_token". Pushing rather than sharing a literal is what keeps
  them in step, on the bundled dev Keycloak and on GKE alike.

  Rotation: delete this Secret and the bootstrap Job, upgrade, then
  restart the Deployments that read it -- secretKeyRef env vars are
  resolved at pod start and don't refresh in place.

  secrets.keycloakAdminClientSecret still overrides on first install,
  for a standalone `helm install` that wants a known value.
*/ -}}
{{- $secretName := printf "%s-keycloak-admin" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingKey := "" -}}
{{- if $existing -}}
  {{- $existingKey = b64dec (index $existing.data "KEYCLOAK_ADMIN_CLIENT_SECRET") -}}
{{- end -}}
{{- $clientSecret := coalesce $existingKey .Values.secrets.keycloakAdminClientSecret (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ $clientSecret | quote }}
