{{- if .Values.bootstrap.enabled }}
---
# One-shot Job: idempotently seeds the singleton internal Queenswood
# organization (with API key, internal Party, internal
# CashAccountProduct, one CashAccount per currency) and writes the
# platform + micro Policy records. Runs after bank-migrator-service
# has applied FDB record metadata + Pulsar topology; reads the
# persisted FDB schema (no Pulsar interaction).
#
# Job name embeds .Values.image.tag so each helm upgrade with a new
# tag creates a fresh Job rather than failing on the immutable spec;
# old Jobs age out via ttlSecondsAfterFinished.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bank-bootstrap-{{ .Values.image.tag }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: bank-bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "queenswood.labels" . | nindent 8 }}
        app.kubernetes.io/component: bank-bootstrap
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-fdb-cluster
          image: alpine/k8s:1.30.14
          command:
            - sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              URL="https://kubernetes.default.svc/api/v1/namespaces/$NS/configmaps/{{ include "queenswood.fdbClusterConfigMap" . }}"
              for i in $(seq 1 120); do
                content=$(curl -sS --cacert "$CA" \
                  -H "Authorization: Bearer $TOKEN" "$URL" 2>/dev/null \
                  | jq -r '.data["cluster-file"] // ""')
                if [ -n "$content" ]; then
                  echo "FDB cluster file ready: $content"
                  printf '%s\n' "$content" > /etc/fdb/fdb.cluster
                  exit 0
                fi
                echo "Waiting for FDB cluster-file content..."
                sleep 5
              done
              echo "FDB cluster-file did not appear in time" >&2
              exit 1
          volumeMounts:
            - name: fdb-cluster-file
              mountPath: /etc/fdb
        {{- if .Values.migrator.enabled }}
        # Block until the migrator Job has applied FDB metadata +
        # Pulsar topology — bootstrap reads the persisted FDB schema
        # via fdb/meta-store, so the migration must land first.
        - name: wait-for-migrator
          image: alpine/k8s:1.30.14
          command:
            - sh
            - -c
            - |
              kubectl wait --for=condition=complete --timeout=10m \
                job/{{ .Release.Name }}-bank-migrator-{{ .Values.image.tag }}
        {{- end }}
      containers:
        - name: bank-bootstrap
          image: "{{ .Values.image.registry }}/bank-bootstrap-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVICE_NAME
              value: "bank-bootstrap-service"
            - name: FDB_CLUSTER_FILE
              value: "/etc/fdb/fdb.cluster"
            - name: OTEL_ENDPOINT
              value: {{ default "" .Values.otel.endpoint | quote }}
            - name: MONO_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-admin-api-key
                  key: MONO_ADMIN_API_KEY
          volumeMounts:
            - name: fdb-cluster-file
              mountPath: /etc/fdb
              readOnly: true
          {{- with .Values.bootstrap.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: fdb-cluster-file
          emptyDir: {}
{{- end }}
