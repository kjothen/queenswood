{{- if .Values.bootstrap.enabled }}
---
# One-shot Job: idempotently seeds the singleton internal Queenswood
# organization (with API key, internal Party, internal
# CashAccountProduct, one CashAccount per currency) and writes the
# platform + micro Policy records. Runs after migrator-service
# has applied FDB record metadata + Kafka topics; reads the
# persisted FDB schema (no Kafka interaction).
#
# Job name embeds both .Values.image.tag and .Chart.Version so every
# helm upgrade -- whether the bump is the image (new app code) or the
# chart (new template content like added labels) -- creates a fresh
# Job rather than failing on Job.spec.template immutability; old Jobs
# age out via ttlSecondsAfterFinished.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap-{{ .Values.image.tag }}-{{ .Chart.Version }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "queenswood.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-fdb-cluster
          image: alpine/k8s:1.30.14
          command:
            - sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              URL="https://kubernetes.default.svc/api/v1/namespaces/$NS/configmaps/{{ include "queenswood.fdbClusterConfigMap" . }}"
              for i in $(seq 1 120); do
                content=$(curl -sS --cacert "$CA" \
                  -H "Authorization: Bearer $TOKEN" "$URL" 2>/dev/null \
                  | jq -r '.data["cluster-file"] // ""')
                if [ -n "$content" ]; then
                  echo "FDB cluster file ready: $content"
                  printf '%s\n' "$content" > /etc/fdb/fdb.cluster
                  exit 0
                fi
                echo "Waiting for FDB cluster-file content..."
                sleep 5
              done
              echo "FDB cluster-file did not appear in time" >&2
              exit 1
          volumeMounts:
            - name: fdb-cluster-file
              mountPath: /etc/fdb
        # Register the public half of this release's signing key on the
        # queenswood-admin client, and switch it to client-jwt.
        #
        # Only public material crosses the wire -- the private half never
        # leaves the pods that mount it, and Keycloak never holds a copy
        # of anything secret for this client. A URL (jwks.url) would be
        # the more automatic option but deadlocks cold start: every
        # service Deployment blocks on this Job, so bank-api can't be
        # serving a JWKS at the moment Keycloak would need to fetch it.
        #
        # It belongs here rather than in a helm hook because that same
        # gate orders it ahead of every consumer, including bootstrap's
        # own container.
        - name: sync-admin-client-key
          image: alpine/k8s:1.30.14
          env:
            - name: KC_BASE_URL
              value: {{ .Values.keycloak.baseUrl | quote }}
            - name: KC_CLIENT_ID
              value: {{ .Values.keycloak.adminClientId | quote }}
            - name: KC_REALMS
              value: {{ printf "%s %s" .Values.keycloak.realm .Values.keycloak.opsRealm | quote }}
            - name: KC_CERT_FILE
              value: /etc/queenswood/keycloak/admin-client.crt
            {{- if .Values.keycloak.adminSecret.name }}
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret.name | quote }}
                  key: {{ .Values.keycloak.adminSecret.usernameKey | quote }}
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret.name | quote }}
                  key: {{ .Values.keycloak.adminSecret.passwordKey | quote }}
            {{- else }}
            - name: KC_ADMIN_USER
              value: {{ .Values.keycloak.dev.adminUser | quote }}
            - name: KC_ADMIN_PASSWORD
              value: {{ .Values.keycloak.dev.adminPassword | quote }}
            {{- end }}
          volumeMounts:
            - name: keycloak-admin-key
              mountPath: /etc/queenswood/keycloak
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                if curl -sf -o /dev/null "$KC_BASE_URL/realms/master/.well-known/openid-configuration"; then
                  break
                fi
                echo "Waiting for Keycloak at $KC_BASE_URL..."
                sleep 5
              done
              # Keycloak wants the base64 DER of the certificate, without
              # the PEM armour or newlines. Helm generated it alongside
              # the key, so there is nothing to derive here -- which is
              # just as well, since this image has no openssl.
              CRT=$(grep -v '^-----' "$KC_CERT_FILE" | tr -d '\n')
              if [ -z "$CRT" ]; then
                echo "no certificate body in $KC_CERT_FILE" >&2
                exit 1
              fi
              TOKEN=$(curl -sf -d client_id=admin-cli \
                -d "username=$KC_ADMIN_USER" \
                --data-urlencode "password=$KC_ADMIN_PASSWORD" \
                -d grant_type=password \
                "$KC_BASE_URL/realms/master/protocol/openid-connect/token" \
                | jq -r '.access_token // empty')
              if [ -z "$TOKEN" ]; then
                echo "could not obtain a Keycloak admin token" >&2
                exit 1
              fi
              for realm in $KC_REALMS; do
                id=$(curl -sf -H "Authorization: Bearer $TOKEN" \
                  "$KC_BASE_URL/admin/realms/$realm/clients?clientId=$KC_CLIENT_ID" \
                  | jq -r '.[0].id // empty')
                if [ -z "$id" ]; then
                  echo "no $KC_CLIENT_ID client in $realm, skipping"
                  continue
                fi
                curl -sf -H "Authorization: Bearer $TOKEN" \
                  "$KC_BASE_URL/admin/realms/$realm/clients/$id" \
                  | jq --arg crt "$CRT" '
                      .clientAuthenticatorType = "client-jwt"
                      | .attributes = ((.attributes // {})
                          + {"jwt.credential.certificate": $crt,
                             "token.endpoint.auth.signing.alg": "RS256"})' \
                  | curl -sf -X PUT -H "Authorization: Bearer $TOKEN" \
                      -H 'Content-Type: application/json' --data @- \
                      "$KC_BASE_URL/admin/realms/$realm/clients/$id"
                echo "registered $KC_CLIENT_ID certificate in realm $realm"
              done
        {{- if .Values.migrator.enabled }}
        # Block until the migrator Job has applied FDB metadata +
        # Kafka topics — bootstrap reads the persisted FDB schema
        # via fdb/meta-store, so the migration must land first.
        - name: wait-for-migrator
          image: alpine/k8s:1.30.14
          command:
            - sh
            - -c
            - |
              kubectl wait --for=condition=complete --timeout=10m \
                job/{{ .Release.Name }}-migrator-{{ .Values.image.tag }}-{{ .Chart.Version }}
        {{- end }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.registry }}/bootstrap-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ include "queenswood.imagePullPolicy" $ }}
          env:
            - name: SERVICE_NAME
              value: "bootstrap-service"
            - name: FDB_CLUSTER_FILE
              value: "/etc/fdb/fdb.cluster"
            - name: OTEL_ENDPOINT
              value: {{ include "queenswood.otelEndpoint" . | quote }}
            - name: KEYCLOAK_BASE_URL
              value: {{ .Values.keycloak.baseUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.keycloak.adminClientId | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_PRIVATE_KEY_FILE
              value: /etc/queenswood/keycloak/admin-client.pem
          volumeMounts:
            - name: fdb-cluster-file
              mountPath: /etc/fdb
              readOnly: true
            - name: keycloak-admin-key
              mountPath: /etc/queenswood/keycloak
              readOnly: true
          {{- with .Values.bootstrap.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: fdb-cluster-file
          emptyDir: {}
        - name: keycloak-admin-key
          secret:
            secretName: {{ .Release.Name }}-keycloak-admin
            defaultMode: 0400
{{- end }}
