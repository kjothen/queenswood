{{- if and (eq (include "queenswood.keycloakMode" .) "operator") (eq (include "queenswood.postgresProvider" .) "cloudsql") }}
# Database user Secret the Keycloak CR reads for its `usernameSecret`
# ref. There is no password key and no `passwordSecret` ref, because
# the instance runs with `cloudsql.iam_authentication` on and this user
# is a `CLOUD_IAM_SERVICE_ACCOUNT`: the proxy presents a token from the
# metadata server and Cloud SQL checks IAM. The name is derived from
# the identity the proxy runs as -- see `_helpers.tpl`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.database.secretName }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ include "queenswood.postgresUser" . | quote }}
{{- end }}
