# Project IAM bindings for the crossplane-provider SA.
# Bootstrap-only roles (projectIamAdmin, serviceUsageAdmin) are
# bound by `just gcp-iam-bootstrap`.
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: crossplane-provider-container-admin
  annotations:
    description: Crossplane SA — GKE admin
spec:
  forProvider:
    role: roles/container.admin
    member: serviceAccount:crossplane-provider@queenswood-820d84.iam.gserviceaccount.com
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: crossplane-provider-compute-network-admin
  annotations:
    description: Crossplane SA — Compute network admin
spec:
  forProvider:
    role: roles/compute.networkAdmin
    member: serviceAccount:crossplane-provider@queenswood-820d84.iam.gserviceaccount.com
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: crossplane-provider-dns-admin
  annotations:
    description: Crossplane SA — Cloud DNS admin
spec:
  forProvider:
    role: roles/dns.admin
    member: serviceAccount:crossplane-provider@queenswood-820d84.iam.gserviceaccount.com
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: crossplane-provider-certificatemanager-owner
  annotations:
    description: Crossplane SA — Certificate Manager owner
spec:
  forProvider:
    role: roles/certificatemanager.owner
    member: serviceAccount:crossplane-provider@queenswood-820d84.iam.gserviceaccount.com
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: crossplane-provider-cloudsql-admin
  annotations:
    description: Crossplane SA — Cloud SQL admin
spec:
  forProvider:
    role: roles/cloudsql.admin
    member: serviceAccount:crossplane-provider@queenswood-820d84.iam.gserviceaccount.com
---
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: crossplane-provider-iam-service-account-user
  annotations:
    description: Crossplane SA — IAM service-account user
spec:
  forProvider:
    role: roles/iam.serviceAccountUser
    member: serviceAccount:crossplane-provider@queenswood-820d84.iam.gserviceaccount.com
