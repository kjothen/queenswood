apiVersion: container.gcp.upbound.io/v1beta2
kind: Cluster
metadata:
  name: queenswood-gke
spec:
  forProvider:
    location: europe-west2-a
    initialNodeCount: 1
    removeDefaultNodePool: true
    deletionProtection: false
    nodeConfig:
      machineType: e2-standard-2
      diskType: pd-standard
      diskSizeGb: 50
    networkRef:
      name: queenswood-vpc
    subnetworkRef:
      name: queenswood-subnet
    ipAllocationPolicy:
      clusterSecondaryRangeName: pods
      servicesSecondaryRangeName: services
    workloadIdentityConfig:
      workloadPool: project-7da8be71-664d-40bd-b5d.svc.id.goog
    releaseChannel:
      channel: REGULAR
    # The HTTP Load Balancing addon spawns the master-side `glbc`
    # controller. Without it, Ingress resources with `ingressClassName:
    # gce` sit unprocessed -- no forwarding rules, no backend services,
    # no NEGs, no events. The Upbound provider's default omits this
    # block (which GKE then treats as disabled), so it has to be
    # declared explicitly.
    addonsConfig:
      httpLoadBalancing:
        disabled: false
  writeConnectionSecretToRef:
    name: queenswood-gke-kubeconfig
    namespace: crossplane-system
---
apiVersion: container.gcp.upbound.io/v1beta2
kind: NodePool
metadata:
  name: queenswood-pool
spec:
  forProvider:
    location: europe-west2-a
    clusterRef:
      name: queenswood-gke
    # Autoscaling between 3 and 6 nodes. nodeCount is omitted on
    # purpose -- GCP rejects it when autoscaling is set, and
    # minNodeCount handles the floor that nodeCount used to enforce.
    autoscaling:
      minNodeCount: 3
      maxNodeCount: 6
    nodeConfig:
      machineType: e2-standard-2
      diskSizeGb: 50
      diskType: pd-standard
      oauthScopes:
        - https://www.googleapis.com/auth/cloud-platform
      workloadMetadataConfig:
        mode: GKE_METADATA
