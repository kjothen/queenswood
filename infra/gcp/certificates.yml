# Certificate Manager resources for the Gateway API migration.
# Replaces the legacy ManagedCertificate (which only worked with
# the deprecated GCE Ingress controller). All resources live in
# the europe-west2 region to match the regional Gateway LB; the
# CertificateMap is bound to the Gateway via the
# `networking.gke.io/certmap: queenswood-cert-map` annotation in
# the chart's gateway.yaml template.
#
# Flow:
#   1. DNSAuthorization issues a CNAME record that must exist
#      in Cloud DNS before Certificate Manager will provision.
#   2. Certificate references the DNSAuthorization and obtains a
#      Google-managed cert for queenswood.repldriven.com.
#   3. CertificateMap groups certs; CertificateMapEntry binds the
#      cert to the hostname.
#   4. Gateway consumes the map via annotation.
---
apiVersion: certificatemanager.gcp.upbound.io/v1beta1
kind: DNSAuthorization
metadata:
  name: queenswood-dns-auth
spec:
  forProvider:
    location: europe-west2
    domain: queenswood.repldriven.com
---
# CNAME record Cloud DNS needs to serve for DNSAuthorization to
# validate. The target value comes from the DNSAuthorization's
# status.atProvider.dnsResourceRecord -- but Crossplane's DNS
# RecordSet doesn't accept cross-resource refs (same limitation
# noted in networking.yml). Once the DNSAuthorization is created
# read the target with:
#   kubectl --context kind-xp-mp get dnsauthorization \
#     queenswood-dns-auth -o jsonpath= \
#     '{.status.atProvider.dnsResourceRecord}'
# and replace the placeholder rrdatas value below in a follow-up
# commit. The record name follows the DNSAuthorization convention
# (_acme-challenge prefix).
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: queenswood-dns-auth-cname
spec:
  forProvider:
    managedZoneRef:
      name: queenswood-zone
    name: _acme-challenge.queenswood.repldriven.com.
    type: CNAME
    ttl: 300
    rrdatas:
      - "placeholder.invalid."  # replace after DNSAuthorization reconciles
---
apiVersion: certificatemanager.gcp.upbound.io/v1beta1
kind: Certificate
metadata:
  name: queenswood-cert
spec:
  forProvider:
    location: europe-west2
    managed:
      - domains:
          - queenswood.repldriven.com
        dnsAuthorizationsRefs:
          - name: queenswood-dns-auth
---
apiVersion: certificatemanager.gcp.upbound.io/v1beta1
kind: CertificateMap
metadata:
  name: queenswood-cert-map
spec:
  forProvider:
    location: europe-west2
---
apiVersion: certificatemanager.gcp.upbound.io/v1beta1
kind: CertificateMapEntry
metadata:
  name: queenswood-cert-map-entry
spec:
  forProvider:
    location: europe-west2
    mapRef:
      name: queenswood-cert-map
    certificatesRefs:
      - name: queenswood-cert
    hostname: queenswood.repldriven.com
