# Certificate Manager resources for the Gateway API migration.
# Replaces the legacy ManagedCertificate (which only worked with
# the deprecated GCE Ingress controller). All resources live in
# europe-west2 to match the regional Gateway LB.
#
# Flow:
#   1. DNSAuthorization issues a CNAME record that must exist in
#      Cloud DNS before Certificate Manager will provision.
#   2. Certificate references the DNSAuthorization and obtains a
#      Google-managed cert for queenswood.repldriven.com.
#   3. Gateway listener references the cert by name via
#      `tls.options.networking.gke.io/cert-manager-certs` in the
#      chart's gateway.yaml template.
#
# Note: regional Gateways (gke-l7-regional-external-managed)
# reference Certificate Manager certs directly via tls.options,
# unlike global Gateways which use a CertificateMap +
# CertificateMapEntry bound by the `networking.gke.io/certmap`
# annotation. Don't add a CertificateMap here -- the regional LB
# controller doesn't read it.
---
apiVersion: certificatemanager.gcp.upbound.io/v1beta1
kind: DNSAuthorization
metadata:
  name: queenswood-dns-auth
spec:
  forProvider:
    location: europe-west2
    domain: queenswood.repldriven.com
---
# CNAME record Cloud DNS needs to serve for DNSAuthorization to
# validate. The name carries a per-authorization unique suffix
# (`_acme-challenge_<token>`) that Certificate Manager generates --
# you can't pick it, you have to read it back after the
# DNSAuthorization reconciles. Crossplane's DNS RecordSet doesn't
# accept cross-resource refs (same limitation noted in
# networking.yml), so both the name and the target are hardcoded
# here. To refresh after a DNSAuthorization recreate:
#   kubectl --context kind-xp-mp get dnsauthorization \
#     queenswood-dns-auth -o json | \
#     jq '.status.atProvider.dnsResourceRecord'
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: queenswood-dns-auth-cname
spec:
  forProvider:
    managedZoneRef:
      name: queenswood-zone
    name: _acme-challenge_6d62fz6lwhq33oim.queenswood.repldriven.com.
    type: CNAME
    ttl: 300
    rrdatas:
      - "29bd48fb-9b7e-418e-8c22-5121d33e5f00.0.europe-west2.authorize.certificatemanager.goog."
---
apiVersion: certificatemanager.gcp.upbound.io/v1beta1
kind: Certificate
metadata:
  name: queenswood-cert
spec:
  forProvider:
    location: europe-west2
    managed:
      - domains:
          - queenswood.repldriven.com
        dnsAuthorizationsRefs:
          - name: queenswood-dns-auth
