apiVersion: container.gcp.upbound.io/v1beta2
kind: Cluster
metadata:
  name: queenswood-gke
spec:
  forProvider:
    location: europe-west2-a
    initialNodeCount: 1
    removeDefaultNodePool: true
    deletionProtection: false
    nodeConfig:
      machineType: e2-standard-2
      diskType: pd-standard
      diskSizeGb: 50
    networkRef:
      name: queenswood-vpc
    subnetworkRef:
      name: queenswood-subnet
    ipAllocationPolicy:
      clusterSecondaryRangeName: pods
      servicesSecondaryRangeName: services
    workloadIdentityConfig:
      workloadPool: project-7da8be71-664d-40bd-b5d.svc.id.goog
    releaseChannel:
      channel: REGULAR
    addonsConfig:
      # The HTTP Load Balancing addon runs the master-side L7
      # controller that powers both legacy Ingress and Gateway API.
      # Without it, neither path produces a load balancer.
      httpLoadBalancing:
        disabled: false
    # Gateway API is the GA path for HTTP(S) load balancing on GKE;
    # legacy Ingress (ingressClassName: gce) is in maintenance mode.
    # Enabling this registers the gke-l7-* GatewayClasses and the
    # `networking.gke.io/gateway` controller. CHANNEL_STANDARD pins
    # to the standard channel of the Gateway API CRDs.
    networkConfig:
      gatewayApiConfig:
        channel: CHANNEL_STANDARD
  writeConnectionSecretToRef:
    name: queenswood-gke-kubeconfig
    namespace: crossplane-system
---
apiVersion: container.gcp.upbound.io/v1beta2
kind: NodePool
metadata:
  name: queenswood-pool
spec:
  forProvider:
    location: europe-west2-a
    clusterRef:
      name: queenswood-gke
    # Autoscaling between 3 and 6 nodes. nodeCount is omitted on
    # purpose -- GCP rejects it when autoscaling is set, and
    # minNodeCount handles the floor that nodeCount used to enforce.
    autoscaling:
      minNodeCount: 3
      maxNodeCount: 6
    nodeConfig:
      machineType: e2-standard-2
      diskSizeGb: 50
      diskType: pd-standard
      oauthScopes:
        - https://www.googleapis.com/auth/cloud-platform
      workloadMetadataConfig:
        mode: GKE_METADATA
