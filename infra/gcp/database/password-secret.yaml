# Input Secret for the CloudSQL User MR. Dev-only placeholder;
# the same value lives in queenswood-platform's Release template.
apiVersion: v1
kind: Secret
metadata:
  name: queenswood-keycloak-password
  namespace: crossplane-system
  annotations:
    description: Keycloak DB password
type: Opaque
stringData:
  password: change-me-keycloak-db-password
