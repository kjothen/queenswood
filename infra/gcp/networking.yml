apiVersion: compute.gcp.upbound.io/v1beta1
kind: GlobalAddress
metadata:
  name: queenswood-ingress-ip
spec:
  forProvider:
    addressType: EXTERNAL
---
apiVersion: dns.gcp.upbound.io/v1beta1
kind: ManagedZone
metadata:
  name: queenswood-zone
spec:
  forProvider:
    dnsName: queenswood.repldriven.com.
    description: Queenswood public DNS
    visibility: public
---
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: queenswood-apex
spec:
  forProvider:
    managedZoneRef:
      name: queenswood-zone
    name: queenswood.repldriven.com.
    type: A
    ttl: 300
    # IP is hardcoded because the Crossplane DNS provider's RecordSet
    # has no working cross-resource reference for rrdatas: rrdatasRefs
    # exists in v1beta1 but is dropped during conversion to v1beta2
    # (the storage version), and v1beta2 / the .m. variant both expose
    # the flat schema with rrdatas as a literal string list. The IP is
    # the address reserved on the queenswood-ingress-ip GlobalAddress
    # above; Crossplane reconciles drift, so the literal value is
    # stable for the lifetime of that resource.
    rrdatas:
      - "34.36.148.164"
