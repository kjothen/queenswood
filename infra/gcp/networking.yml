apiVersion: compute.gcp.upbound.io/v1beta1
kind: Address
metadata:
  name: queenswood-ingress-ip
spec:
  forProvider:
    # Regional external IPv4 for the gke-l7-regional-external-managed
    # Gateway. The cluster is single-zone (europe-west2-a), so a
    # regional LB matches the deployment footprint and is cheaper
    # than the global-anycast variant. Switched from GlobalAddress
    # alongside the Gateway API migration (chart 0.5.0+).
    addressType: EXTERNAL
    region: europe-west2
---
apiVersion: dns.gcp.upbound.io/v1beta1
kind: ManagedZone
metadata:
  name: queenswood-zone
spec:
  forProvider:
    dnsName: queenswood.repldriven.com.
    description: Queenswood public DNS
    visibility: public
---
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: queenswood-apex
spec:
  forProvider:
    managedZoneRef:
      name: queenswood-zone
    name: queenswood.repldriven.com.
    type: A
    ttl: 300
    # IP is hardcoded because the Crossplane DNS provider's RecordSet
    # has no working cross-resource reference for rrdatas: rrdatasRefs
    # exists in v1beta1 but is dropped during conversion to v1beta2
    # (the storage version), and v1beta2 / the .m. variant both expose
    # the flat schema with rrdatas as a literal string list. After the
    # regional Address above is provisioned, update this value with
    # the IP from
    #   gcloud compute addresses describe queenswood-ingress-ip \
    #     --region=europe-west2 --format='value(address)'
    # and push a follow-up commit. Crossplane reconciles drift, so the
    # literal value is stable for the lifetime of the Address.
    rrdatas:
      - "34.147.173.241"
