apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xpublicendpoint.gcp
spec:
  compositeTypeRef:
    apiVersion: platform.repldriven.com/v1alpha1
    kind: XPublicEndpoint
  mode: Pipeline
  pipeline:
    - step: endpoint
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $ingress := $xr.spec }}
            {{- $domain := dig "domain" "" $ingress }}
            {{- if $domain }}
            {{- $zone := dig "zone" dict $ingress }}
            {{- if not (dig "name" "" $zone) }}
            {{- fail "spec.ingress.zone.name is absent" }}
            {{- end }}
            {{- if not (dig "project" "" $zone) }}
            {{- fail "spec.ingress.zone.project is absent" }}
            {{- end }}
            {{- $name := printf "%s-%s-%s" $xr.spec.code $xr.spec.env $xr.spec.label }}
            {{- $observed := dig "resources" dict .observed }}
            ---
            # Kept through `down`. An address is the one thing here whose
            # identity is published: releasing it means every record
            # pointing at it is wrong, and the replacement is a different
            # number rather than the same one returned.
            apiVersion: compute.gcp.m.upbound.io/v1beta1
            kind: Address
            metadata:
              name: addr-{{ $name }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: address
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $xr.spec.projectId }}
                region: {{ $xr.spec.region }}
                addressType: EXTERNAL
            ---
            # One authorization covers the domain and its wildcard, so
            # both certificates below share this one rather than each
            # validating separately.
            apiVersion: certificatemanager.gcp.m.upbound.io/v1beta1
            kind: DNSAuthorization
            metadata:
              name: da-{{ $name }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: dns-auth
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $xr.spec.projectId }}
                # Same region as the certificates below. A regional
                # certificate takes a regional authorization, and the
                # gateway class is regional.
                location: {{ $xr.spec.region }}
                domain: {{ $domain | quote }}
            {{- /* Two certificates rather than one with two names:
                   managed.domains is ForceNew, so a name added to a
                   live certificate replaces it. See
                   docs/recipes/infra/crossplane-providers.md. */}}
            {{- range $c := list (dict "slug" "" "domain" $domain) (dict "slug" "-wildcard" "domain" (printf "*.%s" $domain)) }}
            ---
            apiVersion: certificatemanager.gcp.m.upbound.io/v1beta1
            kind: Certificate
            metadata:
              name: crt-{{ $name }}{{ $c.slug }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cert{{ $c.slug }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $xr.spec.projectId }}
                location: {{ $xr.spec.region }}
                managed:
                  domains:
                    - {{ $c.domain | quote }}
                  dnsAuthorizationsRefs:
                    - name: da-{{ $name }}
            {{- end }}
            {{- /* The validation record exists only once the
                   authorization does, so it is read from what is
                   observed rather than patched from spec. Absent on the
                   first pass, present on the next. */}}
            {{- $auth := dig "dns-auth" "resource" "status" "atProvider" "dnsResourceRecord" list $observed }}
            {{- if $auth }}
            {{- $record := index $auth 0 }}
            ---
            apiVersion: dns.gcp.m.upbound.io/v1beta1
            kind: RecordSet
            metadata:
              name: rs-{{ $name }}-auth-cname
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: dns-auth-record
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $zone.project | quote }}
                managedZoneRef:
                  name: {{ $zone.name | quote }}
                # Both arrive fully qualified, so the trailing dot is
                # trimmed before it is added -- appending blindly gives
                # a name ending in two, which Cloud DNS takes and
                # nothing resolves.
                name: {{ printf "%s." (trimSuffix "." $record.name) | quote }}
                type: CNAME
                ttl: 300
                rrdatas:
                  - {{ printf "%s." (trimSuffix "." $record.data) | quote }}
            {{- end }}
            {{- /* Likewise the address: a record pointing at nothing is
                   worse than no record, so these wait for it. */}}
            {{- $ip := dig "address" "resource" "status" "atProvider" "address" "" $observed }}
            {{- if $ip }}
            {{- /* Subdomains only. Nothing serves the bare domain over
                   HTTPS -- it appears in the chart's routes solely as
                   the :80 redirect -- and pointing the console at it as
                   well would give the SPA a second origin, which a
                   realm imported once and never overwritten makes
                   permanent. */}}
            {{- range $host := dig "subdomains" list $ingress }}
            {{- $fqdn := printf "%s.%s" $host $domain }}
            {{- $slug := $host }}
            ---
            apiVersion: dns.gcp.m.upbound.io/v1beta1
            kind: RecordSet
            metadata:
              name: rs-{{ $name }}-{{ $slug }}-a
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: dns-{{ $slug }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $zone.project | quote }}
                managedZoneRef:
                  name: {{ $zone.name | quote }}
                name: {{ printf "%s." $fqdn | quote }}
                type: A
                ttl: 300
                rrdatas:
                  - {{ $ip | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
    # =======================================================================
    # One binding per principal, which patch-and-transform cannot
    # express: it composes a fixed set of resources and has no way to
    # say "none" for an empty list. So this mirrors the plane's own
    # access step rather than inventing a second shape.
    #
    # Nothing is emitted where no viewers are named, which is an
    # installation that has not decided yet rather than one that has
    # decided nobody.
    # =======================================================================
    # =======================================================================
    # This instance's bucket, in the installation's recovery project.
    # Templated rather than patched because the block is absent until
    # an instance keeps something, and because the name is built from
    # part of another field.
    #
    # One bucket per instance rather than one per installation, so an
    # instance's identity is granted on its own backups and reaches no
    # other's -- which is the whole reason the project sits outside the
    # instance in the first place, and would be given back by a bucket
    # everything shares.
    # =======================================================================
    - step: auto-ready
      functionRef:
        name: function-auto-ready
