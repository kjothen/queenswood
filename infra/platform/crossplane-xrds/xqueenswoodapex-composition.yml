apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xqueenswoodapex.gcp
spec:
  compositeTypeRef:
    apiVersion: platform.queenswood.repldriven.com/v1alpha1
    kind: XQueenswoodApex
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: address
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Address
              metadata:
                name: queenswood-ingress-ip
              spec:
                forProvider: {}
            patches:
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - fromFieldPath: spec.addressType
                toFieldPath: spec.forProvider.addressType
              # Pivot Address.status.atProvider.address up into XR.status.ip
              # so the apex RecordSet (below) can pick it up declaratively.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.address
                toFieldPath: status.ip
          - name: apex
            base:
              apiVersion: dns.gcp.m.upbound.io/v1beta1
              kind: RecordSet
              metadata:
                name: queenswood-apex
              spec:
                forProvider:
                  type: A
                  ttl: 300
                  rrdatas: [""]
            patches:
              - fromFieldPath: spec.managedZoneRef.name
                toFieldPath: spec.forProvider.managedZoneRef.name
              - fromFieldPath: spec.domain
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s."
              - fromFieldPath: status.ip
                toFieldPath: spec.forProvider.rrdatas[0]
          # Keycloak's `keycloak.<env-domain>` subdomain shares the
          # same managed IP. Lives in the apex composite (not the
          # queenswood-keycloak chart) because `RecordSet` is a
          # Crossplane managed resource: its CRD only exists on the
          # kind management plane, while the chart installs onto GKE.
          - name: api
            base:
              apiVersion: dns.gcp.m.upbound.io/v1beta1
              kind: RecordSet
              metadata:
                name: queenswood-api
              spec:
                forProvider:
                  type: A
                  ttl: 300
                  rrdatas: [""]
            patches:
              - fromFieldPath: spec.managedZoneRef.name
                toFieldPath: spec.forProvider.managedZoneRef.name
              - fromFieldPath: spec.domain
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "api.%s."
              - fromFieldPath: status.ip
                toFieldPath: spec.forProvider.rrdatas[0]
          - name: console
            base:
              apiVersion: dns.gcp.m.upbound.io/v1beta1
              kind: RecordSet
              metadata:
                name: queenswood-console
              spec:
                forProvider:
                  type: A
                  ttl: 300
                  rrdatas: [""]
            patches:
              - fromFieldPath: spec.managedZoneRef.name
                toFieldPath: spec.forProvider.managedZoneRef.name
              - fromFieldPath: spec.domain
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "console.%s."
              - fromFieldPath: status.ip
                toFieldPath: spec.forProvider.rrdatas[0]
          - name: keycloak
            base:
              apiVersion: dns.gcp.m.upbound.io/v1beta1
              kind: RecordSet
              metadata:
                name: queenswood-keycloak
              spec:
                forProvider:
                  type: A
                  ttl: 300
                  rrdatas: [""]
            patches:
              - fromFieldPath: spec.managedZoneRef.name
                toFieldPath: spec.forProvider.managedZoneRef.name
              - fromFieldPath: spec.domain
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "keycloak.%s."
              - fromFieldPath: status.ip
                toFieldPath: spec.forProvider.rrdatas[0]
