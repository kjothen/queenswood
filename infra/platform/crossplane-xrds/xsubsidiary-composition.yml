apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xsubsidiary.gcp
spec:
  compositeTypeRef:
    apiVersion: platform.repldriven.com/v1alpha1
    kind: XSubsidiary
  mode: Pipeline
  pipeline:
    # =======================================================================
    # What is true of the whole installation rather than of this folder:
    # the access mapping, stated once and read by the plane and every
    # instance as well. Merged into the pipeline's context, where the
    # access step below reads it.
    #
    # Optional, unlike the plane's. This composite is applied by the boot
    # cluster before any EnvironmentConfig exists -- the file reaches a
    # cluster through Argo, which is not running until the plane is up --
    # and a Required resolution would fail the pipeline, which on this
    # kind means the folder itself is not composed. Absent, the manifest's
    # own access is what binds, which is what a bootstrap sets.
    # =======================================================================
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          policy:
            resolution: Optional
          environmentConfigs:
            - type: Selector
              selector:
                mode: Multiple
                matchLabels:
                  - type: FromCompositeFieldPath
                    key: installation
                    valueFromFieldPath: spec.code
    # =======================================================================
    # The folder, and the only resource this kind composes itself. Here
    # rather than in patch-and-transform because what it manages depends
    # on how it was obtained, and a patch cannot branch.
    #
    # Delete is withheld in every mode: composed, it is the protected
    # tier and holds every project; adopted, it is not ours to delete at
    # all. Liens are applied separately and are the control that holds
    # if this is edited.
    #
    # Update is withheld where the folder was adopted. A folder somebody
    # handed over is theirs to name and to place, so displayName and
    # parent are read rather than asserted -- and withholding Update is
    # what makes that structural instead of a convention, since the
    # provider then cannot write either field whatever the spec says.
    # An empty displayName renames a folder and an empty parent moves
    # it, so the difference matters more than it reads.
    # =======================================================================
    - step: folder
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $code := $xr.spec.code }}
            {{- /* The installation's folder, overridden by this
                   manifest's own field where it names one. Stated in
                   the environment so a handover touches one file: the
                   id where a folder is handed over, the parent and the
                   name where we compose one. */}}
            {{- $envFolder := dig "folder" dict (index .context "apiextensions.crossplane.io/environment" | default dict) }}
            {{- $folderId := dig "folderId" (dig "folderId" "" $envFolder) $xr.spec }}
            {{- $adopted := ne $folderId "" }}
            {{- /* Precedence rather than prohibition. An adopted folder
                   is named and placed by whoever owns it, so these are
                   read from GCP and never written -- and stating them
                   anyway is inert rather than an error, which is the
                   better failure: a rejected EnvironmentConfig would
                   stop every composite that reads it, not just this
                   one. */}}
            {{- $parent := "" }}
            {{- $displayName := "" }}
            {{- if not $adopted }}
            {{- $parent = dig "parent" (dig "parent" "" $envFolder) $xr.spec }}
            {{- $displayName = dig "displayName" (dig "displayName" "" $envFolder) $xr.spec }}
            {{- end }}
            {{- /* A soft-deleted folder still reads as existing, so the
                   provider reports it Ready for the whole 30-day window
                   and goes on doing so. Readiness is stated here from
                   the state the folder reports, which moves the
                   composite to Ready: False where auto-ready alone
                   would not. Absent on the first pass, which reads as
                   not ready, and is correct. */}}
            {{- $observed := dig "folder" "resource" dict (dig "resources" dict .observed) }}
            {{- $state := dig "status" "atProvider" "lifecycleState" "" $observed }}
            ---
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: Folder
            metadata:
              # Named from the code rather than generated, so the
              # bindings below can spell it and the Kubernetes name
              # matches the GCP one.
              name: {{ printf "fldr-%s" $code }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: folder
                gotemplating.fn.crossplane.io/ready: {{ if eq $state "ACTIVE" }}"True"{{ else }}"False"{{ end }}
                {{- if $adopted }}
                # Adoption. Absent on a folder this composes, so a
                # subsidiary with no folderId creates one and a handover
                # records the one it was given.
                crossplane.io/external-name: {{ $folderId | quote }}
                {{- end }}
            spec:
              managementPolicies:
                - Observe
                - Create
                {{- if not $adopted }}
                - Update
                {{- end }}
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                {{- with $parent }}
                parent: {{ . | quote }}
                {{- end }}
                {{- with $displayName }}
                displayName: {{ . | quote }}
                {{- end }}
                # Stops the provider deleting the folder. Not a person:
                # a console delete goes through regardless, which is
                # what nobody holding folders.delete is for.
                deletionProtection: true
            {{- /* The numeric id lands in the external-name annotation
                   before it appears anywhere in status.atProvider. An
                   adopted folder answers from the spec on the first
                   pass, before anything is observed; a composed one has
                   no answer until it exists, and reports none rather
                   than an empty string. */}}
            {{- $reported := dig "metadata" "annotations" "crossplane.io/external-name" $folderId $observed }}
            {{- if $reported }}
            ---
            apiVersion: platform.repldriven.com/v1alpha1
            kind: XSubsidiary
            status:
              folderId: {{ $reported | quote }}
            {{- end }}
    - step: access
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $code := $xr.spec.code }}
            {{- /* The installation's mapping, overridden per capability by
                   this manifest's own field where it names one. Stated
                   once for the subsidiary, the plane and every instance,
                   because it is one mapping and each binds the subset it
                   can -- only these two bind on a folder. */}}
            {{- $env := index .context "apiextensions.crossplane.io/environment" | default dict }}
            {{- $envAccess := dig "access" dict $env }}
            {{- $ownAccess := dig "access" dict $xr.spec }}
            {{- $capabilities := list
                  (dict "key" "platformViewer" "roles" (list
                    "roles/browser"
                    "roles/compute.viewer"
                    "roles/container.viewer"
                    "roles/iam.serviceAccountViewer"
                    "roles/logging.viewer"
                    "roles/monitoring.viewer"))
                  (dict "key" "clusterAdmin" "roles" (list
                    "roles/container.admin")) }}
            {{- range $capability := $capabilities }}
            {{- range $member := dig $capability.key (dig $capability.key list $envAccess) $ownAccess }}
            {{- range $role := $capability.roles }}
            {{- /* Hashed, not indexed: a member removed from the middle
                   of the list would otherwise renumber the ones after
                   it, and Crossplane would delete and recreate live
                   bindings. */}}
            {{- $slug := printf "%s-%s"
                  ($role | splitList "/" | last | replace "." "-" | lower)
                  (sha256sum $member | trunc 8) }}
            {{- $resource := printf "access-%s-%s" (kebabcase $capability.key) $slug }}
            ---
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: FolderIAMMember
            metadata:
              name: {{ printf "%s-%s" $code $resource }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $resource }}
            spec:
              # With Delete, unlike the folder above: a principal
              # dropped from the access mapping has to lose the binding
              # in GCP, not just the resource naming it.
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
                - Delete
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                role: {{ $role | quote }}
                member: {{ $member | quote }}
                folderRef:
                  name: {{ printf "fldr-%s" $code | quote }}
            {{- end }}
            {{- end }}
            {{- end }}

    # =======================================================================
    # Readiness for whatever the template step composed. go-templating
    # sets none at all, so without this the access bindings are never
    # ready in the desired state and the composite sits at Creating
    # however healthy GCP is.
    # =======================================================================
    - step: auto-ready
      functionRef:
        name: function-auto-ready
