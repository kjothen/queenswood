apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xqueenswoodinstallations.platform.queenswood.repldriven.com
spec:
  scope: Namespaced
  group: platform.queenswood.repldriven.com
  names:
    kind: XQueenswoodInstallation
    plural: xqueenswoodinstallations
  defaultCompositionRef:
    name: xqueenswoodinstallation.gcp
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - createFolder
                - billingAccountId
                - access
              properties:
                # Folder only, for now. The management project, the
                # durable tier and the instances join this spec as they
                # are built; see docs/recipes/cloud-foundation.md.
                billingAccountId:
                  type: string
                  description: |
                    Billing account for every project in the
                    installation. The bootstrap identity holds
                    billing.user on it.
                access:
                  type: object
                  description: |
                    Groups that hold rights inside the installation. Named
                    in full rather than derived from a domain, because a
                    folder may be handed to you by an organisation whose
                    groups are named nothing like these.
                  required:
                    - operatorsGroup
                    - clusterAdminsGroup
                    - secretAdminsGroup
                  properties:
                    operatorsGroup:
                      type: string
                      description: Viewer on the folder. Day-to-day.
                    clusterAdminsGroup:
                      type: string
                      description: container.admin on the folder. Empty.
                    secretAdminsGroup:
                      type: string
                      description: |
                        secretmanager.admin on the management project.
                        Empty.
                region:
                  type: string
                  default: europe-west2
                zone:
                  type: string
                  default: europe-west2-a
                  description: |
                    The cluster is zonal, not regional: one zonal control
                    plane falls under the free allowance, and a plane
                    running Crossplane and Argo does not need three.
                management:
                  type: object
                  properties:
                    providerServiceAccount:
                      type: string
                      default: crossplane-provider-gcp
                      description: |
                        The Kubernetes service account Crossplane's GCP
                        providers run as on the management cluster,
                        pinned by a DeploymentRuntimeConfig. Workload
                        Identity binds to this name, so it cannot be the
                        generated one.
                    machineType:
                      type: string
                      default: e2-standard-2
                      description: |
                        Each upjet provider pod is a Terraform runtime,
                        and Argo brings five components, so the floor is
                        higher than it looks. Smaller is worth trying,
                        measured rather than assumed.
                    projectId:
                      type: string
                      description: |
                        The management project's id. Always supplied: a
                        project id is consumed permanently and cannot be
                        undeleted into usefulness, so a rebuilt plane
                        that invented one would strand the first.
                    adopt:
                      type: string
                      pattern: '^projects/[a-z][a-z0-9-]{4,28}[a-z0-9]$'
                      description: |
                        An existing management project to take over,
                        written projects/<id> -- the prefixed form
                        Crossplane records as the external name.

                        Separate from projectId because creation and
                        adoption cannot share a field. GCP answers
                        permission denied, never not found, for a project
                        id you do not own, so an external name set before
                        the project exists makes the first observation
                        fail and creation never follows.
                    displayName:
                      type: string
                      default: queenswood management
                createFolder:
                  type: object
                  required:
                    - parent
                    - displayName
                  properties:
                    parent:
                      type: string
                      pattern: '^(organizations|folders)/[0-9]+$'
                      description: |
                        Where the folder is nested. GCP checks
                        resourcemanager.folders.create on this, not on
                        the organisation, so it may be either.
                    displayName:
                      type: string
                      description: |
                        Labels this installation for humans and nothing
                        else -- the folder id is the identifier, and a
                        folder handed to you carries whatever name its
                        organisation chose. Suffixed like a project id by
                        default: display names must be unique among
                        siblings, so a fixed name means the second
                        installation under a parent is refused.
                    folderId:
                      type: string
                      pattern: '^folders/[0-9]+$'
                      description: |
                        An existing folder to adopt instead of creating
                        one. A rebuilt control plane has no record of
                        what the last one made, and GCP permits two
                        folders with the same display name under one
                        parent, so without this a rebuild silently
                        creates a second installation.
            status:
              type: object
              properties:
                managementProjectId:
                  type: string
                  description: The management project, once it exists.
                clusterEndpoint:
                  type: string
                  description: The management cluster's API endpoint.
                folderId:
                  type: string
                  description: |
                    The folder as folders/<id>, which is the form a
                    parent reference takes and what every later step
                    reads. Comes from the external-name annotation,
                    which holds the resource name rather than the
                    bare number.
