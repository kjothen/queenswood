apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xqueenswoodinstallation.gcp
spec:
  compositeTypeRef:
    apiVersion: platform.queenswood.repldriven.com/v1alpha1
    kind: XQueenswoodInstallation
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # ===================================================================
          # The folder is the installation. Everything but Delete: a
          # folder holds every project, and reconciliation must never be
          # able to take it. v2 namespaced MRs have no deletionPolicy, so
          # managementPolicies is the only spelling. Liens are applied
          # separately, and are the control that holds if this is edited.
          # ===================================================================
          - name: folder
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: Folder
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: queenswood
                  parent: organizations/0
                  # Stops the provider deleting the folder. Not a
                  # person: a console delete goes through regardless,
                  # which is what nobody holding folders.delete is for.
                  # Already the default, stated because it matters.
                  deletionProtection: true
            # A soft-deleted folder still reads as existing, so the
            # provider reports this resource Ready for the whole 30-day
            # window and goes on doing so -- 22 minutes of deletion
            # produced no condition change, no event and no log line.
            # This check moves the composite to Ready: False. The managed
            # resource itself still says True, so alerting belongs on
            # composites rather than on MRs.
            readinessChecks:
              - type: MatchString
                fieldPath: status.atProvider.lifecycleState
                matchString: ACTIVE
            patches:
              # Named from the code rather than generated, so every
              # reference below can spell it and the Kubernetes name
              # matches the GCP one.
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "fldr-%s"
              # Adoption. Skipped when absent, so a first run creates and
              # a rebuild takes over what is already there.
              - fromFieldPath: spec.createFolder.folderId
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - fromFieldPath: spec.createFolder.parent
                toFieldPath: spec.forProvider.parent
              - fromFieldPath: spec.createFolder.displayName
                toFieldPath: spec.forProvider.displayName
              # The numeric id lands in the external-name annotation
              # before it appears anywhere in status.atProvider.
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.folderId
          # ===================================================================
          # The management project, referenced to the folder rather than
          # patched from its id: folderIdRef resolves the composed
          # Folder by name, so Crossplane orders the two itself.
          # ===================================================================
          - name: management-project
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: Project
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  name: queenswood management
                  # No default VPC. The org policy says the same thing,
                  # and a folder handed to us may not carry it.
                  autoCreateNetwork: false
                  # Provider-side, and already the default. The project
                  # holds the platform: nothing reconciling should be
                  # able to remove it.
                  deletionPolicy: PREVENT
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
              # Adoption only. Setting this before the project exists
              # makes observe fail with permission denied, which
              # Crossplane cannot tell from a real error, so it never
              # creates.
              - fromFieldPath: spec.management.adopt
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.projectId
              # Derived first, then overridden: a later patch wins when
              # its source is set and is skipped when it is absent, so
              # this is how a field gets a default it cannot state.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
              - fromFieldPath: spec.management.displayName
                toFieldPath: spec.forProvider.name
              - fromFieldPath: spec.billingAccountId
                toFieldPath: spec.forProvider.billingAccount
              # Names the composed Folder, so Crossplane resolves it and
              # orders the two itself rather than the id being threaded
              # through status.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.folderIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "fldr-%s"
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.managementProjectId
          # ===================================================================
          # APIs the management project needs before anything runs in it.
          # projectRef names the composed Project, so each waits for it
          # without an id being threaded through.
          # ===================================================================
          - name: management-service-iam
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: iam.googleapis.com
                  # Leaving an API enabled on the way down is harmless
                  # and avoids a dependent-resource cascade.
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-iam"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-iamcredentials
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: iamcredentials.googleapis.com
                  # Leaving an API enabled on the way down is harmless
                  # and avoids a dependent-resource cascade.
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-iamcredentials"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-serviceusage
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: serviceusage.googleapis.com
                  # Leaving an API enabled on the way down is harmless
                  # and avoids a dependent-resource cascade.
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-serviceusage"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-resourcemanager
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: cloudresourcemanager.googleapis.com
                  # Leaving an API enabled on the way down is harmless
                  # and avoids a dependent-resource cascade.
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-resourcemanager"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-compute
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: compute.googleapis.com
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-compute"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-container
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: container.googleapis.com
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-container"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          # ===================================================================
          # Network for the management cluster. Nothing else lives here,
          # so one subnet with the two secondary ranges GKE needs.
          # Network and Subnetwork take a project id rather than a ref,
          # so it comes from the manifest, which always carries it.
          # ===================================================================
          - name: management-vpc
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Network
              metadata:
                namespace: crossplane-system
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  autoCreateSubnetworks: false
                  routingMode: REGIONAL
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "vpc-%s-c-mgmt"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
          - name: management-subnet
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Subnetwork
              metadata:
                namespace: crossplane-system
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  ipCidrRange: 10.60.0.0/16
                  privateIpGoogleAccess: true
                  secondaryIpRange:
                    - rangeName: pods
                      ipCidrRange: 10.61.0.0/16
                    - rangeName: services
                      ipCidrRange: 10.62.0.0/20
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.regionCode
                  strategy: string
                  string:
                    fmt: "sb-%s-c-mgmt-%s"
                toFieldPath: metadata.name
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.networkRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "vpc-%s-c-mgmt"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region

          # ===================================================================
          # The cluster that will run Crossplane and Argo, and nothing
          # else. Zonal, because one zonal control plane falls under the
          # free allowance and a management plane does not need three.
          #
          # The default node pool is removed and replaced, which costs
          # about ten minutes here but makes every later change of
          # machine type a pool replacement rather than a cluster one --
          # and the right size for this is not yet known.
          # ===================================================================
          - name: management-cluster
            base:
              apiVersion: container.gcp.m.upbound.io/v1beta1
              kind: Cluster
              metadata:
                namespace: crossplane-system
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  initialNodeCount: 1
                  removeDefaultNodePool: true
                  deletionProtection: false
                  releaseChannel:
                    channel: REGULAR
                  ipAllocationPolicy:
                    clusterSecondaryRangeName: pods
                    servicesSecondaryRangeName: services
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "gke-%s-c-mgmt"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.networkRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "vpc-%s-c-mgmt"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.regionCode
                  strategy: string
                  string:
                    fmt: "sb-%s-c-mgmt-%s"
                toFieldPath: spec.forProvider.subnetworkRef.name
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - fromFieldPath: spec.zone
                toFieldPath: spec.forProvider.location
              # Workload Identity, so the platform's own service account
              # is assumed by a pod rather than held as a key.
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.workloadIdentityConfig.workloadPool
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s.svc.id.goog"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.endpoint
                toFieldPath: status.clusterEndpoint
          - name: management-nodes
            base:
              apiVersion: container.gcp.m.upbound.io/v1beta1
              kind: NodePool
              metadata:
                namespace: crossplane-system
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  nodeCount: 1
                  nodeConfig:
                    diskSizeGb: 50
                    diskType: pd-standard
                    oauthScopes:
                      - https://www.googleapis.com/auth/cloud-platform
                    workloadMetadataConfig:
                      mode: GKE_METADATA
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "np-%s-c-mgmt"
              # By value, not clusterRef. The reference extractor reads a
              # field the provider never fills for Cluster -- there is no
              # forProvider.name, and atProvider.name stays empty -- so it
              # resolves to nothing forever. The cluster's name is its
              # external name, which this composition sets, so the value
              # is as deterministic as the reference would have been.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.cluster
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "gke-%s-c-mgmt"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - fromFieldPath: spec.zone
                toFieldPath: spec.forProvider.location
              - fromFieldPath: spec.management.machineType
                toFieldPath: spec.forProvider.nodeConfig.machineType
          # ===================================================================
          # The platform's own identity. Created here, assumed by pods on
          # the management cluster through Workload Identity, and never
          # held by anyone -- the same property the bootstrap identity
          # has, arrived at differently.
          #
          # What it is allowed to do is not here yet: folder-scoped
          # bindings need FolderIAMMember, which is unverified against
          # this provider version.
          # ===================================================================
          - name: platform-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood platform
                  description: Runs the management plane; see docs/recipes/cloud-foundation.md
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-platform"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              # The account id is the external name, so it is stated
              # rather than generated: the Workload Identity member
              # string below has to spell the same address.
              - fromFieldPath: spec.code
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-platform"
          - name: platform-identity-workload-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.workloadIdentityUser
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-platform-wi"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.serviceAccountIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-platform"
              # serviceAccount:<project>.svc.id.goog[<namespace>/<ksa>]
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "serviceAccount:%s.svc.id.goog[crossplane-system/crossplane-provider-gcp]"
    # =======================================================================
    # What each capability may do inside the installation, and nothing
    # about who holds it -- that is the manifest's access mapping, and
    # the principals in it belong to whoever owns the directory.
    # Organisation scope is bound by gcp-groups-bind; everything here is
    # folder or project scoped, so it belongs beside what it applies to.
    #
    # A separate step because the resources vary: none for a capability
    # the organisation does not provide, one per member per role where it
    # does. Patch-and-transform composes a fixed set.
    # =======================================================================
    - step: access
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $code := $xr.spec.code }}
            {{- $access := dig "access" dict $xr.spec }}
            {{- $project := dig "management" "projectId" "" $xr.spec }}
            {{- $capabilities := list
                  (dict "key" "platformViewer" "kind" "FolderIAMMember" "roles" (list
                    "roles/browser"
                    "roles/compute.viewer"
                    "roles/container.viewer"
                    "roles/iam.serviceAccountViewer"
                    "roles/logging.viewer"
                    "roles/monitoring.viewer"))
                  (dict "key" "platformAdmin" "kind" "ServiceAccountIAMMember" "roles" (list
                    "roles/iam.serviceAccountTokenCreator"))
                  (dict "key" "clusterAdmin" "kind" "FolderIAMMember" "roles" (list
                    "roles/container.admin"))
                  (dict "key" "secretsAdmin" "kind" "ProjectIAMMember" "roles" (list
                    "roles/secretmanager.admin")) }}
            {{- range $capability := $capabilities }}
            {{- range $member := dig $capability.key list $access }}
            {{- range $role := $capability.roles }}
            {{- /* Hashed, not indexed: a member removed from the middle of
                   the list would otherwise renumber the ones after it, and
                   Crossplane would delete and recreate live bindings. */}}
            {{- $slug := printf "%s-%s"
                  ($role | trimPrefix "roles/" | replace "." "-" | lower)
                  (sha256sum $member | trunc 8) }}
            {{- $resource := printf "access-%s-%s" (kebabcase $capability.key) $slug }}
            ---
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: {{ $capability.kind }}
            metadata:
              name: {{ printf "%s-%s" $code $resource }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $resource }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                role: {{ $role | quote }}
                member: {{ $member | quote }}
            {{- if eq $capability.kind "FolderIAMMember" }}
                folderRef:
                  name: {{ printf "fldr-%s" $code | quote }}
            {{- else if eq $capability.kind "ProjectIAMMember" }}
                project: {{ $project | quote }}
            {{- else if eq $capability.kind "ServiceAccountIAMMember" }}
                serviceAccountIdRef:
                  name: {{ printf "sa-%s-platform" $code | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
    # =======================================================================
    # Readiness for whatever the access step composed. Last, and not
    # optional: patch-and-transform sets readiness only for the resources
    # it composes itself, and go-templating sets none at all, so without
    # this the access bindings are never ready in the desired state. The
    # composite then sits at Creating however healthy GCP is -- every
    # managed resource Ready, nine unready names in the message, and a
    # wait on the composite that can only time out.
    # =======================================================================
    - step: auto-ready
      functionRef:
        name: function-auto-ready
