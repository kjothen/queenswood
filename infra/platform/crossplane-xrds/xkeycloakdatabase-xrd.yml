apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xkeycloakdatabases.platform.queenswood.repldriven.com
spec:
  scope: Namespaced
  group: platform.queenswood.repldriven.com
  names:
    kind: XKeycloakDatabase
    plural: xkeycloakdatabases
  defaultCompositionRef:
    name: xkeycloakdatabase.gcp
  # Credentials surface via the composed `User` resource's own
  # `writeConnectionSecretToRef` (patched to the XR's namespace).
  # We do not declare `connectionSecretKeys` here: Crossplane v2 only
  # permits that on cluster-scope XRDs, and we want per-env namespaced
  # XRs. `status.connectionName` carries the proxy connection string.
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [region, instanceName, databaseName, username]
              properties:
                region: { type: string }
                instanceName: { type: string }
                databaseName: { type: string }
                username: { type: string }
                # Smallest valid Postgres tier — shared-core
                # (`db-f1-micro`, `db-g1-small`) is MySQL-only, so
                # custom shape `db-custom-<vCPUs>-<memMB>` is the
                # floor. 1 vCPU / 3840 MB is the minimum legal combo.
                tier: { type: string, default: db-custom-1-3840 }
                postgresVersion: { type: string, default: POSTGRES_16 }
            status:
              type: object
              properties:
                # `<project>:<region>:<instance>` — the format
                # cloud-sql-proxy expects on its CLI.
                connectionName: { type: string }
