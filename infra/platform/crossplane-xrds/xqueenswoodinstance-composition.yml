apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xqueenswoodinstance.gcp
spec:
  compositeTypeRef:
    apiVersion: queenswood.repldriven.com/v1alpha1
    kind: XQueenswoodInstance
  mode: Pipeline
  pipeline:
    # =======================================================================
    # What is true of the whole installation rather than of this
    # environment: today the billing account, in time whatever else every
    # instance would otherwise restate. Merged into the pipeline's context,
    # where the next step reads it.
    #
    # Selected by label rather than named, because the name has to follow
    # the installation code and a Reference takes a literal. Required, so
    # an installation with no config is a composite that says so -- the
    # alternative is a project that comes up unbilled and looks fine.
    # =======================================================================
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          policy:
            resolution: Required
          environmentConfigs:
            - type: Selector
              selector:
                mode: Single
                matchLabels:
                  - type: FromCompositeFieldPath
                    key: installation
                    valueFromFieldPath: spec.code
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # ===================================================================
          # It withholds Delete and is meant to be liened: an instance
          # project is the protected tier under ADR-0022, because down
          # is a stopped environment rather than a deleted one, and
          # because a project id is spent whether or not the project
          # survives.
          #
          # The project is durable, so this instance's own data lives
          # in it -- its database, its disks, the buckets its workloads
          # write. What is fully managed alongside is only what rebuilds
          # from its own declaration: the cluster, the addresses, the
          # certificate. See ADR-0024.
          # ===================================================================
          - name: instance-project
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: Project
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  # No default VPC. The org policy says the same thing,
                  # and the network an instance uses is composed here.
                  autoCreateNetwork: false
                  # Provider-side, and already the default.
                  deletionPolicy: PREVENT
            patches:
              # prj-<code>-<env>-<label>, without the id's suffix: the
              # Kubernetes name is the one another resource spells, and
              # the suffix belongs to the globally-unique id alone.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: metadata.name
              # Adoption only, and skipped when absent, so a first run
              # creates and a rebuild takes over what is already there.
              - fromFieldPath: spec.adopt
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.projectId
              # Derived first, then overridden: a later patch wins when
              # its source is set and is skipped when it is absent, so
              # this is how a field gets a default it cannot state.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.name
              - fromFieldPath: spec.displayName
                toFieldPath: spec.forProvider.name
              # The installation's account, then this instance's if it
              # names one: the same later-patch-wins ordering as the
              # display name above, so a manifest overrides the shared
              # default without either having to know about the other.
              - type: FromEnvironmentFieldPath
                fromFieldPath: billingAccountId
                toFieldPath: spec.forProvider.billingAccount
              - fromFieldPath: spec.billingAccountId
                toFieldPath: spec.forProvider.billingAccount
              # Names the folder the plane composed, by the name the
              # naming rule fixes. A managed-resource reference rather
              # than anything reaching into the plane's composite:
              # Crossplane resolves it and orders the two itself, and
              # neither composite knows the other exists.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.folderIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "fldr-%s"
              # The prefixed id lands in the external-name annotation
              # before it appears anywhere in status.atProvider.
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.projectId
          # ===================================================================
          # What this project may be asked to do. A project is created
          # bare -- nothing is enabled by default -- so each of these
          # stands between the composition and a resource it will
          # compose next, and enabling one needs billing already linked.
          #
          # Five, not the eight the plane enables for itself: sqladmin,
          # dns and certificatemanager arrive with the database and the
          # domain rather than ahead of them.
          #
          # Named with the label as well as the environment. The plane's
          # are svc-<code>-c-<api> because one management project ends
          # the name there, where two nonprod instances would otherwise
          # both claim svc-<code>-n-compute.
          # ===================================================================
          # The network, its subnets and any address.
          - name: instance-service-compute
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: compute.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-compute"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # The cluster and its node pool.
          - name: instance-service-container
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: container.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-container"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # Service accounts composed inside this project.
          - name: instance-service-iam
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: iam.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-iam"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # Project IAM, which every identity here needs a binding in.
          - name: instance-service-resourcemanager
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: cloudresourcemanager.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-resourcemanager"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # Reading and managing the enablement above.
          - name: instance-service-serviceusage
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: serviceusage.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-serviceusage"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # ===================================================================
          # The network this environment runs in. One VPC per instance,
          # in the instance's own project, so two environments share
          # nothing and neither can reach the other by accident.
          #
          # The ranges are identical in every instance, which is
          # deliberate while the VPCs are isolated and would have to
          # change the day two of them peer -- or one peers with the
          # plane, whose subnet is 10.60.0.0/16 and so does not collide
          # with these.
          #
          # Delete is withheld, as it is on the plane's. ADR-0022 lists
          # what an instance may fully manage -- clusters, databases,
          # addresses, certificates -- and a network is not among them:
          # GCP refuses to delete one while a cluster sits in it, so the
          # deletion stalls rather than tidies. An instance going down
          # stops its cluster; retiring one for good is deliberate,
          # like retiring its project.
          #
          # Network and Subnetwork take a project id rather than a ref,
          # so it comes from the manifest, which always carries it.
          # ===================================================================
          - name: instance-vpc
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Network
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  autoCreateSubnetworks: false
                  routingMode: REGIONAL
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
          # The subnet the nodes sit in, with the two secondary ranges
          # GKE wants: pods and services are allocated from them rather
          # than from the primary range, and naming them here is what
          # lets the cluster ask for them by name.
          - name: instance-subnet
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Subnetwork
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  # The ranges are patched from the manifest. Only the
                  # secondary range *names* are literal: the cluster
                  # asks for pods and services by name, so they are
                  # wiring rather than configuration.
                  secondaryIpRange:
                    - rangeName: pods
                    - rangeName: services
                  # Lets a node reach a Google API without a public
                  # address, which is what keeps the pool private.
                  privateIpGoogleAccess: true
            patches:
              # Required, here and on every patch below whose source
              # the XRD defaults rather than the manifest states. A
              # default is absent for a window: Argo applies the XRD
              # and this file in one sync, and the new composition can
              # be selected before the API server serves the
              # regenerated CRD. A skipped patch then composes a
              # resource with a hole in it, which the provider may
              # create and fail to observe -- and no later reconcile
              # recovers that, because the resource exists and is
              # wrong. Failing the composite instead is recoverable by
              # waiting.
              - policy:
                  fromFieldPath: Required
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.regionCode
                  strategy: string
                  string:
                    fmt: "sb-%s-%s-%s-%s"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.subnetCidr
                toFieldPath: spec.forProvider.ipCidrRange
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.podsCidr
                toFieldPath: spec.forProvider.secondaryIpRange[0].ipCidrRange
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.servicesCidr
                toFieldPath: spec.forProvider.secondaryIpRange[1].ipCidrRange
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: spec.forProvider.networkRef.name
          # Where a regional load balancer puts its proxies. Its own
          # subnet because GCP requires one per region reserved for the
          # purpose, and it holds no instances of ours.
          - name: instance-subnet-proxy
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Subnetwork
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  purpose: REGIONAL_MANAGED_PROXY
                  role: ACTIVE
            patches:
              - policy:
                  fromFieldPath: Required
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.regionCode
                  strategy: string
                  string:
                    fmt: "sb-%s-%s-%s-proxy-%s"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.proxyCidr
                toFieldPath: spec.forProvider.ipCidrRange
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: spec.forProvider.networkRef.name
          # ===================================================================
          # The identity this instance's nodes run as. Not the default
          # compute service account, which is shared by everything in
          # the project that never chose one and holds whatever the
          # organisation's policy on automatic grants leaves it holding.
          # The pool asks for cloud-platform scopes, so whatever it
          # holds, every workload on the cluster reaches through the
          # metadata server.
          #
          # Delete is withheld. ADR-0024 says down leaves the project,
          # its data, its DNS zone and its identities standing, so an
          # identity outlives the cluster it runs.
          #
          # The label is in the name where the plane's node identity has
          # only the environment letter: two nonprod instances in one
          # installation would otherwise both claim sa-<code>-n-nodes,
          # and Crossplane holds every instance's resources in one
          # namespace whatever project each lands in.
          # ===================================================================
          - name: instance-nodes-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood instance nodes
                  description: Runs this environment's cluster nodes
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-nodes"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              # The account id is the external name, so it is stated
              # rather than left to default from metadata.name: the node
              # pool below spells the same address, and a generated one
              # would leave it spelling nothing.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-nodes"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
          # One role rather than the four the older guidance lists.
          # container.defaultNodeServiceAccount is narrower than they
          # are -- monitoring.viewer alone grants project-wide read of
          # every alert policy and dashboard, which a node has no use
          # for -- and it carries autoscaling.sites.writeMetrics, which
          # none of them do and horizontal autoscaling needs. Google
          # maintains it, so a change in what a node requires arrives
          # here rather than leaving a hand-written list stale.
          #
          # Nothing grants the platform identity serviceAccountUser on
          # this account, as the plane's composition has to for its own:
          # the platform identity created this project, which makes it
          # owner of it, and attaching a service account to a node pool
          # is a right owner already holds.
          - name: instance-nodes-role-default-node-service-account
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/container.defaultNodeServiceAccount
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-nodes-default-node-service-account"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "serviceAccount:sa-%s-%s-%s-nodes@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.member
          # ===================================================================
          # The cluster this environment runs on, and where its bill
          # starts: everything composed above it costs nothing standing
          # still.
          #
          # Fully managed, Delete included, which is what ADR-0022
          # leaves anything that rebuilds from its own declaration.
          # Retiring an instance destroys the cluster and leaves the
          # project, its data, the network and the identities, which is
          # the line that makes state a word in a file rather than a
          # teardown.
          #
          # No nodeConfig here on purpose. It only ever configures the
          # default node pool, which removeDefaultNodePool deletes
          # immediately, and GKE then recomputes node_config on the
          # cluster. The provider sees a diff on a field that can only
          # change by replacing the cluster and refuses to reconcile,
          # leaving it stuck Creating. The real node configuration is on
          # the pool below.
          # ===================================================================
          - name: instance-cluster
            base:
              apiVersion: container.gcp.m.upbound.io/v1beta1
              kind: Cluster
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  initialNodeCount: 1
                  removeDefaultNodePool: true
                  # The composite is what protects this, through
                  # managementPolicies and the manifest that declares
                  # it. A second lock GCP holds outside Crossplane only
                  # makes a declared teardown fail halfway.
                  deletionProtection: false
                  ipAllocationPolicy:
                    clusterSecondaryRangeName: pods
                    servicesSecondaryRangeName: services
                  addonsConfig:
                    httpLoadBalancing:
                      disabled: false
                  # What the proxy-only subnet is for. Upbound's CRD
                  # nests this at the top level rather than under
                  # networkConfig, and placing it elsewhere is silently
                  # dropped.
                  gatewayApiConfig:
                    channel: CHANNEL_STANDARD
                  # Encryption in transit, for the ten paths inside the
                  # cluster that are not TLS: the backup agents to
                  # s3proxy, the Gateway to console, api and Keycloak,
                  # the services to Kafka and to FoundationDB,
                  # FoundationDB between its own processes, Keycloak and
                  # the realm exporter to the Cloud SQL proxy, and
                  # everything to Jaeger. The control asks whether data
                  # in transit is encrypted rather than whether it is
                  # TLS, so this answers all ten at once.
                  #
                  # Both fields or neither: the encryption is a
                  # Dataplane V2 feature and inert on LEGACY_DATAPATH,
                  # which is what GKE defaults to.
                  #
                  # Neither can be applied to a live cluster. The
                  # dataplane is fixed at creation, so the provider
                  # refuses the diff rather than performing it and the
                  # refusal lands in LastAsyncOperation -- Synced alone
                  # does not say. The cluster takes this when it is next
                  # rebuilt; see docs/recipes/infra/cluster-rebuild.md.
                  #
                  # It forecloses enableFqdnNetworkPolicy, which cannot
                  # coexist with inter-node encryption, so egress
                  # control has to be a Cloud NAT and CIDRs rather than
                  # names. And it does not cover two pods on one node,
                  # because that traffic never reaches a network.
                  datapathProvider: ADVANCED_DATAPATH
                  inTransitEncryptionConfig: IN_TRANSIT_ENCRYPTION_INTER_NODE_TRANSPARENT
                # A kubeconfig for this cluster, written by the provider
                # on every reconcile. It carries the endpoint and the CA
                # and no credential: the token comes from the identity
                # block on whichever provider config reads it. This is
                # what provider-helm will want when the workloads
                # arrive.
                writeConnectionSecretToRef:
                  name: instance-kubeconfig
            patches:
              # No kind prefix: a cluster is never listed beside other
              # kinds, and GKE prefixes every name it derives from one
              # with gke- already.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-kubeconfig"
                toFieldPath: spec.writeConnectionSecretToRef.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: spec.forProvider.networkRef.name
              - policy:
                  fromFieldPath: Required
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.regionCode
                  strategy: string
                  string:
                    fmt: "sb-%s-%s-%s-%s"
                toFieldPath: spec.forProvider.subnetworkRef.name
              - &cluster-project
                fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              # The one this rule was learned from. location is required
              # on Cluster and optional on NodePool, so the same absent
              # zone failed the first loudly and left the second holding
              # a pool it could no longer observe.
              - &cluster-zone
                policy:
                  fromFieldPath: Required
                fromFieldPath: spec.zone
                toFieldPath: spec.forProvider.location
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.cluster.releaseChannel
                toFieldPath: spec.forProvider.releaseChannel.channel
              # Workload Identity, so a pod assumes a service account
              # rather than holding a key. Nothing binds to the pool
              # yet; the cluster is where the choice is made available.
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.workloadIdentityConfig.workloadPool
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s.svc.id.goog"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.endpoint
                toFieldPath: status.clusterEndpoint
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.masterAuth.clusterCaCertificate
                toFieldPath: status.clusterCa
          # ===================================================================
          # Two more APIs, arriving with the database rather than ahead
          # of it. servicenetworking is what private services access is
          # built on, and is enabled for the peering rather than for
          # Cloud SQL itself.
          # ===================================================================
          - name: instance-service-sqladmin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: sqladmin.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-sqladmin"
                toFieldPath: metadata.name
              - &api-project
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          - name: instance-service-servicenetworking
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: servicenetworking.googleapis.com
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-servicenetworking"
                toFieldPath: metadata.name
              - *api-project
          # Secret Manager, for the values external-secrets reads into
          # the cluster. Enabled here rather than only on the plane:
          # GCP checks the project a resource lives in as well as the
          # caller's, and these secrets are the instance's own.
          - name: instance-service-secretmanager
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: secretmanager.googleapis.com
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-secretmanager"
                toFieldPath: metadata.name
              - *api-project
          # The identity external-secrets runs as on this cluster.
          # secretAccessor rather than admin: reading a version is all
          # it does, and writing one stays a person's act.
          - name: instance-secrets-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood secrets reader
                  description: Reads Secret Manager for external-secrets
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-secrets"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-secrets"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              # A literal, not the projectRef anchor: ServiceAccount
              # declares no projectRef, and server-side apply rejects an
              # undeclared field rather than dropping it.
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
          - name: instance-secrets-accessor
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/secretmanager.secretAccessor
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-secrets-accessor"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "serviceAccount:sa-%s-%s-%s-secrets@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.member
              - *api-project
          # Both halves of Workload Identity. The chart installs into
          # its own namespace and names its service account after
          # itself, so the member string is pinned to that pair rather
          # than to whatever happens to be running.
          - name: instance-secrets-identity-wi
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.workloadIdentityUser
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-secrets-wi"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-secrets"
                toFieldPath: spec.forProvider.serviceAccountIdRef.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "serviceAccount:%s.svc.id.goog[external-secrets/external-secrets]"
          # The container, not the value. A version is written by a
          # person from a secret Google issued once, so what exists is
          # declared and what it holds never touches git. No Delete:
          # losing this is losing the environment's way of proving who
          # it is to Google.
          - name: instance-google-oauth-secret
            base:
              apiVersion: secretmanager.gcp.m.upbound.io/v1beta1
              kind: Secret
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  # A map, not a list of one. And no secretId: the CRD
                  # declares none, so what Secret Manager knows this by
                  # is the external name below -- which the
                  # ExternalSecret reading it has to spell the same.
                  replication:
                    auto: {}
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sec-%s-%s-%s-google-oauth"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sec-%s-%s-%s-google-oauth"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
          # The container for Keycloak's bootstrap admin, and the same
          # shape as the OAuth one above for the same reason: declared
          # here, written by a person, never in git.
          #
          # It exists because the operator generating this credential
          # ties its lifetime to the Keycloak resource, where the
          # database outlives it. Keycloak honours a bootstrap admin
          # only while the master realm does not exist, so a rebuilt
          # cluster regenerates a password the database will never
          # accept -- the realm import cannot obtain a token, bootstrap
          # waits on the import, and every service waits on bootstrap.
          # Sourcing it from here instead means the value the database
          # was created with is the value that comes back.
          #
          # No Delete: losing it is losing the ability to administer a
          # realm that is otherwise serving perfectly well.
          - name: instance-keycloak-admin-secret
            base:
              apiVersion: secretmanager.gcp.m.upbound.io/v1beta1
              kind: Secret
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  replication:
                    auto: {}
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sec-%s-%s-%s-keycloak-admin"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sec-%s-%s-%s-keycloak-admin"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
          # Certificate Manager, for the certificates the instance's
          # ingress terminates on. Enabled in this project rather than
          # only in the plane's: GCP checks the project the resource
          # lives in as well as the caller's, and a certificate is the
          # instance's own even though the records validating it are
          # written into a zone that is not.
          - name: instance-service-certificatemanager
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: certificatemanager.googleapis.com
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-certificatemanager"
                toFieldPath: metadata.name
              - *api-project
          # ===================================================================
          # Private services access: the range this VPC lends to Google,
          # and the peering that consumes it. A Cloud SQL instance with
          # a private address lives in Google's own project and reaches
          # this VPC across that peering, which is why a database needs
          # two network resources before it needs a database.
          #
          # Global rather than regional, and prefixLength rather than a
          # stated range: Google allocates from the VPC's space, and a
          # literal here would have to avoid every subnet this instance
          # will ever have.
          #
          # Delete is withheld from both. Tearing down a peering strands
          # every private-IP service behind it, and the range cannot be
          # reclaimed while the peering holds it.
          # ===================================================================
          - name: instance-psa-range
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: GlobalAddress
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  purpose: VPC_PEERING
                  addressType: INTERNAL
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "addr-%s-%s-%s-psa"
                toFieldPath: metadata.name
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.psaPrefixLength
                toFieldPath: spec.forProvider.prefixLength
              - &vpc-ref
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: spec.forProvider.networkRef.name
              - &instance-project
                fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
          - name: instance-psa-connection
            base:
              apiVersion: servicenetworking.gcp.m.upbound.io/v1beta1
              kind: Connection
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: servicenetworking.googleapis.com
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "psa-%s-%s-%s"
                toFieldPath: metadata.name
              - *vpc-ref
              # By value rather than by reference: the range's name is
              # this composition's own, so it is as deterministic as a
              # ref would be, and a list element takes an index either
              # way.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "addr-%s-%s-%s-psa"
                toFieldPath: spec.forProvider.reservedPeeringRanges[0]
          # ===================================================================
          # The database. Private address only: ipv4Enabled false and a
          # privateNetworkRef into this instance's VPC, reachable across
          # the peering above and from nowhere on the internet. That is
          # also what makes sql.restrictPublicIp enforceable, which the
          # organisation's policy set leaves off pending an instance
          # that could satisfy it.
          #
          # Delete is withheld and deletionProtection is on, which is
          # the one place this composition deliberately holds two locks.
          # A cluster is protected by its declaration alone, because
          # rebuilding one loses nothing; a database is the resource
          # where a teardown failing halfway is the better outcome. See
          # ADR-0022 on the lien mattering more than the policy.
          #
          # state governs activationPolicy, which is the second thing it
          # has ever governed. NEVER stops the instance and keeps its
          # storage: down is a stopped database rather than a dropped
          # one, and nothing is restored on the way back up.
          # ===================================================================
          - name: instance-sql
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: DatabaseInstance
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  deletionProtection: true
                  settings:
                    diskAutoresize: true
                    deletionProtectionEnabled: true
                    ipConfiguration:
                      ipv4Enabled: false
                      # Cloud SQL defaults to accepting unencrypted
                      # connections, and private IP does not change
                      # that: it settles who can reach the instance,
                      # not whether what they send is readable. Stated
                      # rather than defaulted, because the default is
                      # the permissive one.
                      #
                      # ENCRYPTED_ONLY rather than
                      # TRUSTED_CLIENT_CERTIFICATE_REQUIRED: the client
                      # is authenticated by IAM already, and requiring
                      # a client certificate as well would put a second
                      # credential in a design that currently has none.
                      sslMode: ENCRYPTED_ONLY
                    # No password exists on this instance. Every user is
                    # an IAM principal, authenticated by a token from the
                    # metadata server, which is what this flag turns on.
                    databaseFlags:
                      - name: cloudsql.iam_authentication
                        value: "on"
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sql-%s-%s-%s"
                toFieldPath: metadata.name
              - *instance-project
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.keycloak.database.tier
                toFieldPath: spec.forProvider.settings.tier
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.keycloak.database.version
                toFieldPath: spec.forProvider.databaseVersion
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.keycloak.database.edition
                toFieldPath: spec.forProvider.settings.edition
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.keycloak.database.diskSize
                toFieldPath: spec.forProvider.settings.diskSize
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.keycloak.database.diskType
                toFieldPath: spec.forProvider.settings.diskType
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.keycloak.database.availabilityType
                toFieldPath: spec.forProvider.settings.availabilityType
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.keycloak.database.backupEnabled
                toFieldPath: spec.forProvider.settings.backupConfiguration.enabled
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.keycloak.database.pointInTimeRecovery
                toFieldPath: spec.forProvider.settings.backupConfiguration.pointInTimeRecoveryEnabled
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.state
                toFieldPath: spec.forProvider.settings.activationPolicy
                transforms:
                  - type: map
                    map:
                      up: ALWAYS
                      down: NEVER
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: spec.forProvider.settings.ipConfiguration.privateNetworkRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.connectionName
                toFieldPath: status.databaseConnectionName
          # Keycloak's own database. Named for the instance as well as
          # for what it holds: a database name is scoped to its Cloud
          # SQL instance in GCP and to a namespace in Kubernetes, the
          # same split a node pool has, and the longer name wins in both
          # rather than the annotation holding a second one.
          - name: instance-sql-database
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: Database
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sql-%s-%s-%s-keycloak"
                toFieldPath: metadata.name
              - *instance-project
              - &sql-instance-ref
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sql-%s-%s-%s"
                toFieldPath: spec.forProvider.instanceRef.name
          # ===================================================================
          # The identity that reaches the database, and the database
          # user that is that identity. No password is composed here
          # because none exists: with cloudsql.iam_authentication on and
          # a CLOUD_IAM_SERVICE_ACCOUNT user, the client presents a
          # token from the metadata server and Cloud SQL checks IAM. The
          # provider says the same thing -- passwordSecretRef is
          # required for Postgres "unless type is set to ...
          # CLOUD_IAM_SERVICE_ACCOUNT".
          #
          # That is why an instance still composes no secret store. What
          # would have needed one is a database password, and there is
          # not one to keep.
          # ===================================================================
          - name: instance-sql-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood database client
                  description: Reaches this environment's database as itself
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-sql"
                toFieldPath: metadata.name
              - *instance-project
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-sql"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
          # The one place a composed name has to diverge, and the reason
          # ADR-0023 allows the annotation at all: Postgres wants an IAM
          # user named for the service account's address with the
          # .gserviceaccount.com suffix removed, which carries an @ and
          # so is not a name Kubernetes can express. User has no name
          # field either -- the external name is the user name.
          - name: instance-sql-user
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: User
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  type: CLOUD_IAM_SERVICE_ACCOUNT
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sql-%s-%s-%s-user"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-sql@%s.iam"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - *instance-project
              - *sql-instance-ref
          # cloudsql.client authorises the connection, instanceUser
          # authorises logging in as an IAM principal once connected.
          # Both are needed and neither implies the other.
          - name: instance-sql-role-client
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/cloudsql.client
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-sql-client"
                toFieldPath: metadata.name
              - *instance-project
              - &sql-member
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "serviceAccount:sa-%s-%s-%s-sql@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.member
          - name: instance-sql-role-instance-user
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/cloudsql.instanceUser
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-sql-instance-user"
                toFieldPath: metadata.name
              - *instance-project
              - *sql-member
          # The other half of Workload Identity. The GCP binding has to
          # name a namespace and a service account the workload really
          # creates, and both halves have to spell the same pair or
          # neither reports anything wrong -- so the pair comes from the
          # manifest, beside the Application that installs the workload,
          # rather than from a copy kept here.
          - name: instance-sql-workload-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.workloadIdentityUser
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-sql-wi"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-sql"
                toFieldPath: spec.forProvider.serviceAccountIdRef.name
              # serviceAccount:<project>.svc.id.goog[<namespace>/<ksa>]
              - type: CombineFromComposite
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: spec.projectId
                    - fromFieldPath: spec.keycloak.database.client.namespace
                    - fromFieldPath: spec.keycloak.database.client.serviceAccount
                  strategy: string
                  string:
                    fmt: "serviceAccount:%s.svc.id.goog[%s/%s]"
                toFieldPath: spec.forProvider.member
          # ===================================================================
          # The identity that grants the workload its rights inside the
          # database, which is a separate system from the one that lets it
          # in. Cloud SQL authenticates an IAM principal; PostgreSQL then
          # authorises it, and an IAM user is created holding nothing --
          # since PostgreSQL 15 only a database's owner may create in
          # public, so the workload connects and cannot make a table.
          #
          # Neither Database nor User can express the fix: one has no
          # owner field, the other no databaseRoles. So a Job calls the
          # Admin API, and this is what it runs as. Its own identity
          # rather than the workload's, because the workload has no
          # business editing the instance's users -- and because granting
          # scoped rights later means connecting as a superuser that is
          # not the workload, which this account becomes without anything
          # here changing.
          - name: instance-sql-admin-role
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMCustomRole
              metadata:
                namespace: crossplane-system
                annotations:
                  # The role id, which is what a custom role is addressed
                  # by and which `forProvider` has no field for.
                  # Underscores because a custom role id takes no hyphens,
                  # so it cannot be the Kubernetes name.
                  crossplane.io/external-name: rl_sql_user_admin
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  # A custom role rather than cloudsql.admin, which also
                  # grants deleting the instance and every database on it.
                  title: Cloud SQL user administrator
                  description: Grants database roles to this instance's users
                  # assign-roles writes through the instance, not just
                  # the user: cloudsql.users.update alone reads as
                  # authorised and is refused, and every predefined role
                  # that can do it carries instances.update too. That is
                  # the cost of narrowing -- it permits changing the
                  # instance's settings, though not deleting it or any
                  # database on it, which cloudsql.admin would.
                  permissions:
                    - cloudsql.users.update
                    - cloudsql.users.get
                    - cloudsql.users.list
                    - cloudsql.instances.get
                    - cloudsql.instances.update
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-rl-sql-user-admin"
                toFieldPath: metadata.name
              - *instance-project
          - name: instance-sql-admin-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood database grant
                  description: Grants this instance's database users their roles
            patches:
              - &sql-admin-name
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-sqladmin"
                toFieldPath: metadata.name
              - *instance-project
              - <<: *sql-admin-name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
          - name: instance-sql-admin-role-binding
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-sql-user-admin"
                toFieldPath: metadata.name
              - *instance-project
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "projects/%s/roles/rl_sql_user_admin"
                toFieldPath: spec.forProvider.role
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "serviceAccount:sa-%s-%s-%s-sqladmin@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.member
          - name: instance-sql-admin-workload-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.workloadIdentityUser
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-sqladmin-wi"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-sqladmin"
                toFieldPath: spec.forProvider.serviceAccountIdRef.name
              - type: CombineFromComposite
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: spec.projectId
                    - fromFieldPath: spec.keycloak.database.client.namespace
                    - fromFieldPath: spec.keycloak.database.client.grantServiceAccount
                  strategy: string
                  string:
                    fmt: "serviceAccount:%s.svc.id.goog[%s/%s]"
                toFieldPath: spec.forProvider.member
    # =======================================================================
    # The node pool, composed here rather than by patch-and-transform for
    # one reason: its count is a manifest value and a state at once. up is
    # spec.cluster.nodeCount and down is zero, and no patch can combine
    # the two -- a map transform must name every key it may see, so a
    # state patch always overwrites a count patch or is overwritten by it.
    #
    # Every field is checked before it is used. A Go template renders a
    # missing map key as the string "<no value>" rather than failing, so
    # reading one directly is not the loud failure policy.fromFieldPath
    # Required buys in patch-and-transform -- it is a silent one that
    # composes a resource carrying that string. Two of these fields are
    # numeric and Kubernetes rejects the type, which is what surfaced it;
    # a string field would have reached GCP.
    #
    # The absent case is real rather than theoretical: the composition
    # can be selected before the API server serves a regenerated CRD, and
    # the observed composite then has no spec.cluster at all.
    #
    # The composition-resource-name is what identifies this to Crossplane,
    # so it stays instance-nodes and the existing pool is matched rather
    # than rebuilt.
    # =======================================================================
          # ===================================================================
          # What Argo may do here. Granted by the instance rather than
          # by the plane, so Argo's reach grows one environment at a
          # time and every grant sits where that environment is
          # declared.
          #
          # container.admin rather than container.developer, and the
          # reason is not ambition. container.developer reaches
          # ordinary Kubernetes objects -- Deployments, Services,
          # Secrets, CRDs all applied under it -- and cannot create
          # Roles, RoleBindings, ClusterRoles or ClusterRoleBindings.
          # Any chart shipping an operator ships RBAC, so a GitOps
          # deployer that cannot write RBAC cannot deploy one at all.
          # The FoundationDB operator is what proved it: every RBAC
          # object failed, its service account was left with no
          # permissions, and it crash-looped while everything around it
          # applied cleanly.
          #
          # The cost is honest: this also lets Argo create and delete
          # clusters in this project. The narrower shape is
          # container.clusterViewer here plus a Kubernetes
          # ClusterRoleBinding on the cluster itself, which moves the
          # authority into RBAC where it is reviewable in git -- and
          # needs something able to write RBAC on an instance cluster
          # before it can be built, which is the machinery this defers.
          # Worth doing before a production instance; not worth
          # blocking the first deployment on.
          #
          # The account is spelled rather than referenced. It belongs to
          # the plane's composite, and neither composite reaches into
          # the other -- the address is derivable from the code and the
          # management project, which the installation's shared config
          # carries.
          # ===================================================================
          - name: instance-argo-role-container-developer
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/container.admin
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-argo-container-admin"
                toFieldPath: metadata.name
              - *instance-project
              # From the installation's shared config rather than
              # combined here: the address needs the code, which is on
              # this composite, and the management project, which is
              # not -- and a combine cannot mix the two sources. So the
              # whole address is one shared fact, which is what that
              # file is for.
              #
              # Not Required. The config lives in the other repository,
              # so a merge here before the key exists there would fail
              # every instance rather than this one binding.
              - type: FromEnvironmentFieldPath
                fromFieldPath: argoServiceAccount
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "serviceAccount:%s"
          # ===================================================================
          # How Argo reaches this cluster. Argo registers an external
          # cluster as a Secret in its own namespace, and everything in
          # it is either public or a name: the API endpoint, the
          # cluster's certificate authority, and a command.
          #
          # No credential, which is the point. execProviderConfig makes
          # Argo run argocd-k8s-auth at call time, minting a token from
          # the identity its own pod holds through Workload Identity. So
          # nothing here is secret, nothing is stored, and nothing has
          # to be rotated.
          #
          # Composed rather than committed beside the manifest because
          # the endpoint and the certificate belong to the cluster
          # rather than to a manifest: copied, they go stale the day it
          # is rebuilt, and Argo would then point at nothing quietly.
          #
          # Both arrive through the composite's status, because a patch
          # reads from the composite and these are facts the cluster
          # reports. They are absent until it exists, so these patches
          # are not Required -- absence here means "no cluster yet"
          # rather than a mistake, and the next reconcile fills them.
          # ===================================================================
          - name: instance-argo-cluster
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              metadata:
                namespace: crossplane-system
              spec:
                # Delete included: a registration for a cluster that is
                # gone should go with it, and it carries nothing that
                # cannot be rebuilt from the cluster itself.
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      namespace: argocd
                      labels:
                        argocd.argoproj.io/secret-type: cluster
                    # data rather than stringData, and the difference
                    # is not cosmetic. stringData is write-only: the
                    # API server folds it into data and drops it, so
                    # the provider has nothing to compare and cannot
                    # see a value it failed to write. The first apply
                    # here happened while the CA was still absent, the
                    # config key was never written, and the Object
                    # reported Ready for half an hour with a
                    # registration Argo could not verify a certificate
                    # against.
                    data: {}
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-argo-cluster"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.name
              # The name Argo shows, and the name an Application targets
              # by. The cluster's own, so an Application names what the
              # console and the Cloud Console both call it.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s"
                toFieldPath: spec.forProvider.manifest.data.name
                transforms:
                  - type: string
                    string:
                      type: Convert
                      convert: ToBase64
              - fromFieldPath: status.clusterEndpoint
                toFieldPath: spec.forProvider.manifest.data.server
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "https://%s"
                  - type: string
                    string:
                      type: Convert
                      convert: ToBase64
              # One string, because config is JSON inside a Secret
              # value. caData is the cluster's, and the exec block is
              # what replaces a stored token.
              - fromFieldPath: status.clusterCa
                toFieldPath: spec.forProvider.manifest.data.config
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: '{"execProviderConfig":{"apiVersion":"client.authentication.k8s.io/v1beta1","command":"argocd-k8s-auth","args":["gcp"]},"tlsClientConfig":{"insecure":false,"caData":"%s"}}'
                  - type: string
                    string:
                      type: Convert
                      convert: ToBase64
          # ===================================================================
          # Reading a pod's log in this project, and nothing else. The
          # plane composes the same role for its own project and binds
          # its platformViewer to it; an instance's clusters are in a
          # different project, so until now reading a log from one meant
          # joining clusterAdmin -- a break-glass capability spent on
          # routine debugging, which is how break-glass stops meaning
          # anything.
          #
          # A project custom role rather than a predefined one because
          # none fits, and rather than an organisation one because that
          # needs rights an installation in somebody else's
          # organisation will not have. It can only be granted on its
          # own project, which is why the instance composes its own
          # rather than reusing the plane's.
          # ===================================================================
          - name: instance-pod-log-reader-role
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMCustomRole
              metadata:
                namespace: crossplane-system
                annotations:
                  crossplane.io/external-name: rl_pod_log_reader
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  title: Pod log reader
                  description: Reads container logs through the Kubernetes API, and changes nothing
                  permissions:
                    - container.pods.getLogs
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-rl-pod-log-reader"
                toFieldPath: metadata.name
              - *instance-project
    - step: nodes
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $cluster := $xr.spec.cluster | default dict }}
            {{- range $f := list "machineType" "nodeCount" "diskSize" "diskType" }}
            {{- if not (hasKey $cluster $f) }}
            {{- fail (printf "spec.cluster.%s is absent" $f) }}
            {{- end }}
            {{- end }}
            {{- range $f := list "code" "env" "label" "state" "zone" "projectId" }}
            {{- if not (hasKey $xr.spec $f) }}
            {{- fail (printf "spec.%s is absent" $f) }}
            {{- end }}
            {{- end }}
            {{- $name := printf "%s-%s-%s" $xr.spec.code $xr.spec.env $xr.spec.label }}
            {{- $count := 0 }}
            {{- if eq $xr.spec.state "up" }}
            {{- $count = $cluster.nodeCount }}
            {{- end }}
            apiVersion: container.gcp.m.upbound.io/v1beta1
            kind: NodePool
            metadata:
              name: np-{{ $name }}-primary
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-nodes
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                cluster: {{ $name }}
                location: {{ $xr.spec.zone }}
                # Owned here so late-initialisation cannot. Left unset,
                # upjet observes the live pool and writes podRange and
                # podIpv4CidrBlock back into the spec -- harmless while
                # the pool exists, since it is only describing what is
                # there. It stops being harmless the moment the pool has
                # to be created again: the CIDR is then sent as a create
                # parameter, and GCP refuses it with "Can only set
                # pod_ipv4_cidr_block if create_pod_range is true",
                # leaving a cluster with no nodes.
                #
                # podRange alone is what is wanted: it names the
                # secondary range the cluster's ipAllocationPolicy
                # already points at, rather than asking for a new one.
                networkConfig:
                  podRange: pods
                project: {{ $xr.spec.projectId }}
                nodeCount: {{ $count | int }}
                nodeConfig:
                  machineType: {{ $cluster.machineType }}
                  diskSizeGb: {{ $cluster.diskSize | int }}
                  diskType: {{ $cluster.diskType }}
                  serviceAccount: sa-{{ $name }}-nodes@{{ $xr.spec.projectId }}.iam.gserviceaccount.com
                  oauthScopes:
                    - https://www.googleapis.com/auth/cloud-platform
                  workloadMetadataConfig:
                    mode: GKE_METADATA
    # =======================================================================
    # Where the instance is reached: an address, the names that resolve
    # to it, and the certificates that terminate them. Templated because
    # the whole block is absent until an instance is published, and
    # because two of the values are assigned by the provider and only
    # exist after a create -- the address, and the record a
    # DNSAuthorization wants answered.
    #
    # The records go into the plane's zone rather than one of this
    # instance's, so they name a project that is not this instance's.
    # They leave with the instance all the same.
    # =======================================================================
    - step: ingress
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $ingress := dig "ingress" dict $xr.spec }}
            {{- $domain := dig "domain" "" $ingress }}
            {{- if $domain }}
            {{- $zone := dig "zone" dict $ingress }}
            {{- if not (dig "name" "" $zone) }}
            {{- fail "spec.ingress.zone.name is absent" }}
            {{- end }}
            {{- if not (dig "project" "" $zone) }}
            {{- fail "spec.ingress.zone.project is absent" }}
            {{- end }}
            {{- $name := printf "%s-%s-%s" $xr.spec.code $xr.spec.env $xr.spec.label }}
            {{- $observed := dig "resources" dict .observed }}
            ---
            # Kept through `down`. An address is the one thing here whose
            # identity is published: releasing it means every record
            # pointing at it is wrong, and the replacement is a different
            # number rather than the same one returned.
            apiVersion: compute.gcp.m.upbound.io/v1beta1
            kind: Address
            metadata:
              name: addr-{{ $name }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-address
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $xr.spec.projectId }}
                region: {{ $xr.spec.region }}
                addressType: EXTERNAL
            ---
            # One authorization covers the domain and its wildcard, so
            # both certificates below share this one rather than each
            # validating separately.
            apiVersion: certificatemanager.gcp.m.upbound.io/v1beta1
            kind: DNSAuthorization
            metadata:
              name: da-{{ $name }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-dns-auth
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $xr.spec.projectId }}
                # Same region as the certificates below. A regional
                # certificate takes a regional authorization, and the
                # gateway class is regional.
                location: {{ $xr.spec.region }}
                domain: {{ $domain | quote }}
            {{- /* Two certificates rather than one with two names:
                   managed.domains is ForceNew, so a name added to a
                   live certificate replaces it. See
                   docs/recipes/infra/crossplane-providers.md. */}}
            {{- range $c := list (dict "slug" "" "domain" $domain) (dict "slug" "-wildcard" "domain" (printf "*.%s" $domain)) }}
            ---
            apiVersion: certificatemanager.gcp.m.upbound.io/v1beta1
            kind: Certificate
            metadata:
              name: crt-{{ $name }}{{ $c.slug }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-cert{{ $c.slug }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $xr.spec.projectId }}
                location: {{ $xr.spec.region }}
                managed:
                  domains:
                    - {{ $c.domain | quote }}
                  dnsAuthorizationsRefs:
                    - name: da-{{ $name }}
            {{- end }}
            {{- /* The validation record exists only once the
                   authorization does, so it is read from what is
                   observed rather than patched from spec. Absent on the
                   first pass, present on the next. */}}
            {{- $auth := dig "instance-dns-auth" "resource" "status" "atProvider" "dnsResourceRecord" list $observed }}
            {{- if $auth }}
            {{- $record := index $auth 0 }}
            ---
            apiVersion: dns.gcp.m.upbound.io/v1beta1
            kind: RecordSet
            metadata:
              name: rs-{{ $name }}-auth-cname
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-dns-auth-record
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $zone.project | quote }}
                managedZoneRef:
                  name: {{ $zone.name | quote }}
                # Both arrive fully qualified, so the trailing dot is
                # trimmed before it is added -- appending blindly gives
                # a name ending in two, which Cloud DNS takes and
                # nothing resolves.
                name: {{ printf "%s." (trimSuffix "." $record.name) | quote }}
                type: CNAME
                ttl: 300
                rrdatas:
                  - {{ printf "%s." (trimSuffix "." $record.data) | quote }}
            {{- end }}
            {{- /* Likewise the address: a record pointing at nothing is
                   worse than no record, so these wait for it. */}}
            {{- $ip := dig "instance-address" "resource" "status" "atProvider" "address" "" $observed }}
            {{- if $ip }}
            {{- /* Subdomains only. Nothing serves the bare domain over
                   HTTPS -- it appears in the chart's routes solely as
                   the :80 redirect -- and pointing the console at it as
                   well would give the SPA a second origin, which a
                   realm imported once and never overwritten makes
                   permanent. */}}
            {{- range $host := dig "subdomains" list $ingress }}
            {{- $fqdn := printf "%s.%s" $host $domain }}
            {{- $slug := $host }}
            ---
            apiVersion: dns.gcp.m.upbound.io/v1beta1
            kind: RecordSet
            metadata:
              name: rs-{{ $name }}-{{ $slug }}-a
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-dns-{{ $slug }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - Delete
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $zone.project | quote }}
                managedZoneRef:
                  name: {{ $zone.name | quote }}
                name: {{ printf "%s." $fqdn | quote }}
                type: A
                ttl: 300
                rrdatas:
                  - {{ $ip | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
    # =======================================================================
    # One binding per principal, which patch-and-transform cannot
    # express: it composes a fixed set of resources and has no way to
    # say "none" for an empty list. So this mirrors the plane's own
    # access step rather than inventing a second shape.
    #
    # Nothing is emitted where no viewers are named, which is an
    # installation that has not decided yet rather than one that has
    # decided nobody.
    # =======================================================================
    # =======================================================================
    # This instance's bucket, in the installation's recovery project.
    # Templated rather than patched because the block is absent until
    # an instance keeps something, and because the name is built from
    # part of another field.
    #
    # One bucket per instance rather than one per installation, so an
    # instance's identity is granted on its own backups and reaches no
    # other's -- which is the whole reason the project sits outside the
    # instance in the first place, and would be given back by a bucket
    # everything shares.
    # =======================================================================
    - step: recovery
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := printf "%s-%s-%s" $xr.spec.code $xr.spec.env $xr.spec.label }}
            {{- $recovery := dig "recovery" dict $xr.spec }}
            {{- $env := index .context "apiextensions.crossplane.io/environment" | default dict }}
            {{- /* The installation's EnvironmentConfig, then this
                   instance's field if it names one -- the same
                   environment-then-override ordering billingAccountId
                   uses above, so the project is stated once for the
                   installation and every instance reads the same
                   answer. */}}
            {{- $project := dig "projectId" (dig "recoveryProjectId" "" $env) $recovery }}
            {{- if $project }}
            {{- /* The suffix is the recovery project's rather than this
                   instance's. A bucket named for a project that may be
                   rebuilt changes name when it is, which is a backup
                   nobody can find under the name they recorded. */}}
            {{- $suffix := last (splitList "-" $project) }}
            {{- $location := dig "location" $xr.spec.region $recovery }}
            {{- $bucket := printf "bkt-%s-backups-%s" $name $suffix }}
            {{- /* No suffix: a Secret Manager entry is scoped to its
                   project, and its name is reusable after deletion. */}}
            {{- $key := printf "sec-%s-fdb-backup-key" $name }}
            ---
            apiVersion: storage.gcp.m.upbound.io/v1beta1
            kind: Bucket
            metadata:
              name: {{ $bucket }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-backups-bucket
                crossplane.io/external-name: {{ $bucket }}
            spec:
              # Without Delete. Deleting the managed resource orphans
              # the bucket rather than emptying it, which is the outcome
              # to want from an edit nobody meant to make -- and this is
              # the one thing an instance owns that its own teardown
              # must not take with it.
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project | quote }}
                location: {{ $location | upper | quote }}
                storageClass: STANDARD
                uniformBucketLevelAccess: true
                publicAccessPrevention: enforced
                # A delete stays recoverable for a week without the
                # object versioning that would leave `fdbbackup expire`
                # trimming live objects while their noncurrent copies
                # remain.
                softDeletePolicy:
                  retentionDurationSeconds: 604800
                # No retentionPolicy. It is bucket-wide and, once
                # locked, permanent -- and a continuous backup's old
                # objects are pruned by `fdbbackup expire`, which a
                # retention period longer than the expiry horizon would
                # block. Evidence that must not be deletable wants its
                # own bucket, and its own project.
                lifecycleRule:
                  # Realm exports only. FDB's prefixes are deliberately
                  # not age-managed: a continuous backup's older objects
                  # are not stale copies, they are the log a restore
                  # reads through, and `fdbbackup expire` prunes them by
                  # version. Everything is written Standard and demoted
                  # by age rather than written cold, so a restore drill
                  # in the first week is not a Coldline retrieval.
                  - action:
                      type: SetStorageClass
                      storageClass: NEARLINE
                    condition:
                      age: 7
                      matchesPrefix:
                        - keycloak/realms/
                  - action:
                      type: SetStorageClass
                      storageClass: COLDLINE
                    condition:
                      age: 30
                      matchesPrefix:
                        - keycloak/realms/
                  - action:
                      type: Delete
                    condition:
                      age: 365
                      matchesPrefix:
                        - keycloak/realms/
            ---
            # The key those backups are encrypted under. The container,
            # not the value: a person writes the version once from
            # secretsAdmin, and what it holds never touches git.
            #
            # Beside the bucket rather than in the instance's own
            # project, because it has to survive whatever loses the
            # instance -- a key in the project whose data it protects
            # is not a second copy of anything.
            #
            # No Delete, and this is the case the policy exists for.
            # The Google client secret withholds it and is still
            # rotatable; this one is not rotatable at all. An existing
            # backup is readable only under the key it was written
            # with, so losing the entry loses every backup taken before
            # it, silently, and only at a restore.
            #
            # One per instance rather than one per installation, for
            # the reason the bucket is: a key that opens every
            # instance's backups makes the separation above decorative.
            apiVersion: secretmanager.gcp.m.upbound.io/v1beta1
            kind: Secret
            metadata:
              name: {{ $key }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-fdb-backup-key
                # What Secret Manager knows this by. The CRD declares no
                # secretId, so there is no second spelling to disagree,
                # and an ExternalSecret reading it spells this one.
                crossplane.io/external-name: {{ $key }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project | quote }}
                # A map, not a list of one.
                replication:
                  auto: {}
            ---
            # On this entry alone, rather than the project-wide
            # accessor the instance's own secrets take. The recovery
            # project holds every instance's key, and a project-scoped
            # grant would let each instance read the others' -- which
            # is the separation the project exists to draw.
            apiVersion: secretmanager.gcp.m.upbound.io/v1beta1
            kind: SecretIAMMember
            metadata:
              name: {{ printf "%s-accessor" $key }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-fdb-backup-key-accessor
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project | quote }}
                secretId: {{ $key | quote }}
                role: roles/secretmanager.secretAccessor
                member: {{ printf "serviceAccount:sa-%s-secrets@%s.iam.gserviceaccount.com" $name $xr.spec.projectId | quote }}
            ---
            # The identity the S3-to-GCS proxy runs as. It is what
            # keeps an exportable Google credential out of the backup
            # path entirely: the agents present a locally generated
            # pair to the proxy, and the proxy authenticates to GCS as
            # this account through Workload Identity.
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ServiceAccount
            metadata:
              name: {{ printf "sa-%s-backup" $name }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-backup-identity
                crossplane.io/external-name: {{ printf "sa-%s-backup" $name }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $xr.spec.projectId | quote }}
                displayName: {{ printf "sa-%s-backup" $name | quote }}
            ---
            # On this bucket alone, not on the recovery project: the
            # project holds every instance's backups, and objectAdmin
            # there would let one instance read and delete another's.
            apiVersion: storage.gcp.m.upbound.io/v1beta1
            kind: BucketIAMMember
            metadata:
              name: {{ printf "%s-backup-writer" $bucket }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-backups-bucket-writer
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                bucket: {{ $bucket | quote }}
                # objectAdmin rather than objectCreator: `fdbbackup
                # expire` deletes the objects it has aged out, so a
                # writer that cannot delete leaves the backup growing
                # without bound.
                role: roles/storage.objectAdmin
                member: {{ printf "serviceAccount:sa-%s-backup@%s.iam.gserviceaccount.com" $name $xr.spec.projectId | quote }}
            ---
            # Reading the bucket itself, which objectAdmin does not
            # carry: its permissions are all storage.objects.* and
            # storage.folders.*, and none of them is
            # storage.buckets.get. The proxy's GCS client asks for the
            # bucket before it touches an object, so without this every
            # request fails 403 naming a permission rather than
            # anything about the object.
            #
            # legacyBucketReader rather than bucketViewer: both carry
            # storage.buckets.get, and this is the one meant to be
            # bound on a bucket. Its extra permissions are objects.list
            # and folders.list, which objectAdmin already grants.
            apiVersion: storage.gcp.m.upbound.io/v1beta1
            kind: BucketIAMMember
            metadata:
              name: {{ printf "%s-backup-reader" $bucket }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-backups-bucket-reader
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                bucket: {{ $bucket | quote }}
                role: roles/storage.legacyBucketReader
                member: {{ printf "serviceAccount:sa-%s-backup@%s.iam.gserviceaccount.com" $name $xr.spec.projectId | quote }}
            ---
            # Both halves of Workload Identity. The chart pins the
            # Kubernetes service account name, so the member string is
            # spelled rather than derived twice.
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ServiceAccountIAMMember
            metadata:
              name: {{ printf "sa-%s-backup-wi" $name }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-backup-identity-wi
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                role: roles/iam.workloadIdentityUser
                serviceAccountIdRef:
                  name: {{ printf "sa-%s-backup" $name }}
                member: {{ printf "serviceAccount:%s.svc.id.goog[queenswood/queenswood-s3proxy]" $xr.spec.projectId | quote }}
            ---
            # The realm export's half of Workload Identity, onto the
            # same GCP account the proxy uses.
            #
            # One identity, not two. Both write this instance's backups
            # to the same bucket, so a second account would carry the
            # same grants and draw no boundary -- and one GCP account
            # binds to as many Kubernetes ones as name it. objectAdmin
            # is what the export needs rather than objectCreator,
            # incidentally: it rewrites LATEST, and overwriting an
            # object in GCS is a delete and a create.
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ServiceAccountIAMMember
            metadata:
              name: {{ printf "sa-%s-backup-wi-realm-export" $name }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-backup-identity-wi-realm-export
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                role: roles/iam.workloadIdentityUser
                serviceAccountIdRef:
                  name: {{ printf "sa-%s-backup" $name }}
                member: {{ printf "serviceAccount:%s.svc.id.goog[queenswood/queenswood-realm-export]" $xr.spec.projectId | quote }}
            ---
            # The composite's own kind, which is how this function
            # writes composite status.
            apiVersion: queenswood.repldriven.com/v1alpha1
            kind: XQueenswoodInstance
            status:
              backupsBucket: {{ $bucket | quote }}
              fdbBackupKeySecret: {{ $key | quote }}
              backupServiceAccount: {{ printf "sa-%s-backup@%s.iam.gserviceaccount.com" $name $xr.spec.projectId | quote }}
            {{- end }}
    - step: access
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := printf "%s-%s-%s" $xr.spec.code $xr.spec.env $xr.spec.label }}
            {{- $project := $xr.spec.projectId }}
            {{- $viewers := dig "access" "platformViewer" (list) $xr.spec }}
            {{- range $i, $member := $viewers }}
            ---
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectIAMMember
            metadata:
              name: {{ $name }}-pod-log-reader-{{ $i }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-pod-log-reader-{{ $i }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project }}
                role: projects/{{ $project }}/roles/rl_pod_log_reader
                member: {{ $member | quote }}
            {{- end }}
            {{- /* Named from a hash of the member rather than its index,
                   unlike the loop above: a principal removed from the
                   middle of a list renumbers everything after it, and
                   Crossplane rebuilds live bindings it only renamed.
                   The loop above predates this and keeps its names
                   rather than rebuilding what it has. */}}
            {{- range $member := dig "access" "platformAdmin" (list) $xr.spec }}
            {{- $slug := sha256sum $member | trunc 8 }}
            ---
            # Creating the OAuth client Google sign-in runs on, which
            # Google exposes no API for. So this is a right a person
            # holds and no automation can use, and it lives with the
            # capability that already writes rather than with the one
            # named viewer.
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectIAMMember
            metadata:
              name: {{ $name }}-oauth-config-{{ $slug }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-oauth-config-{{ $slug }}
            spec:
              # With Delete: a principal dropped from the mapping has to
              # lose the binding in GCP, not merely the resource naming
              # it.
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
                - Delete
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project }}
                role: roles/oauthconfig.editor
                member: {{ $member | quote }}
            {{- end }}
            {{- range $member := dig "access" "secretsAdmin" (list) $xr.spec }}
            {{- $slug := sha256sum $member | trunc 8 }}
            {{- range $role := (list "roles/secretmanager.viewer" "roles/secretmanager.secretVersionAdder") }}
            {{- $roleSlug := sha256sum $role | trunc 6 }}
            ---
            # Writing the version a composed entry holds no value until
            # somebody adds. Two narrow roles rather than
            # secretmanager.admin, which the plane's own secretsAdmin
            # takes: viewer sees the container, secretVersionAdder adds
            # to it, and neither carries versions.access -- so whoever
            # writes a secret here cannot read one back, and nothing
            # anybody holds can destroy a version or an entry.
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectIAMMember
            metadata:
              name: {{ $name }}-secrets-admin-{{ $slug }}-{{ $roleSlug }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: instance-secrets-admin-{{ $slug }}-{{ $roleSlug }}
            spec:
              # With Delete, as the OAuth binding above has: a principal
              # dropped from the mapping loses the binding in GCP, not
              # merely the resource that names it.
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
                - Delete
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project }}
                role: {{ $role | quote }}
                member: {{ $member | quote }}
            {{- end }}
            {{- end }}
    - step: auto-ready
      functionRef:
        name: function-auto-ready
