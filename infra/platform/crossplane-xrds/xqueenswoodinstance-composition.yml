apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xqueenswoodinstance.gcp
spec:
  compositeTypeRef:
    apiVersion: queenswood.repldriven.com/v1alpha1
    kind: XQueenswoodInstance
  mode: Pipeline
  pipeline:
    # =======================================================================
    # What is true of the whole installation rather than of this
    # environment: today the billing account, in time whatever else every
    # instance would otherwise restate. Merged into the pipeline's context,
    # where the next step reads it.
    #
    # Selected by label rather than named, because the name has to follow
    # the installation code and a Reference takes a literal. Required, so
    # an installation with no config is a composite that says so -- the
    # alternative is a project that comes up unbilled and looks fine.
    # =======================================================================
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          policy:
            resolution: Required
          environmentConfigs:
            - type: Selector
              selector:
                mode: Single
                matchLabels:
                  - type: FromCompositeFieldPath
                    key: installation
                    valueFromFieldPath: spec.code
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # ===================================================================
          # The project, and for now nothing else. It withholds Delete
          # and is meant to be liened: an instance project is the
          # protected tier under ADR-0022, because down is a stopped
          # environment rather than a deleted one, and because a project
          # id is spent whether or not the project survives.
          #
          # What goes down with an instance -- the cluster, the
          # database, the addresses -- is fully managed and composed
          # here later. Nothing whose loss is unrecoverable belongs in
          # this project at all: the backups and the encryption key live
          # in the management project, one bucket per installation.
          # ===================================================================
          - name: instance-project
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: Project
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  # No default VPC. The org policy says the same thing,
                  # and the network an instance uses is composed here.
                  autoCreateNetwork: false
                  # Provider-side, and already the default.
                  deletionPolicy: PREVENT
            patches:
              # prj-<code>-<env>-<label>, without the id's suffix: the
              # Kubernetes name is the one another resource spells, and
              # the suffix belongs to the globally-unique id alone.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: metadata.name
              # Adoption only, and skipped when absent, so a first run
              # creates and a rebuild takes over what is already there.
              - fromFieldPath: spec.adopt
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.projectId
              # Derived first, then overridden: a later patch wins when
              # its source is set and is skipped when it is absent, so
              # this is how a field gets a default it cannot state.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.name
              - fromFieldPath: spec.displayName
                toFieldPath: spec.forProvider.name
              # The installation's account, then this instance's if it
              # names one: the same later-patch-wins ordering as the
              # display name above, so a manifest overrides the shared
              # default without either having to know about the other.
              - type: FromEnvironmentFieldPath
                fromFieldPath: billingAccountId
                toFieldPath: spec.forProvider.billingAccount
              - fromFieldPath: spec.billingAccountId
                toFieldPath: spec.forProvider.billingAccount
              # Names the folder the plane composed, by the name the
              # naming rule fixes. A managed-resource reference rather
              # than anything reaching into the plane's composite:
              # Crossplane resolves it and orders the two itself, and
              # neither composite knows the other exists.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.folderIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "fldr-%s"
              # The prefixed id lands in the external-name annotation
              # before it appears anywhere in status.atProvider.
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.projectId
          # ===================================================================
          # What this project may be asked to do. A project is created
          # bare -- nothing is enabled by default -- so each of these
          # stands between the composition and a resource it will
          # compose next, and enabling one needs billing already linked.
          #
          # Five, not the eight the plane enables for itself: sqladmin,
          # dns and certificatemanager arrive with the database and the
          # domain rather than ahead of them.
          #
          # Named with the label as well as the environment. The plane's
          # are svc-<code>-c-<api> because one management project ends
          # the name there, where two nonprod instances would otherwise
          # both claim svc-<code>-n-compute.
          # ===================================================================
          # The network, its subnets and any address.
          - name: instance-service-compute
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: compute.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-compute"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # The cluster and its node pool.
          - name: instance-service-container
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: container.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-container"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # Service accounts composed inside this project.
          - name: instance-service-iam
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: iam.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-iam"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # Project IAM, which every identity here needs a binding in.
          - name: instance-service-resourcemanager
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: cloudresourcemanager.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-resourcemanager"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # Reading and managing the enablement above.
          - name: instance-service-serviceusage
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: serviceusage.googleapis.com
                  # Leaving an API on when the resource goes is the
                  # safe direction: disabling one takes every resource
                  # in the project that depends on it.
                  disableOnDestroy: false
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "svc-%s-%s-%s-serviceusage"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "prj-%s-%s-%s"
                toFieldPath: spec.forProvider.projectRef.name
          # ===================================================================
          # The network this environment runs in. One VPC per instance,
          # in the instance's own project, so two environments share
          # nothing and neither can reach the other by accident.
          #
          # The ranges are identical in every instance, which is
          # deliberate while the VPCs are isolated and would have to
          # change the day two of them peer -- or one peers with the
          # plane, whose subnet is 10.60.0.0/16 and so does not collide
          # with these.
          #
          # Delete is withheld, as it is on the plane's. ADR-0022 lists
          # what an instance may fully manage -- clusters, databases,
          # addresses, certificates -- and a network is not among them:
          # GCP refuses to delete one while a cluster sits in it, so the
          # deletion stalls rather than tidies. An instance going down
          # stops its cluster; retiring one for good is deliberate,
          # like retiring its project.
          #
          # Network and Subnetwork take a project id rather than a ref,
          # so it comes from the manifest, which always carries it.
          # ===================================================================
          - name: instance-vpc
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Network
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  autoCreateSubnetworks: false
                  routingMode: REGIONAL
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
          # The subnet the nodes sit in, with the two secondary ranges
          # GKE wants: pods and services are allocated from them rather
          # than from the primary range, and naming them here is what
          # lets the cluster ask for them by name.
          - name: instance-subnet
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Subnetwork
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  ipCidrRange: 10.10.0.0/16
                  secondaryIpRange:
                    - rangeName: pods
                      ipCidrRange: 10.20.0.0/16
                    - rangeName: services
                      ipCidrRange: 10.30.0.0/20
                  # Lets a node reach a Google API without a public
                  # address, which is what keeps the pool private.
                  privateIpGoogleAccess: true
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.regionCode
                  strategy: string
                  string:
                    fmt: "sb-%s-%s-%s-%s"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: spec.forProvider.networkRef.name
          # Where a regional load balancer puts its proxies. Its own
          # subnet because GCP requires one per region reserved for the
          # purpose, and it holds no instances of ours.
          - name: instance-subnet-proxy
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Subnetwork
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  ipCidrRange: 10.40.0.0/24
                  purpose: REGIONAL_MANAGED_PROXY
                  role: ACTIVE
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.regionCode
                  strategy: string
                  string:
                    fmt: "sb-%s-%s-%s-proxy-%s"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: spec.forProvider.networkRef.name
          # ===================================================================
          # The identity this instance's nodes run as. Not the default
          # compute service account, which is shared by everything in
          # the project that never chose one and holds whatever the
          # organisation's policy on automatic grants leaves it holding.
          # The pool asks for cloud-platform scopes, so whatever it
          # holds, every workload on the cluster reaches through the
          # metadata server.
          #
          # Delete is withheld. ADR-0024 says down leaves the project,
          # its DNS zone and its identities standing, so an identity is
          # not the disposable tier even though the cluster it runs is.
          #
          # The label is in the name where the plane's node identity has
          # only the environment letter: two nonprod instances in one
          # installation would otherwise both claim sa-<code>-n-nodes,
          # and Crossplane holds every instance's resources in one
          # namespace whatever project each lands in.
          # ===================================================================
          - name: instance-nodes-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood instance nodes
                  description: Runs this environment's cluster nodes
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-nodes"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              # The account id is the external name, so it is stated
              # rather than left to default from metadata.name: the node
              # pool below spells the same address, and a generated one
              # would leave it spelling nothing.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-nodes"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
          # One role rather than the four the older guidance lists.
          # container.defaultNodeServiceAccount is narrower than they
          # are -- monitoring.viewer alone grants project-wide read of
          # every alert policy and dashboard, which a node has no use
          # for -- and it carries autoscaling.sites.writeMetrics, which
          # none of them do and horizontal autoscaling needs. Google
          # maintains it, so a change in what a node requires arrives
          # here rather than leaving a hand-written list stale.
          #
          # Nothing grants the platform identity serviceAccountUser on
          # this account, as the plane's composition has to for its own:
          # the platform identity created this project, which makes it
          # owner of it, and attaching a service account to a node pool
          # is a right owner already holds.
          - name: instance-nodes-role-default-node-service-account
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/container.defaultNodeServiceAccount
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-nodes-default-node-service-account"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "serviceAccount:sa-%s-%s-%s-nodes@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.member
          # ===================================================================
          # The cluster this environment runs on, and where its bill
          # starts: everything composed above it costs nothing standing
          # still.
          #
          # Fully managed, Delete included, which is what ADR-0022
          # leaves the disposable tier. Retiring an instance destroys
          # the cluster and leaves the project, the network and the
          # identities, which is the line that makes state a word in a
          # file rather than a teardown.
          #
          # No nodeConfig here on purpose. It only ever configures the
          # default node pool, which removeDefaultNodePool deletes
          # immediately, and GKE then recomputes node_config on the
          # cluster. The provider sees a diff on a field that can only
          # change by replacing the cluster and refuses to reconcile,
          # leaving it stuck Creating. The real node configuration is on
          # the pool below.
          # ===================================================================
          - name: instance-cluster
            base:
              apiVersion: container.gcp.m.upbound.io/v1beta1
              kind: Cluster
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  initialNodeCount: 1
                  removeDefaultNodePool: true
                  # The composite is what protects this, through
                  # managementPolicies and the manifest that declares
                  # it. A second lock GCP holds outside Crossplane only
                  # makes a declared teardown fail halfway.
                  deletionProtection: false
                  releaseChannel:
                    channel: REGULAR
                  ipAllocationPolicy:
                    clusterSecondaryRangeName: pods
                    servicesSecondaryRangeName: services
                  addonsConfig:
                    httpLoadBalancing:
                      disabled: false
                  # What the proxy-only subnet is for. Upbound's CRD
                  # nests this at the top level rather than under
                  # networkConfig, and placing it elsewhere is silently
                  # dropped.
                  gatewayApiConfig:
                    channel: CHANNEL_STANDARD
                # A kubeconfig for this cluster, written by the provider
                # on every reconcile. It carries the endpoint and the CA
                # and no credential: the token comes from the identity
                # block on whichever provider config reads it. This is
                # what provider-helm will want when the workloads
                # arrive.
                writeConnectionSecretToRef:
                  name: instance-kubeconfig
            patches:
              # No kind prefix: a cluster is never listed beside other
              # kinds, and GKE prefixes every name it derives from one
              # with gke- already.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-kubeconfig"
                toFieldPath: spec.writeConnectionSecretToRef.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "vpc-%s-%s-%s"
                toFieldPath: spec.forProvider.networkRef.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.regionCode
                  strategy: string
                  string:
                    fmt: "sb-%s-%s-%s-%s"
                toFieldPath: spec.forProvider.subnetworkRef.name
              - &cluster-project
                fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              - &cluster-zone
                fromFieldPath: spec.zone
                toFieldPath: spec.forProvider.location
              # Workload Identity, so a pod assumes a service account
              # rather than holding a key. Nothing binds to the pool
              # yet; the cluster is where the choice is made available.
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.workloadIdentityConfig.workloadPool
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s.svc.id.goog"
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.endpoint
                toFieldPath: status.clusterEndpoint
          # ===================================================================
          # The one pool, and the only place state governs anything
          # today: up is three nodes, down is none.
          #
          # The count is in the map rather than in a field of its own,
          # and that is a property of patch-and-transform rather than a
          # preference. A map transform must name every key it may see
          # or it errors, so a state patch always writes the count --
          # which means a second patch carrying a manifest's own count
          # either overwrites the state or is overwritten by it,
          # depending only on which is written last. A per-instance
          # count needs a templating step to arrive, and there is
          # nothing running here yet to size one against.
          #
          # Fully managed with the cluster it belongs to. It carries the
          # environment even though its cluster already settles it: GCP
          # scopes a pool's name to its parent, so every cluster may
          # hold an np-primary, where the composed resources for every
          # instance in an installation share one namespace. Naming it
          # for the cluster in GCP and for the namespace in Kubernetes
          # would be two names for one thing, so it is one name in both.
          #
          # primary rather than default: GKE creates its own
          # default-pool on every cluster, and a name echoing it leaves
          # a reader guessing whose is whose.
          # ===================================================================
          - name: instance-nodes
            base:
              apiVersion: container.gcp.m.upbound.io/v1beta1
              kind: NodePool
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  nodeConfig:
                    diskSizeGb: 50
                    diskType: pd-standard
                    oauthScopes:
                      - https://www.googleapis.com/auth/cloud-platform
                    workloadMetadataConfig:
                      mode: GKE_METADATA
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "np-%s-%s-%s-primary"
                toFieldPath: metadata.name
              # By value, not clusterRef. The reference extractor reads
              # a field the provider never fills for Cluster -- there is
              # no forProvider.name, and atProvider.name stays empty --
              # so it resolves to nothing forever. The cluster's name is
              # its external name, which this composition sets, so the
              # value is as deterministic as the reference would have
              # been.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s"
                toFieldPath: spec.forProvider.cluster
              - *cluster-project
              - *cluster-zone
              - fromFieldPath: spec.machineType
                toFieldPath: spec.forProvider.nodeConfig.machineType
              - fromFieldPath: spec.state
                toFieldPath: spec.forProvider.nodeCount
                transforms:
                  - type: map
                    map:
                      up: 3
                      down: 0
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-nodes@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.nodeConfig.serviceAccount
    - step: auto-ready
      functionRef:
        name: function-auto-ready
