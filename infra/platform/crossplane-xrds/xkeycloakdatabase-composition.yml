apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xkeycloakdatabase.gcp
spec:
  compositeTypeRef:
    apiVersion: platform.queenswood.repldriven.com/v1alpha1
    kind: XKeycloakDatabase
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: instance
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: DatabaseInstance
              metadata:
                name: queenswood-keycloak-instance
              spec:
                forProvider:
                  databaseVersion: POSTGRES_16
                  deletionProtection: false
                  # `settings`, `backupConfiguration`, and
                  # `ipConfiguration` are all map-typed on this CRD
                  # (provider-upjet-gcp collapses Terraform's
                  # MaxItems-1 TypeList blocks into single objects).
                  settings:
                    # ENTERPRISE edition accepts custom shapes;
                    # ENTERPRISE_PLUS (the default for newly-created
                    # instances) only takes the predefined
                    # `db-perf-optimized-N-*` family which is
                    # several times the cost. ENTERPRISE +
                    # `db-custom-1-3840` is the cheapest legal combo
                    # for Postgres.
                    edition: ENTERPRISE
                    tier: db-custom-1-3840
                    diskSize: 10
                    diskType: PD_SSD
                    backupConfiguration:
                      enabled: true
                      pointInTimeRecoveryEnabled: false
                    ipConfiguration:
                      # Public IP with cloud-sql-proxy. The cluster's
                      # NAT egress reaches CloudSQL over public
                      # internet; auth is via IAM (Workload Identity
                      # on the proxy pod) — `authorizedNetworks`
                      # stays empty so password-less direct access
                      # is impossible.
                      ipv4Enabled: true
            patches:
              - fromFieldPath: spec.instanceName
                toFieldPath: metadata.name
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - fromFieldPath: spec.postgresVersion
                toFieldPath: spec.forProvider.databaseVersion
              - fromFieldPath: spec.tier
                toFieldPath: spec.forProvider.settings.tier
              # Surface `<project>:<region>:<instance>` so consumers
              # don't have to assemble it themselves. Crossplane's
              # provider-gcp-sql writes it onto
              # `status.atProvider.connectionName`.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.connectionName
                toFieldPath: status.connectionName
          - name: database
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: Database
              metadata:
                name: queenswood-keycloak-database
              spec:
                forProvider:
                  instanceSelector:
                    matchControllerRef: true
            patches:
              # provider-upjet-gcp derives the CloudSQL database name
              # from `metadata.name` (via the `crossplane.io/
              # external-name` annotation it sets automatically).
              # There's no `spec.forProvider.name` field.
              - fromFieldPath: spec.databaseName
                toFieldPath: metadata.name
          - name: user
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: User
              metadata:
                name: queenswood-keycloak-user
              spec:
                forProvider:
                  instanceSelector:
                    matchControllerRef: true
                  passwordSecretRef:
                    key: password
                # Under Crossplane v2 namespaced composites, both
                # `passwordSecretRef` and `writeConnectionSecretToRef`
                # resolve to the User resource's own namespace (which
                # is the XR's namespace). The composed Secret lands
                # alongside the keycloak chart that mounts it.
                writeConnectionSecretToRef: {}
            patches:
              # Same external-name story as `Database` — username
              # flows through `metadata.name`, not `spec.forProvider.
              # name`.
              - fromFieldPath: spec.username
                toFieldPath: metadata.name
              # passwordSecretRef points at a chart-rendered Secret
              # in the XR's namespace carrying the operator-supplied
              # password (see queenswood-platform/templates/
              # keycloak-database-password.yaml).
              - fromFieldPath: spec.instanceName
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"
              - fromFieldPath: spec.instanceName
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-conn"
