apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xkeycloakdatabase.gcp
spec:
  compositeTypeRef:
    apiVersion: platform.queenswood.repldriven.com/v1alpha1
    kind: XKeycloakDatabase
  mode: Pipeline
  # The User resource writes the generated password into this Secret;
  # downstream consumers (the keycloak chart's cloud-sql-proxy and the
  # Keycloak CR's passwordSecret reference) pull from it.
  writeConnectionSecretsToNamespace: ""
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: instance
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: DatabaseInstance
              metadata:
                name: queenswood-keycloak-instance
              spec:
                forProvider:
                  databaseVersion: POSTGRES_16
                  deletionProtection: false
                  settings:
                    - tier: db-f1-micro
                      diskSize: 10
                      diskType: PD_SSD
                      backupConfiguration:
                        - enabled: true
                          pointInTimeRecoveryEnabled: false
                      ipConfiguration:
                        # Public IP with cloud-sql-proxy. The cluster's
                        # NAT egress reaches CloudSQL over public
                        # internet; auth is via IAM (Workload Identity
                        # on the proxy pod) — `authorizedNetworks`
                        # stays empty so password-less direct access
                        # is impossible.
                        - ipv4Enabled: true
            patches:
              - fromFieldPath: spec.instanceName
                toFieldPath: metadata.name
              - fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - fromFieldPath: spec.postgresVersion
                toFieldPath: spec.forProvider.databaseVersion
              - fromFieldPath: spec.tier
                toFieldPath: spec.forProvider.settings[0].tier
              # Surface `<project>:<region>:<instance>` so consumers
              # don't have to assemble it themselves. Crossplane's
              # provider-gcp-sql writes it onto
              # `status.atProvider.connectionName`.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.connectionName
                toFieldPath: status.connectionName
          - name: database
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: Database
              metadata:
                name: queenswood-keycloak-database
              spec:
                forProvider:
                  instanceSelector:
                    matchControllerRef: true
            patches:
              - fromFieldPath: spec.databaseName
                toFieldPath: metadata.name
              - fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.name
          - name: user
            base:
              apiVersion: sql.gcp.m.upbound.io/v1beta1
              kind: User
              metadata:
                name: queenswood-keycloak-user
              spec:
                forProvider:
                  instanceSelector:
                    matchControllerRef: true
                  passwordSecretRef:
                    namespace: crossplane-system
                    key: password
                writeConnectionSecretToRef:
                  namespace: crossplane-system
            patches:
              - fromFieldPath: spec.username
                toFieldPath: metadata.name
              - fromFieldPath: spec.username
                toFieldPath: spec.forProvider.name
              - fromFieldPath: spec.instanceName
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-password"
              - fromFieldPath: spec.instanceName
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-conn"
