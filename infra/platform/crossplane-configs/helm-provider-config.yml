apiVersion: helm.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: queenswood-gke
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: queenswood-gke-kubeconfig
      key: kubeconfig
  identity:
    type: GoogleApplicationCredentials
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: creds
