# The v1 gcp.upbound.io ProviderConfig is NOT defined here; Argo's
# RespectIgnoreDifferences was observed reverting its spec.projectID
# back to a placeholder, breaking every fresh `gcp-up`. That
# resource is now owned by `just kind-xp-install-gcp-config`, which
# envsubst-applies infra/local/gcp-provider-config.yml.tmpl directly.
#
# Namespace-scoped MRs (the `.m.` variants used by Compositions for
# Crossplane v2 namespace-scoped XRs) resolve provider auth through
# ClusterProviderConfig, which Argo manages just fine.
apiVersion: gcp.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  projectID: PLACEHOLDER
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: creds
