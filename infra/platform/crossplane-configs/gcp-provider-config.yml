apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  # Overridden per-cluster by `just kind-xp-install-gcp-config`;
  # Argo's ignoreDifferences in apps/crossplane-configs.yml keeps this
  # placeholder from clobbering the live value on selfHeal.
  projectID: PLACEHOLDER
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: creds
---
# Namespace-scoped MRs (the `.m.` variants used by Compositions for
# Crossplane v2 namespace-scoped XRs) resolve provider auth through
# ClusterProviderConfig, not the regular ProviderConfig.
apiVersion: gcp.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  projectID: PLACEHOLDER
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: creds
