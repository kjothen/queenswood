apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  # Overridden per-cluster by `just kind-xp-install-gcp-provider-config`;
  # Argo's ignoreDifferences in apps/crossplane-configs.yml keeps this
  # placeholder from clobbering the live value on selfHeal.
  projectID: PLACEHOLDER
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-creds
      key: creds
