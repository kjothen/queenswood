# runtimeConfigRef names a DeploymentRuntimeConfig created by the
# management-plane chart, so the GCP providers share a fixed service
# account rather than a generated one.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-container
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-container:v2.5.1
  runtimeConfigRef:
    name: crossplane-provider-gcp
---
