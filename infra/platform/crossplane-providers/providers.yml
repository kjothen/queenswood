---
# Crossplane v2 removed Composition.spec.resources; direct patches now
# go through this function in Pipeline mode.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.8.2
---
# Patch-and-transform composes a fixed set of resources. The access
# mapping needs a varying one: no binding at all for a capability the
# organisation does not provide, and one per member where it does.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.12.3
---
# Marks composed resources ready once their own Ready condition is.
# Needed because patch-and-transform sets readiness only for what it
# composes: anything a later function adds is never ready without this,
# and a composite holding such a resource stays at Creating forever.
#
# v0.7.0 is the release the project marks Latest. A v0.6.7 exists with a
# later date -- a patch on the older line, not a newer version.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0
