apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # ← this line
  source:
    repoURL: https://github.com/kjothen/queenswood
    targetRevision: main
    path: infra/bootstrap/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # provider-helm registers helm.crossplane.io/Release; until that
      # provider installs, queenswood/release.yml fails validation and
      # aborts the whole sync (incl. the providers app that would fix
      # it). Skipping dry-run for unknown kinds lets Argo apply what it
      # can and retry the rest as CRDs come online.
      - SkipDryRunOnMissingResource=true
