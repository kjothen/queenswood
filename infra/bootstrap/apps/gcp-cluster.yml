apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gcp-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    description: Queenswood GKE Cluster
spec:
  project: default
  source:
    repoURL: https://github.com/repldriven/queenswood
    targetRevision: main
    path: infra/gcp/cluster
  destination:
    server: https://kubernetes.default.svc
  # workloadPool is set per-cluster by `just kind-xp-install-gcp-config`.
  # SSA + managedFieldsManagers tells Argo to defer to whichever manager
  # owns the field rather than fighting git's PLACEHOLDER. The recipe's
  # `kubectl patch --type=merge` registers as `kubectl-patch` so we
  # ignore that subtree's diffs when that manager owns it.
  ignoreDifferences:
    - group: container.gcp.upbound.io
      kind: Cluster
      jsonPointers:
        - /spec/forProvider/workloadIdentityConfig/workloadPool
      managedFieldsManagers:
        - kubectl-patch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
