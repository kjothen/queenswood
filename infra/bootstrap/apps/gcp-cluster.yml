apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gcp-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/kjothen/queenswood
    targetRevision: main
    path: infra/gcp/cluster
  destination:
    server: https://kubernetes.default.svc
  # workloadPool is set per-cluster by `just kind-xp-install-gcp-config`.
  ignoreDifferences:
    - group: container.gcp.upbound.io
      kind: Cluster
      jsonPointers:
        - /spec/forProvider/workloadIdentityConfig/workloadPool
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
