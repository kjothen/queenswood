apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gcp-network
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/repldriven/queenswood
    targetRevision: main
    path: infra/gcp/network
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
