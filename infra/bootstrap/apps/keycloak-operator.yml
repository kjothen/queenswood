apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    # Lands after the cluster + Crossplane providers but before any
    # chart that emits Keycloak / KeycloakRealmImport CRs — those
    # syncs would fail validation if the CRDs weren't present.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/repldriven/queenswood
    targetRevision: main
    path: infra/keycloak-operator
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    # The operator owns its own `keycloak-operator` namespace; the
    # CRDs are cluster-scoped. Argo's destination namespace acts as a
    # fallback for any resource that didn't pin one — none of these
    # do, so the field is mostly cosmetic.
    namespace: keycloak-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
