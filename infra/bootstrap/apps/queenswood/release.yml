apiVersion: helm.crossplane.io/v1beta1
kind: Release
# Helm release name (and therefore every templated resource name)
# inherits from metadata.name. Plain `queenswood` matches the
# release name used by `just helm-install` locally and by the
# quickstart README, so the same kubectl recipes work everywhere.
# Renamed from `queenswood-bank` to drop the `bank-bank-` doubling
# that came from the chart templates already prefixing their
# resources with `bank-` (e.g. `queenswood-bank-bank-app`).
metadata:
  name: queenswood
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  forProvider:
    chart:
      name: queenswood
      repository: oci://ghcr.io/kjothen
      version: 0.5.3
    namespace: queenswood
    values:
      image:
        registry: ghcr.io/kjothen
        tag: latest
      gateway:
        enabled: true
        host: queenswood.repldriven.com
        gcp:
          enabled: true
      # Queenswood-specific config: FDB cluster ref, Pulsar endpoint, etc.
  providerConfigRef:
    name: queenswood-gke
