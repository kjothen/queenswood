apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: queenswood-bank
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  forProvider:
    chart:
      name: queenswood
      repository: oci://ghcr.io/kjothen
      version: 0.1.0
    namespace: queenswood
    values:
      image:
        registry: ghcr.io/kjothen
        tag: 0.1.0
      ingress:
        enabled: true
        host: queenswood.repldriven.com
        gcp:
          enabled: true
      # Queenswood-specific config: FDB cluster ref, Pulsar endpoint, etc.
  providerConfigRef:
    name: queenswood-gke
