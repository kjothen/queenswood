apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-configs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/repldriven/queenswood
    targetRevision: main
    path: infra/platform/crossplane-configs
  destination:
    server: https://kubernetes.default.svc
  # projectID on the v2 ClusterProviderConfig is set per-cluster by
  # `just kind-xp-install-gcp-config` (called from `up-from-zero`).
  # Keeping it out of git so cold starts against fresh GCP projects
  # don't need a commit. The v1 ProviderConfig is owned outside Argo
  # entirely; see infra/local/gcp-provider-config.yml.tmpl.
  ignoreDifferences:
    - group: gcp.m.upbound.io
      kind: ClusterProviderConfig
      jsonPointers:
        - /spec/projectID
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
