apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-configs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/kjothen/queenswood
    targetRevision: main
    path: infra/platform/crossplane-configs
  destination:
    server: https://kubernetes.default.svc
  # projectID is set per-cluster by `just kind-xp-install-gcp-provider-config`
  # (called from `up-from-zero`). Keeping it out of git so cold starts
  # against fresh GCP projects don't need a commit.
  ignoreDifferences:
    - group: gcp.upbound.io
      kind: ProviderConfig
      jsonPointers:
        - /spec/projectID
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
