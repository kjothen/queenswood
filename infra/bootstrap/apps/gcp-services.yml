apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gcp-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    description: GCP API enablement
spec:
  project: default
  source:
    repoURL: https://github.com/repldriven/queenswood
    targetRevision: main
    path: infra/gcp/services
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
