system:
  kafka:
    schemas: !system/component
      system/component-kind: avro/serde
      schemas:
        command: schemas/command/command-envelope.avsc.json
        command-response: schemas/command/command-response.avsc.json
        event: schemas/event/event-envelope.avsc.json
    producers: !system/component
      system/component-kind: kafka/producers
      banks-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-banks-command-response
          acks: all
      parties-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-parties-command-response
          acks: all
      cash-accounts-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-cash-accounts-command-response
          acks: all
      cash-account-products-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-cash-account-products-command-response
          acks: all
      idv-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-idv-command
          acks: all
      banks-command-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-banks-command-dlq
          acks: all
      parties-command-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-parties-command-dlq
          acks: all
      cash-accounts-command-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-cash-accounts-command-dlq
          acks: all
      cash-account-products-command-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-cash-account-products-command-dlq
          acks: all
    consumers: !system/component
      system/component-kind: kafka/consumers
      banks-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-banks-command]
        dead-letter-producer: !system/local-ref producers.banks-command-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: bank-service-banks-command
      parties-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-parties-command]
        dead-letter-producer: !system/local-ref producers.parties-command-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: party-service-parties-command
      cash-accounts-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-cash-accounts-command]
        dead-letter-producer: !system/local-ref producers.cash-accounts-command-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: cash-account-service-cash-accounts-command
      cash-account-products-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-cash-account-products-command]
        dead-letter-producer: !system/local-ref producers.cash-account-products-command-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: cash-account-product-service-cash-account-products-command
      idv-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        topics: [topic-idv-event]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: idv-service-idv-event
    message-bus-producers: !system/component
      system/component-kind: kafka/message-bus-producers
      banks-command-response:
        producer: !system/local-ref producers.banks-command-response
      parties-command-response:
        producer: !system/local-ref producers.parties-command-response
      cash-accounts-command-response:
        producer: !system/local-ref producers.cash-accounts-command-response
      cash-account-products-command-response:
        producer: !system/local-ref producers.cash-account-products-command-response
      idv-command:
        producer: !system/local-ref producers.idv-command
    message-bus-consumers: !system/component
      system/component-kind: kafka/message-bus-consumers
      banks-command:
        consumer: !system/local-ref consumers.banks-command
        timeout: 500
      parties-command:
        consumer: !system/local-ref consumers.parties-command
        timeout: 500
      cash-accounts-command:
        consumer: !system/local-ref consumers.cash-accounts-command
        timeout: 500
      cash-account-products-command:
        consumer: !system/local-ref consumers.cash-account-products-command
        timeout: 500
      idv-event:
        consumer: !system/local-ref consumers.idv-event
        timeout: 500
  message-bus: !include bank/message-bus.yml
  fdb: !include bank/fdb.yml
  avro: !include bank/avro.yml
  keycloak:
    identity-provider: !system/component
      system/component-kind: keycloak/identity-provider
      base-url: !env KEYCLOAK_BASE_URL
      realm: !env KEYCLOAK_REALM
      admin-client-id: !env KEYCLOAK_ADMIN_CLIENT_ID
      admin-client-secret: !env KEYCLOAK_ADMIN_CLIENT_SECRET
      expected-issuer: !env KEYCLOAK_EXPECTED_ISSUER
  banks: !include bank/bank.yml
  parties: !include bank/party.yml
  cash-accounts: !include bank/cash-account.yml
  cash-account-products: !include bank/cash-account-product.yml
  idv: !include bank/idv.yml
  telemetry:
    otel-sdk: !system/component
      system/component-kind: telemetry/otel-sdk
      service-name: !env SERVICE_NAME
      endpoint: !env OTEL_ENDPOINT
