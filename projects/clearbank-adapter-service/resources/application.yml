system:
  kafka:
    schemas: !system/component
      system/component-kind: avro/serde
      schemas:
        command: schemas/command/command-envelope.avsc.json
        command-response: schemas/command/command-response.avsc.json
        event: schemas/event/event-envelope.avsc.json
    producers: !system/component
      system/component-kind: kafka/producers
      schemes-payment-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-schemes-payment-command-response
          acks: all
      schemes-payments-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-schemes-payments-event
          acks: all
      schemes-payment-command-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-schemes-payment-command-dlq
          acks: all
    consumers: !system/component
      system/component-kind: kafka/consumers
      schemes-payment-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-schemes-payment-command]
        dead-letter-producer: !system/local-ref producers.schemes-payment-command-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: clearbank-adapter-service-schemes-payment-command
    message-bus-producers: !system/component
      system/component-kind: kafka/message-bus-producers
      schemes-payment-command-response:
        producer: !system/local-ref producers.schemes-payment-command-response
      schemes-payments-event:
        producer: !system/local-ref producers.schemes-payments-event
    message-bus-consumers: !system/component
      system/component-kind: kafka/message-bus-consumers
      schemes-payment-command:
        consumer: !system/local-ref consumers.schemes-payment-command
        timeout: 500
  message-bus: !include system/message-bus.yml
  fdb: !include system/fdb.yml
  avro: !include system/avro.yml
  telemetry:
    otel-sdk: !system/component
      system/component-kind: telemetry/otel-sdk
      service-name: !env SERVICE_NAME
      endpoint: !env OTEL_ENDPOINT
  clearbank-adapter:
    readiness: !system/component
      system/component-kind: clearbank-adapter/readiness
    registrar: !system/component
      system/component-kind: clearbank-adapter/registrar
      simulator-url: !env CLEARBANK_SIMULATOR_URL
      webhook-url: !env CLEARBANK_ADAPTER_PUBLIC_URL
      readiness: !system/ref clearbank-adapter.readiness
      webhooks:
        - type: TransactionSettled
          path: /webhooks/transaction-settled
        - type: TransactionRejected
          path: /webhooks/transaction-rejected
        - type: PaymentMessageAssessmentFailed
          path: /webhooks/payment-message-assessment-failed
        - type: InboundHeldTransaction
          path: /webhooks/inbound-held-transaction
        - type: OutboundHeldTransaction
          path: /webhooks/outbound-held-transaction
        - type: InboundCopRequestReceived
          path: /webhooks/inbound-cop-request-received
    command-processor-impl: !system/component
      system/component-kind: clearbank-adapter/command-processor
      schemas: !system/ref avro.serde
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
    command-processor: !system/component
      system/component-kind: command-processor/command-processor
      bus: !system/ref message-bus.bus
      processor: !system/local-ref command-processor-impl
      command-channel: !keyword schemes-payment-command
      command-response-channel: !keyword schemes-payment-command-response
    # The changelog relay for clearbank-outbox lives in relay-service —
    # a cursor has exactly one owner, and pinning it here would pin this
    # whole service to replicas: 1.
    outbound-runner: !system/component
      system/component-kind: clearbank-relay/outbound-runner
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
      clearbank-url: !env CLEARBANK_SIMULATOR_URL
  clearbank-adapter-server:
    handler: !system/required-component
    interceptors: !system/component
      system/component-kind: server/interceptors
      bus: !system/ref message-bus.bus
      avro: !system/ref avro.serde
      event-channel: !keyword schemes-payments-event
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
      clearbank-url: !env CLEARBANK_SIMULATOR_URL
    jetty-adapter: !system/component
      system/component-kind: server/jetty-adapter
      handler: !system/ref clearbank-adapter-server.handler
      interceptors: !system/ref clearbank-adapter-server.interceptors
      ready-fn: !system/ref clearbank-adapter.readiness
      options:
        port: 8082
    http-url: !system/component
      system/component-kind: server/http-url
      jetty-adapter: !system/local-ref jetty-adapter
