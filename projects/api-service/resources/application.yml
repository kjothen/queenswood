system:
  pulsar:
    client: !system/component
      system/component-kind: pulsar/client
      service-url: !env PULSAR_SERVICE_URL
    admin: !system/component
      system/component-kind: pulsar/admin
      service-http-url: !env PULSAR_ADMIN_URL
    schemas: !system/component
      system/component-kind: pulsar/schemas
      command:
        schema: schemas/command/command-envelope.avsc.json
        type: AVRO
      command-response:
        schema: schemas/command/command-response.avsc.json
        type: AVRO
      event:
        schema: schemas/event/event-envelope.avsc.json
        type: AVRO
    producers: !system/component
      system/component-kind: pulsar/producers
      banks-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-banks-command"
        schemas: !system/local-ref schemas
      cash-accounts-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-cash-accounts-command"
        schemas: !system/local-ref schemas
      cash-account-products-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-cash-account-products-command"
        schemas: !system/local-ref schemas
      parties-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-parties-command"
        schemas: !system/local-ref schemas
      payments-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-payments-command"
        schemas: !system/local-ref schemas
      transactions-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-transactions-command"
        schemas: !system/local-ref schemas
      interest-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-interest-command"
        schemas: !system/local-ref schemas
      payee-checks-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-payee-checks-command"
        schemas: !system/local-ref schemas
    consumers: !system/component
      system/component-kind: pulsar/consumers
      banks-command-response:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: api-service-banks-command-response
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-banks-command-response"]
        schemas: !system/local-ref schemas
      cash-accounts-command-response:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: api-service-cash-accounts-command-response
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-cash-accounts-command-response"]
        schemas: !system/local-ref schemas
      cash-account-products-command-response:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: api-service-cash-account-products-command-response
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-cash-account-products-command-response"]
        schemas: !system/local-ref schemas
      parties-command-response:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: api-service-parties-command-response
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-parties-command-response"]
        schemas: !system/local-ref schemas
      payments-command-response:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: api-service-payments-command-response
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-payments-command-response"]
        schemas: !system/local-ref schemas
      transactions-command-response:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: api-service-transactions-command-response
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-transactions-command-response"]
        schemas: !system/local-ref schemas
      interest-command-response:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: api-service-interest-command-response
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-interest-command-response"]
        schemas: !system/local-ref schemas
      payee-checks-command-response:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: api-service-payee-checks-command-response
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-payee-checks-command-response"]
        schemas: !system/local-ref schemas
    message-bus-producers: !system/component
      system/component-kind: pulsar/message-bus-producers
      banks-command:
        producer: !system/local-ref producers.banks-command
      cash-accounts-command:
        producer: !system/local-ref producers.cash-accounts-command
      cash-account-products-command:
        producer: !system/local-ref producers.cash-account-products-command
      parties-command:
        producer: !system/local-ref producers.parties-command
      payments-command:
        producer: !system/local-ref producers.payments-command
      transactions-command:
        producer: !system/local-ref producers.transactions-command
      interest-command:
        producer: !system/local-ref producers.interest-command
      payee-checks-command:
        producer: !system/local-ref producers.payee-checks-command
    message-bus-consumers: !system/component
      system/component-kind: pulsar/message-bus-consumers
      banks-command-response:
        consumer: !system/local-ref consumers.banks-command-response
      cash-accounts-command-response:
        consumer: !system/local-ref consumers.cash-accounts-command-response
      cash-account-products-command-response:
        consumer: !system/local-ref consumers.cash-account-products-command-response
      parties-command-response:
        consumer: !system/local-ref consumers.parties-command-response
      payments-command-response:
        consumer: !system/local-ref consumers.payments-command-response
      transactions-command-response:
        consumer: !system/local-ref consumers.transactions-command-response
      interest-command-response:
        consumer: !system/local-ref consumers.interest-command-response
      payee-checks-command-response:
        consumer: !system/local-ref consumers.payee-checks-command-response
  message-bus: !include bank/message-bus.yml
  fdb: !include bank/fdb.yml
  avro: !include bank/avro.yml
  keycloak:
    identity-provider: !system/component
      system/component-kind: keycloak/identity-provider
      base-url: !env KEYCLOAK_BASE_URL
      realm: !env KEYCLOAK_REALM
      admin-client-id: !env KEYCLOAK_ADMIN_CLIENT_ID
      admin-client-secret: !env KEYCLOAK_ADMIN_CLIENT_SECRET
      # Override the iss claim the verifier expects when base-url is
      # an in-cluster Service URL but Keycloak embeds its public
      # hostname in tokens (the deployed shape -- see ADR-TBD).
      expected-issuer: !env KEYCLOAK_EXPECTED_ISSUER
    # Operator realm — hosts the queenswood-app SPA users
    # (operator SPA). Same Keycloak instance, different realm; only used
    # for JWT verification.
    identity-provider-ops: !system/component
      system/component-kind: keycloak/identity-provider
      base-url: !env KEYCLOAK_BASE_URL
      realm: !env KEYCLOAK_OPS_REALM
      admin-client-id: !env KEYCLOAK_ADMIN_CLIENT_ID
      admin-client-secret: !env KEYCLOAK_ADMIN_CLIENT_SECRET
      expected-issuer: !env KEYCLOAK_OPS_EXPECTED_ISSUER
  banks:
    dispatcher: !system/component
      system/component-kind: command/dispatcher
      bus: !system/ref message-bus.bus
      command-channel: !keyword banks-command
      command-response-channel: !keyword banks-command-response
  cash-accounts:
    dispatcher: !system/component
      system/component-kind: command/dispatcher
      bus: !system/ref message-bus.bus
      command-channel: !keyword cash-accounts-command
      command-response-channel: !keyword cash-accounts-command-response
  cash-account-products:
    dispatcher: !system/component
      system/component-kind: command/dispatcher
      bus: !system/ref message-bus.bus
      command-channel: !keyword cash-account-products-command
      command-response-channel: !keyword cash-account-products-command-response
  parties:
    dispatcher: !system/component
      system/component-kind: command/dispatcher
      bus: !system/ref message-bus.bus
      command-channel: !keyword parties-command
      command-response-channel: !keyword parties-command-response
  payments:
    dispatcher: !system/component
      system/component-kind: command/dispatcher
      bus: !system/ref message-bus.bus
      command-channel: !keyword payments-command
      command-response-channel: !keyword payments-command-response
  transactions:
    dispatcher: !system/component
      system/component-kind: command/dispatcher
      bus: !system/ref message-bus.bus
      command-channel: !keyword transactions-command
      command-response-channel: !keyword transactions-command-response
  interest:
    dispatcher: !system/component
      system/component-kind: command/dispatcher
      bus: !system/ref message-bus.bus
      command-channel: !keyword interest-command
      command-response-channel: !keyword interest-command-response
  payee-checks:
    dispatcher: !system/component
      system/component-kind: command/dispatcher
      bus: !system/ref message-bus.bus
      command-channel: !keyword payee-checks-command
      command-response-channel: !keyword payee-checks-command-response
  telemetry:
    otel-sdk: !system/component
      system/component-kind: telemetry/otel-sdk
      service-name: !env SERVICE_NAME
      endpoint: !env OTEL_ENDPOINT
  server:
    handler: !system/required-component
    interceptors: !system/component
      system/component-kind: server/interceptors
      identity-provider: !system/ref keycloak.identity-provider
      # All identity-provider instances the auth interceptor may use
      # to verify an incoming JWT. The interceptor extracts the
      # unverified `iss`, picks the matching provider, then verifies.
      identity-providers:
        - !system/ref keycloak.identity-provider
        - !system/ref keycloak.identity-provider-ops
      expected-audiences:
        - queenswood-api-test
        - queenswood-api-live
        # SPA user JWTs carry the public client id as aud (the audience
        # mapper points the client at itself).
        - queenswood-console
        - queenswood-app
      # Public client ids whose JWTs the auth interceptor treats as
      # user JWTs (azp == one of these). Anything else is a service
      # JWT keyed by azp == bank-id.
      user-client-ids:
        - queenswood-console
        - queenswood-app
      # Banking-specific status → audience mapping. Both values are
      # realm-import scope names that carry an `oidc-audience-mapper`.
      audiences-by-status:
        bank-status-test: queenswood-api-test
        bank-status-live: queenswood-api-live
      dispatchers:
        banks: !system/ref banks.dispatcher
        cash-accounts: !system/ref cash-accounts.dispatcher
        cash-account-products: !system/ref cash-account-products.dispatcher
        parties: !system/ref parties.dispatcher
        payments: !system/ref payments.dispatcher
        interest: !system/ref interest.dispatcher
        transactions: !system/ref transactions.dispatcher
        payee-checks: !system/ref payee-checks.dispatcher
      avro: !system/ref avro.serde
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
      companies-house-url: !env COMPANIES_HOUSE_URL
    jetty-adapter: !system/component
      system/component-kind: server/jetty-adapter
      handler: !system/ref server.handler
      interceptors: !system/ref server.interceptors
      options:
        port: 8080
