system:
  # Channel-based in-process message bus (core.async) — the monolith
  # replaces Pulsar with a LocalProducer/LocalConsumer per channel,
  # so the only external infra is FDB + Keycloak/Postgres. Channel
  # names mirror the Pulsar topic set the microservice deploy uses.
  message-bus:
    bus: !system/component
      system/component-kind: message-bus/local-bus
      channels:
        - banks-command
        - banks-command-response
        - cash-accounts-command
        - cash-accounts-command-response
        - cash-account-products-command
        - cash-account-products-command-response
        - parties-command
        - parties-command-response
        - transactions-command
        - transactions-command-response
        - payments-command
        - payments-command-response
        - interest-command
        - interest-command-response
        - schemes-payments-event
        - cash-accounts-event
        - schemes-payment-command
        - schemes-payment-command-response
        - idv-command
        - idv-command-response
        - company-registries-command
        - company-registries-command-response
        - idv-event
        - payee-checks-command
        - payee-checks-command-response
  fdb: !include system/fdb.yml
  avro: !include system/avro.yml
  keycloak:
    identity-provider: !system/component
      system/component-kind: keycloak/identity-provider
      base-url: !env KEYCLOAK_BASE_URL
      realm: !env KEYCLOAK_REALM
      admin-client-id: !env KEYCLOAK_ADMIN_CLIENT_ID
      admin-client-secret: !env KEYCLOAK_ADMIN_CLIENT_SECRET
      expected-issuer: !env KEYCLOAK_EXPECTED_ISSUER
    identity-provider-ops: !system/component
      system/component-kind: keycloak/identity-provider
      base-url: !env KEYCLOAK_BASE_URL
      realm: !env KEYCLOAK_OPS_REALM
      admin-client-id: !env KEYCLOAK_ADMIN_CLIENT_ID
      admin-client-secret: !env KEYCLOAK_ADMIN_CLIENT_SECRET
      expected-issuer: !env KEYCLOAK_OPS_EXPECTED_ISSUER
  banks: !include system/bank.yml
  cash-accounts: !include system/cash-account.yml
  cash-account-products: !include system/cash-account-product.yml
  parties: !include system/party.yml
  payments: !include system/payment.yml
  interest: !include system/interest.yml
  transactions: !include system/transaction.yml
  idv: !include system/idv.yml
  payee-checks: !include system/payee-check.yml
  policies: !include system/policy.yml
  templates: !include system/templates.yml
  scheduler:
    scheduler: !system/component
      system/component-kind: scheduler/scheduler
  bank-scheduler:
    runner: !system/component
      system/component-kind: bank-scheduler/runner
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
      schemas: !system/ref avro.serde
      scheduler: !system/ref scheduler.scheduler
  telemetry:
    otel-sdk: !system/component
      system/component-kind: telemetry/otel-sdk
      service-name: !env SERVICE_NAME
      endpoint: !env OTEL_ENDPOINT
  server:
    handler: !system/required-component
    interceptors: !system/component
      system/component-kind: server/interceptors
      identity-provider: !system/ref keycloak.identity-provider
      identity-providers:
        - !system/ref keycloak.identity-provider
        - !system/ref keycloak.identity-provider-ops
      expected-audiences:
        - queenswood-api-test
        - queenswood-api-live
        - queenswood-console
        - queenswood-app
      user-client-ids:
        - queenswood-console
        - queenswood-app
      audiences-by-status:
        bank-status-test: queenswood-api-test
        bank-status-live: queenswood-api-live
      dispatchers:
        banks: !system/ref banks.dispatcher
        cash-accounts: !system/ref cash-accounts.dispatcher
        cash-account-products: !system/ref cash-account-products.dispatcher
        parties: !system/ref parties.dispatcher
        payments: !system/ref payments.dispatcher
        interest: !system/ref interest.dispatcher
        transactions: !system/ref transactions.dispatcher
        payee-checks: !system/ref payee-checks.dispatcher
        company-registries: !system/ref company-registries.dispatcher
      avro: !system/ref avro.serde
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
    jetty-adapter: !system/component
      system/component-kind: server/jetty-adapter
      handler: !system/ref server.handler
      interceptors: !system/ref server.interceptors
      options:
        port: 8080
  clearbank-simulator-server: !include monolith/clearbank-simulator.yml
  clearbank-adapter-server: !include monolith/clearbank-adapter-server.yml
  clearbank-adapter: !include monolith/clearbank-adapter.yml
  onfido-simulator-server: !include monolith/onfido-simulator.yml
  onfido-adapter-server: !include monolith/onfido-adapter-server.yml
  onfido-adapter: !include monolith/onfido-adapter.yml
  companies-house-server: !include monolith/companies-house-simulator.yml
  company-registries: !include monolith/uk-companies-house-adapter.yml
