system:
  pulsar:
    client: !system/component
      system/component-kind: pulsar/client
      service-url: !env PULSAR_SERVICE_URL
    admin: !system/component
      system/component-kind: pulsar/admin
      service-http-url: !env PULSAR_ADMIN_URL
    schemas: !system/component
      system/component-kind: pulsar/schemas
      command:
        schema: schemas/command/command-envelope.avsc.json
        type: AVRO
      command-response:
        schema: schemas/command/command-response.avsc.json
        type: AVRO
      event:
        schema: schemas/event/event-envelope.avsc.json
        type: AVRO
    producers: !system/component
      system/component-kind: pulsar/producers
      payments-command-response:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command-response
          topicName: "persistent://tenant-1/namespace-1/topic-payments-command-response"
        schemas: !system/local-ref schemas
      schemes-payment-command:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command
          topicName: "persistent://tenant-1/namespace-1/topic-schemes-payment-command"
        schemas: !system/local-ref schemas
      transactions-command-response:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command-response
          topicName: "persistent://tenant-1/namespace-1/topic-transactions-command-response"
        schemas: !system/local-ref schemas
      interest-command-response:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command-response
          topicName: "persistent://tenant-1/namespace-1/topic-interest-command-response"
        schemas: !system/local-ref schemas
      payee-checks-command-response:
        client: !system/local-ref client
        conf:
          accessMode: !pulsar/access-mode Shared
          schema: !keyword command-response
          topicName: "persistent://tenant-1/namespace-1/topic-payee-checks-command-response"
        schemas: !system/local-ref schemas
    consumers: !system/component
      system/component-kind: pulsar/consumers
      # Subscription names are carried over verbatim from the absorbed
      # per-processor services so the combined pod resumes their
      # cursors (see docs/adr/0019-processor-packaging.md).
      payments-command:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: bank-payment-service-payments-command
          subscriptionType: !pulsar/subscription-type Shared
          deadLetterPolicy:
            maxRedeliverCount: 5
            deadLetterTopic: "persistent://tenant-1/namespace-1/topic-payments-command-dlq"
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-payments-command"]
        schemas: !system/local-ref schemas
      schemes-payments-event:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: bank-payment-service-schemes-payments-event
          subscriptionType: !pulsar/subscription-type Shared
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-schemes-payments-event"]
        schemas: !system/local-ref schemas
      transactions-command:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: bank-transaction-service-transactions-command
          subscriptionType: !pulsar/subscription-type Shared
          deadLetterPolicy:
            maxRedeliverCount: 5
            deadLetterTopic: "persistent://tenant-1/namespace-1/topic-transactions-command-dlq"
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-transactions-command"]
        schemas: !system/local-ref schemas
      interest-command:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: bank-interest-service-interest-command
          subscriptionType: !pulsar/subscription-type Shared
          deadLetterPolicy:
            maxRedeliverCount: 5
            deadLetterTopic: "persistent://tenant-1/namespace-1/topic-interest-command-dlq"
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-interest-command"]
        schemas: !system/local-ref schemas
      payee-checks-command:
        client: !system/local-ref client
        conf:
          cryptoFailureAction: !pulsar/crypto-failure-action CONSUME
          schema: !pulsar/schema AUTO_CONSUME
          subscriptionName: bank-payee-check-service-payee-checks-command
          subscriptionType: !pulsar/subscription-type Shared
          deadLetterPolicy:
            maxRedeliverCount: 5
            deadLetterTopic: "persistent://tenant-1/namespace-1/topic-payee-checks-command-dlq"
          topicNames:
            ["persistent://tenant-1/namespace-1/topic-payee-checks-command"]
        schemas: !system/local-ref schemas
    message-bus-producers: !system/component
      system/component-kind: pulsar/message-bus-producers
      payments-command-response:
        producer: !system/local-ref producers.payments-command-response
      schemes-payment-command:
        producer: !system/local-ref producers.schemes-payment-command
      transactions-command-response:
        producer: !system/local-ref producers.transactions-command-response
      interest-command-response:
        producer: !system/local-ref producers.interest-command-response
      payee-checks-command-response:
        producer: !system/local-ref producers.payee-checks-command-response
    message-bus-consumers: !system/component
      system/component-kind: pulsar/message-bus-consumers
      payments-command:
        consumer: !system/local-ref consumers.payments-command
      schemes-payments-event:
        consumer: !system/local-ref consumers.schemes-payments-event
      transactions-command:
        consumer: !system/local-ref consumers.transactions-command
      interest-command:
        consumer: !system/local-ref consumers.interest-command
      payee-checks-command:
        consumer: !system/local-ref consumers.payee-checks-command
  message-bus: !include bank/message-bus.yml
  fdb: !include bank/fdb.yml
  avro: !include bank/avro.yml
  payments: !include bank/payment.yml
  transactions: !include bank/transaction.yml
  interest: !include bank/interest.yml
  payee-checks: !include bank/payee-check.yml
  telemetry:
    otel-sdk: !system/component
      system/component-kind: telemetry/otel-sdk
      service-name: !env SERVICE_NAME
      endpoint: !env OTEL_ENDPOINT
