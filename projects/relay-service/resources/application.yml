system:
  fdb: !include system/fdb.yml
  kafka:
    schemas: !system/component
      system/component-kind: avro/serde
      schemas:
        event: schemas/event/event-envelope.avsc.json
    producers: !system/component
      system/component-kind: kafka/producers
      cash-accounts-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-cash-accounts-event
          acks: all
      idv-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-idv-event
          acks: all
      schemes-payments-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-schemes-payments-event
          acks: all
    message-bus-producers: !system/component
      system/component-kind: kafka/message-bus-producers
      cash-accounts-event:
        producer: !system/local-ref producers.cash-accounts-event
      idv-event:
        producer: !system/local-ref producers.idv-event
      schemes-payments-event:
        producer: !system/local-ref producers.schemes-payments-event
    # The relay only produces. `message-bus/bus` requires a consumers
    # map, so this is declared empty rather than omitted.
    message-bus-consumers: !system/component
      system/component-kind: kafka/message-bus-consumers
  message-bus: !include system/message-bus.yml
  relay:
    # Every store writes the shared envelope, so one handler kind
    # decodes them all and republishes the payload verbatim. The outbox
    # protos reuse ChangelogEvent's field numbers, so their entries
    # decode as one too. Handlers are named for the domain they carry;
    # nothing about them is vendor-specific any more.
    cash-accounts-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword cash-accounts-event
      store-name: cash-accounts
    idv-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword idv-event
      store-name: onfido-outbox
    schemes-payments-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword schemes-payments-event
      store-name: clearbank-outbox
    # Keyed by store, because a cursor belongs to a store. `store-name`
    # and `consumer-id` are physical: the ids are carried over verbatim
    # from the watchers these replaced, and a fresh one would restart
    # from no checkpoint and rescan the whole changelog in a single
    # transaction (ADR-0019 cursor continuity).
    runners: !system/component
      system/component-kind: changelog-relay/runners
      cash-accounts:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: cash-account-watcher
        store-name: cash-accounts
        handler: !system/local-ref cash-accounts-handler
      clearbank-outbox:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: clearbank-relay
        store-name: clearbank-outbox
        handler: !system/local-ref schemes-payments-handler
      onfido-outbox:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: onfido-relay
        store-name: onfido-outbox
        handler: !system/local-ref idv-handler
  telemetry: !include system/telemetry.yml
