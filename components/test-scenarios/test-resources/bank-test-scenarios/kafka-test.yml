# Kafka testcontainer wiring: broker, admin, topics, avro schemas,
# producers, consumers and the message-bus records built from them.
# Values are Avro-serialised by the `avro` brick, so `schemas` is the
# same serde every transport uses -- there is no schema registry.

container: !system/component
  system/component-kind: kafka/container
  exposed-ports: [9092]

bootstrap-servers: !system/component
  system/component-kind: kafka/bootstrap-servers
  container: !system/local-ref container

admin: !system/component
  system/component-kind: kafka/admin
  bootstrap-servers: !system/local-ref bootstrap-servers

schemas: !system/component
  system/component-kind: avro/serde
  schemas:
    command: schemas/command/command-envelope.avsc.json
    command-response: schemas/command/command-response.avsc.json
    event: schemas/event/event-envelope.avsc.json

topics: !system/component
  system/component-kind: kafka/topics
  admin: !system/local-ref admin
  topics:
    - topic: topic-idv-command
      partitions: 1
    - topic: topic-idv-command-response
      partitions: 1
    - topic: topic-idv-event
      partitions: 1
    - topic: topic-schemes-payment-command
      partitions: 1
    - topic: topic-schemes-payment-command-response
      partitions: 1
    - topic: topic-schemes-payments-event
      partitions: 1
    - topic: topic-idv-command-dlq
      partitions: 1
    - topic: topic-schemes-payment-command-dlq
      partitions: 1

producers: !system/component
  system/component-kind: kafka/producers
  idv-command:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword command
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      topic: topic-idv-command
      acks: all
  idv-command-response:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword command-response
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      topic: topic-idv-command-response
      acks: all
  idv-event:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword event
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      topic: topic-idv-event
      acks: all
  schemes-payment-command:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword command
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      topic: topic-schemes-payment-command
      acks: all
  schemes-payment-command-response:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword command-response
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      topic: topic-schemes-payment-command-response
      acks: all
  schemes-payments-event:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword event
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      topic: topic-schemes-payments-event
      acks: all
  idv-command-dlq:
    _: !system/local-ref topics
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      topic: topic-idv-command-dlq
      acks: all
  schemes-payment-command-dlq:
    _: !system/local-ref topics
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      topic: topic-schemes-payment-command-dlq
      acks: all

consumers: !system/component
  system/component-kind: kafka/consumers
  idv-command:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword command
    topics: [topic-idv-command]
    dead-letter-producer: !system/local-ref producers.idv-command-dlq
    max-redeliveries: 5
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: bank-test-scenarios-idv-command
  idv-command-response:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword command-response
    topics: [topic-idv-command-response]
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: bank-test-scenarios-idv-command-response
  idv-event:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword event
    topics: [topic-idv-event]
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: bank-test-scenarios-idv-event
  schemes-payment-command:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword command
    topics: [topic-schemes-payment-command]
    dead-letter-producer: !system/local-ref producers.schemes-payment-command-dlq
    max-redeliveries: 5
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: bank-test-scenarios-schemes-payment-command
  schemes-payment-command-response:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword command-response
    topics: [topic-schemes-payment-command-response]
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: bank-test-scenarios-schemes-payment-command-response
  schemes-payments-event:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword event
    topics: [topic-schemes-payments-event]
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: bank-test-scenarios-schemes-payments-event

message-bus-producers: !system/component
  system/component-kind: kafka/message-bus-producers
  idv-command:
    producer: !system/local-ref producers.idv-command
  idv-command-response:
    producer: !system/local-ref producers.idv-command-response
  idv-event:
    producer: !system/local-ref producers.idv-event
  schemes-payment-command:
    producer: !system/local-ref producers.schemes-payment-command
  schemes-payment-command-response:
    producer: !system/local-ref producers.schemes-payment-command-response
  schemes-payments-event:
    producer: !system/local-ref producers.schemes-payments-event

message-bus-consumers: !system/component
  system/component-kind: kafka/message-bus-consumers
  idv-command:
    consumer: !system/local-ref consumers.idv-command
    timeout: 500
  idv-command-response:
    consumer: !system/local-ref consumers.idv-command-response
    timeout: 500
  idv-event:
    consumer: !system/local-ref consumers.idv-event
    timeout: 500
  schemes-payment-command:
    consumer: !system/local-ref consumers.schemes-payment-command
    timeout: 500
  schemes-payment-command-response:
    consumer: !system/local-ref consumers.schemes-payment-command-response
    timeout: 500
  schemes-payments-event:
    consumer: !system/local-ref consumers.schemes-payments-event
    timeout: 500
