system:
  pulsar: !include bank-test-api-scenarios/pulsar-test.yml
  message-bus: !include bank-test-api-scenarios/message-bus-test.yml
  fdb: !include bank/fdb-test.yml
  avro: !include avro/avro-test.yml
  keycloak: !include bank/keycloak-test.yml
  policies: !include bank/policy-test.yml
  templates: !include bank/templates-test.yml
  idv: !include bank/idv-test.yml
  parties: !include bank-test-api-scenarios/party-test.yml
  cash-accounts: !include bank/cash-account-test.yml
  payments: !include bank/payment-test.yml
  interest: !include bank/interest-test.yml
  transactions: !include bank/transaction-test.yml
  onfido-simulator-server: !include bank-test-api-scenarios/onfido-simulator-test.yml
  onfido-adapter-server: !include bank-test-api-scenarios/onfido-adapter-server-test.yml
  onfido-adapter: !include bank-test-api-scenarios/onfido-adapter-test.yml
  clearbank-simulator-server: !include bank-test-api-scenarios/clearbank-simulator-test.yml
  clearbank-adapter-server: !include bank-test-api-scenarios/clearbank-adapter-server-test.yml
  companies-house-simulator-server: !include bank-test-api-scenarios/companies-house-simulator-test.yml
  clearbank-adapter: !include bank-test-api-scenarios/clearbank-adapter-test.yml
  server:
    handler: !system/required-component
    interceptors: !system/component
      system/component-kind: server/interceptors
      identity-provider: !system/ref keycloak.identity-provider
      # API-scenario tests only ever mint service JWTs from the orgs
      # realm; the ops identity-provider is wired alongside so the
      # auth dispatch logic stays uniform with bank-api-service and
      # bank-monolith.
      identity-providers:
        - !system/ref keycloak.identity-provider
        - !system/ref keycloak.identity-provider-ops
      expected-audiences:
        - queenswood-api-test
        - queenswood-api-live
        - queenswood-console
        - queenswood-app
      user-client-ids:
        - queenswood-console
        - queenswood-app
      audiences-by-status:
        bank-status-test: queenswood-api-test
        bank-status-live: queenswood-api-live
      dispatchers:
        parties: !system/ref parties.dispatcher
        cash-accounts: !system/ref cash-accounts.dispatcher
        payments: !system/ref payments.dispatcher
        interest: !system/ref interest.dispatcher
        transactions: !system/ref transactions.dispatcher
      avro: !system/ref avro.serde
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
      clearbank-adapter-url: !system/ref clearbank-adapter-server.http-url
      companies-house-url: !system/ref companies-house-simulator-server.http-url
    jetty-adapter: !system/component
      system/component-kind: server/jetty-adapter
      handler: !system/ref server.handler
      interceptors: !system/ref server.interceptors
      options:
        port: 0
