processor: !system/component
  system/component-kind: cash-account/processor
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  schemas: !system/ref avro.serde
event-processor-impl: !system/component
  system/component-kind: cash-account/event-processor
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  schemas: !system/ref avro.serde
event-consumer: !system/component
  system/component-kind: changelog-relay/event-consumer
  bus: !system/ref message-bus.bus
  processor: !system/local-ref event-processor-impl
  event-channel: !keyword cash-accounts-event
relay-handler: !system/component
  system/component-kind: changelog-relay/envelope-handler
  bus: !system/ref message-bus.bus
  event-channel: !keyword cash-accounts-event
  store-name: cash-accounts
relay-runners: !system/component
  system/component-kind: changelog-relay/runners
  cash-accounts:
    record-db: !system/ref fdb.record-db
    consumer-id: cash-account-watcher
    store-name: cash-accounts
    handler: !system/local-ref relay-handler
