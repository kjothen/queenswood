- kind:
    cash-account-migration:
      filters:
        - action: !keyword cash-account-migration-action-commit
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 100
              window: !keyword time-window-instant
  reason: "Micro tier - a migration may move at most 100 accounts"
- kind:
    cash-account-migration:
      filters:
        - action: !keyword cash-account-migration-action-preview
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 10
              window: !keyword time-window-daily
  reason: "Micro tier - at most 10 migration previews per day"
