processor: !system/component
  system/component-kind: party/processor
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  schemas: !system/ref avro.serde

command-processor: !system/component
  system/component-kind: command-processor/command-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref processor
  command-channel: !keyword parties-command
  command-response-channel: !keyword parties-command-response

idv-event-processor-impl: !system/component
  system/component-kind: party/idv-event-processor
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  schemas: !system/ref avro.serde

# `changelog-relay/event-consumer` rather than
# `event-processor/event-processor`: activating a party is a lifecycle
# transition, and mono's `event/process` acks on anomaly, so a failure
# would lose it.
idv-event-consumer: !system/component
  system/component-kind: changelog-relay/event-consumer
  bus: !system/ref message-bus.bus
  processor: !system/local-ref idv-event-processor-impl
  event-channel: !keyword idvs-event
