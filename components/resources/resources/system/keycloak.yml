identity-provider: !system/component
  system/component-kind: keycloak/identity-provider
  base-url: !profile
    dev: !system/ref keycloak-container.container-auth-server-url
    test: !system/ref keycloak-container.container-auth-server-url
    default: !env KEYCLOAK_BASE_URL
  realm: !profile
    dev: queenswood
    test: queenswood
    default: !env KEYCLOAK_REALM
  admin-client-id: !profile
    dev: queenswood-admin
    test: queenswood-admin
    default: !env KEYCLOAK_ADMIN_CLIENT_ID
  # Local + tests stay on client_secret against an ephemeral
  # testcontainer realm. Deployed uses private_key_jwt: a key file
  # rather than the PEM inline, because a multi-line PEM does not
  # survive an environment variable intact.
  admin-client-secret: !profile
    dev: queenswood-admin-test-secret
    test: queenswood-admin-test-secret
    default: ~
  admin-client-private-key-file: !profile
    dev: ~
    test: ~
    default: !env KEYCLOAK_ADMIN_CLIENT_PRIVATE_KEY_FILE
  expected-issuer: !profile
    dev: ~
    test: ~
    default: !env KEYCLOAK_EXPECTED_ISSUER

