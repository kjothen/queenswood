admin: !system/component
  system/component-kind: pulsar/admin
  service-http-url: !env PULSAR_ADMIN_URL

schemas: !system/component
  system/component-kind: pulsar/schemas
  command:
    schema: schemas/command/command-envelope.avsc.json
    type: AVRO
  command-response:
    schema: schemas/command/command-response.avsc.json
    type: AVRO
  event:
    schema: schemas/event/event-envelope.avsc.json
    type: AVRO

tenants: !system/component
  system/component-kind: pulsar/tenants
  admin: !system/local-ref admin
  tenants:
    - tenant: tenant-1
      clusters:
        - !env PULSAR_CLUSTER
      roles: []

namespaces: !system/component
  system/component-kind: pulsar/namespaces
  _: !system/local-ref tenants
  admin: !system/local-ref admin
  namespaces:
    - namespace: "tenant-1/namespace-1"
      config:
        post:
          autoTopicCreation:
            allowAutoTopicCreation: false
            defaultNumPartitions: 1
            topicType: string
          isAllowAutoUpdateSchema: false
          schemaValidationEnforced: true
        put:
          schemaCompatibilityStrategy: FULL

topics: !system/component
  system/component-kind: pulsar/topics
  _: !system/local-ref namespaces
  admin: !system/local-ref admin
  schemas: !system/local-ref schemas
  topics:
    - topic: "persistent://tenant-1/namespace-1/topic-cash-accounts-command"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-cash-accounts-command-dlq"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-cash-accounts-command-response"
      partitions: 1
      schema: !keyword command-response
    - topic: "persistent://tenant-1/namespace-1/topic-parties-command"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-parties-command-dlq"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-parties-command-response"
      partitions: 1
      schema: !keyword command-response
    - topic: "persistent://tenant-1/namespace-1/topic-transactions-command"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-transactions-command-dlq"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-transactions-command-response"
      partitions: 1
      schema: !keyword command-response
    - topic: "persistent://tenant-1/namespace-1/topic-payments-command"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-payments-command-dlq"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-payments-command-response"
      partitions: 1
      schema: !keyword command-response
    - topic: "persistent://tenant-1/namespace-1/topic-interest-command"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-interest-command-dlq"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-interest-command-response"
      partitions: 1
      schema: !keyword command-response
    - topic: "persistent://tenant-1/namespace-1/topic-schemes-payments-event"
      partitions: 1
      schema: !keyword event
    - topic: "persistent://tenant-1/namespace-1/topic-schemes-payment-command"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-schemes-payment-command-dlq"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-schemes-payment-command-response"
      partitions: 1
      schema: !keyword command-response
    - topic: "persistent://tenant-1/namespace-1/topic-idv-command"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-idv-command-dlq"
      partitions: 1
      schema: !keyword command
    - topic: "persistent://tenant-1/namespace-1/topic-idv-command-response"
      partitions: 1
      schema: !keyword command-response
    - topic: "persistent://tenant-1/namespace-1/topic-idv-event"
