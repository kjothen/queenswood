syntax = "proto2";

package com.repldriven.queenswood.schemas.balances;

import "record_metadata_options.proto";
import "schemas/types/product-type.proto";

option java_outer_classname = "BalanceProto";

enum BalanceType {
  BALANCE_TYPE_UNKNOWN = 0;
  BALANCE_TYPE_DEFAULT = 1;
  BALANCE_TYPE_INTEREST_ACCRUED = 2;
  BALANCE_TYPE_INTEREST_PAID = 3;
  BALANCE_TYPE_PURCHASE = 4;
  BALANCE_TYPE_CASH = 5;
  BALANCE_TYPE_SUSPENSE = 6;
  BALANCE_TYPE_INTEREST_PAYABLE = 7;
}

enum BalanceStatus {
  BALANCE_STATUS_UNKNOWN = 0;
  BALANCE_STATUS_POSTED = 1;
  BALANCE_STATUS_PENDING_INCOMING = 2;
  BALANCE_STATUS_PENDING_OUTGOING = 3;
}

message Balance {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  // Heads the primary key so a bank's balances scan contiguously, the
  // same way its cash accounts already do. Without it the interest
  // pass has to scan every bank's balances and discard the ones it
  // does not own, because a bank-scoped scan is not expressible.
  //
  // Required, and safely so — a bank id is never the empty string that
  // protojure would drop from the wire and the Java parse would then
  // reject.
  required string bank_id = 11;

  required string account_id = 1;
  // Every balance declares its account kind: a customer sub-ledger type,
  // or PRODUCT_TYPE_GENERAL_LEDGER for the bank's own books (CoA rows).
  // The domain requires it on create; read sites discriminate on it
  // directly rather than inferring "GL" from an absent value. Kept
  // optional at the wire level only for record compatibility.
  optional com.repldriven.queenswood.schemas.types.ProductType product_type = 2;
  required BalanceType balance_type = 3;
  required BalanceStatus balance_status = 4;
  required string currency = 5;
  optional int64 credit = 6;
  optional int64 debit = 7;
  optional int64 credit_carry = 8;
  required int64 created_at = 9;
  required int64 updated_at = 10;
}

message BalanceProduct {
  required BalanceType balance_type = 1;
  required BalanceStatus balance_status = 2;
}
