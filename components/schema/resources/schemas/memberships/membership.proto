syntax = "proto2";

package com.repldriven.queenswood.schemas.memberships;

import "record_metadata_options.proto";

option java_outer_classname = "MembershipProto";

// Membership -- joins a User to a Bank with a role.
// Designed for N:M (a User can join many Orgs) but the MVP only
// creates ROLE_OWNER memberships from the onboarding flow.
// Additional roles (admin/developer/viewer) reserved for future use.
enum Role {
  ROLE_UNKNOWN = 0;
  ROLE_OWNER = 1;
  // ROLE_ADMIN = 2;     -- reserved for future
  // ROLE_DEVELOPER = 3; -- reserved for future
  // ROLE_VIEWER = 4;    -- reserved for future
}

message Membership {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string membership_id = 1 [(com.apple.foundationdb.record.field).primary_key = true];
  required string user_id = 2;
  required string bank_id = 3;
  required Role role = 4;
  required int64 created_at = 5;
  required int64 updated_at = 6;
}
