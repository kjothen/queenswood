!strs
balances:
  record-type: Balance
  primary-key: [account_id, balance_type, currency, balance_status]
  indexes: []
cash-account-products:
  record-type: CashAccountProduct
  primary-key: [organization_id, product_id, version_id]
  indexes:
    - name: CashAccountProduct_count_by_org
      fields: [organization_id, product_id]
      type: count
cash-accounts:
  record-type: CashAccount
  primary-key: [organization_id, account_id]
  indexes:
    - name: CashAccount_by_org_product_type
      fields: [organization_id, product_type]
    - name: CashAccount_count_by_org
      field: organization_id
      type: count
    - name: CashAccount_count_by_org_product_account_type_currency
      fields: [organization_id, product_type, account_type, currency]
      type: count
    - name: CashAccount_by_bban
      field: bban
idempotency:
  record-type: Idempotency
  primary-key: [principal_id, operation, idempotency_key]
  indexes: []
idvs:
  record-type: Idv
  primary-key: [organization_id, verification_id]
  indexes:
    - name: Idv_by_party
      field: party_id
      unique: true
organizations:
  record-type: Organization
  indexes:
    - name: Organization_by_type
      field: type
    - name: Organization_count_by_type
      field: type
      type: count
payee-checks:
  record-type: PayeeCheck
  primary-key: [organization_id, check_id]
  indexes: []
parties:
  record-type: Party
  primary-key: [organization_id, party_id]
  indexes: []
party-national-identifiers:
  record-type: PartyNationalIdentifier
  primary-key: [party_id, type]
  indexes:
    - name: org_type_value_unique_idx
      fields: [organization_id, type, value]
      unique: true
person-identifications:
  record-type: PersonIdentification
  indexes: []
inbound-payments:
  record-type: InboundPayment
  indexes:
    - name: InboundPayment_by_scheme_transaction_id
      field: scheme_transaction_id
      unique: true
    - name: InboundPayment_count_by_org_business_day
      fields: [organization_id, business_day]
      type: count
outbound-payments:
  record-type: OutboundPayment
  indexes:
    - name: OutboundPayment_by_idempotency_key
      field: idempotency_key
      unique: true
    - name: OutboundPayment_count_by_org_business_day
      fields: [organization_id, business_day]
      type: count
internal-payments:
  record-type: InternalPayment
  indexes:
    - name: InternalPayment_by_idempotency_key
      field: idempotency_key
      unique: true
    - name: InternalPayment_count_by_org_business_day
      fields: [organization_id, business_day]
      type: count
policies:
  record-type: Policy
  indexes:
    - name: Policy_by_label
      field: labels
      fan-out: true
      nest:
        fields: [key, value]
policy-bindings:
  record-type: PolicyBinding
  indexes: []
transaction-legs:
  record-type: TransactionLeg
  primary-key: [account_id, transaction_id, leg_id]
  indexes: []
transactions:
  record-type: Transaction
  indexes:
    - name: Transaction_by_idempotency_key
      fields: [transaction_type, idempotency_key]
      unique: true
