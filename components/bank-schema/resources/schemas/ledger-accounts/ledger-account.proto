syntax = "proto2";

package com.repldriven.mono.schemas.ledger_accounts;

import "record_metadata_options.proto";

option java_outer_classname = "LedgerAccountProto";

// Five accounting classes. Asset and Expense are debit-normal; Liability,
// Equity, and Income are credit-normal (derived at read time, not stored).
enum GlAccountType {
  GL_ACCOUNT_TYPE_UNKNOWN = 0;
  GL_ACCOUNT_TYPE_ASSET = 1;
  GL_ACCOUNT_TYPE_LIABILITY = 2;
  GL_ACCOUNT_TYPE_EQUITY = 3;
  GL_ACCOUNT_TYPE_INCOME = 4;
  GL_ACCOUNT_TYPE_EXPENSE = 5;
}

// Role of a ledger account in the chart hierarchy. detail = leaf, accepts
// legs. summary = rolls up children, no legs directly. control = special
// leaf that aggregates a sub-ledger (customer cash-accounts).
enum GlAccountClass {
  GL_ACCOUNT_CLASS_UNKNOWN = 0;
  GL_ACCOUNT_CLASS_DETAIL = 1;
  GL_ACCOUNT_CLASS_CONTROL = 2;
  GL_ACCOUNT_CLASS_SUMMARY = 3;
}

enum Required {
  REQUIRED_UNKNOWN = 0;
  REQUIRED_MANDATORY = 1;
  REQUIRED_OPTIONAL = 2;
}

// Sub-ledger cohort a control ledger account aggregates. One per
// customer-deposit product type today; loans, cards, and other instruments
// add new kinds when those product families land.
enum SubLedgerKind {
  SUB_LEDGER_KIND_UNKNOWN = 0;
  SUB_LEDGER_KIND_CASH_ACCOUNT_CURRENT = 1;
  SUB_LEDGER_KIND_CASH_ACCOUNT_SAVINGS = 2;
  SUB_LEDGER_KIND_CASH_ACCOUNT_TERM_DEPOSIT = 3;
}

// The well-known bank-owned ledger accounts, by role. The enum value IS
// the conventional chart-of-accounts number (1=asset, 2=liability,
// 3=equity, 5=expense), so the display code is the integer itself
// (rendered as a string at the API/reporting edge). Code resolves accounts
// by role, never by the bare number.
enum GlAccountCode {
  GL_ACCOUNT_CODE_UNKNOWN = 0;
  GL_ACCOUNT_CODE_CASH_AT_CORRESPONDENT = 1100;
  GL_ACCOUNT_CODE_PENDING_OUTBOUND = 1200;
  GL_ACCOUNT_CODE_CUSTOMER_DEPOSITS_CURRENT = 2100;
  GL_ACCOUNT_CODE_CUSTOMER_DEPOSITS_SAVINGS = 2200;
  GL_ACCOUNT_CODE_CUSTOMER_DEPOSITS_TERM = 2300;
  GL_ACCOUNT_CODE_INTEREST_PAYABLE = 2400;
  GL_ACCOUNT_CODE_SUSPENSE = 2500;
  GL_ACCOUNT_CODE_OWN_FUNDS = 3100;
  GL_ACCOUNT_CODE_INTEREST_EXPENSE = 5100;
}

// A bank-owned general-ledger account — one row of the chart of accounts.
// Distinct from a customer CashAccount: GL accounts are 1:1 with a chart
// row, bank-owned, and effectively immutable. Both kinds share the
// account-id space for balances/transactions, so a ledger_account_id is
// just another account_id to bank-balance and bank-transaction.
message LedgerAccount {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  reserved 3;
  reserved "gl_code"; // replaced by the typed gl_account_code (tag 12)

  required string bank_id = 1;
  required string ledger_account_id = 2; // "led.<uuidv7>"
  required string name = 4;
  required string currency = 5;          // ISO 4217
  required GlAccountType gl_account_type = 6;
  required GlAccountClass gl_account_class = 7;
  required Required required = 8;
  optional SubLedgerKind sub_ledger_kind = 9; // control accounts only
  required int64 created_at = 10;
  required int64 updated_at = 11;
  required GlAccountCode gl_account_code = 12; // role; enum value = chart number
}
