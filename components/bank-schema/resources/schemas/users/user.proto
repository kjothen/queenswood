syntax = "proto2";

package com.repldriven.mono.schemas.users;

import "record_metadata_options.proto";

option java_outer_classname = "UserProto";

// User -- a human operator of the Queenswood platform. Kept strictly
// separate from Party (a customer/identity in the banking domain).
// A User is 1:1 with a Keycloak `sub`; Memberships join Users to
// Organizations. user_id is the storage primary key; keycloak_sub is
// the natural lookup (stable, never changes); email is a secondary
// index used by future Invitation flows.
enum IdentityProvider {
  IDENTITY_PROVIDER_UNKNOWN = 0;
  IDENTITY_PROVIDER_GOOGLE = 1;
  IDENTITY_PROVIDER_GITHUB = 2;
  IDENTITY_PROVIDER_PASSWORD = 3;
}

enum UserStatus {
  USER_STATUS_UNKNOWN = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
}

message User {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string user_id = 1 [(com.apple.foundationdb.record.field).primary_key = true];
  required string keycloak_sub = 2;
  required string email = 3;
  required string name = 4;
  optional string avatar_url = 5;
  required IdentityProvider identity_provider = 6;
  required UserStatus status = 7;
  required int64 created_at = 8;
  required int64 updated_at = 9;
}
