syntax = "proto2";

package com.repldriven.mono.schemas.schemas;

import "record_metadata_options.proto";

import "schemas/assertion/assertion.proto";
import "schemas/balances/balance.proto";
import "schemas/cash-account-products/account-product.proto";
import "schemas/cash-accounts/account.proto";
import "schemas/company/company.proto";
import "schemas/idempotency/idempotency.proto";
import "schemas/idv/idv.proto";
import "schemas/memberships/membership.proto";
import "schemas/organizations/organization.proto";
import "schemas/party/party-national-identifier.proto";
import "schemas/party/party.proto";
import "schemas/payee-check/payee_check.proto";
import "schemas/payments/inbound-payment.proto";
import "schemas/payments/internal-payment.proto";
import "schemas/payments/outbound-payment.proto";
import "schemas/person-identification/person-identification.proto";
import "schemas/policies/policy.proto";
import "schemas/transactions/transaction.proto";
import "schemas/users/user.proto";

option java_outer_classname = "SchemaProto";

option (com.apple.foundationdb.record.schema).store_record_versions = true;
option (com.apple.foundationdb.record.schema).split_long_records = true;

// RecordTypeUnion marks which messages are top-level record types
// for the FDB Record Layer. Named RecordTypeUnion so the Record
// Layer recognises it without requiring proto annotations.
message RecordTypeUnion {
  optional com.repldriven.mono.schemas.cash_accounts.CashAccount _CashAccount = 1;
  reserved 2;
  optional com.repldriven.mono.schemas.organizations.Organization _Organization = 3;
  reserved 4;
  optional com.repldriven.mono.schemas.person_identification.PersonIdentification _PersonIdentification = 5;
  optional com.repldriven.mono.schemas.party.Party _Party = 6;
  optional com.repldriven.mono.schemas.idv.Idv _Idv = 7;
  optional com.repldriven.mono.schemas.party.PartyNationalIdentifier _PartyNationalIdentifier = 8;
  reserved 9;
  optional com.repldriven.mono.schemas.cash_account_products.CashAccountProduct _CashAccountProduct = 10;
  optional com.repldriven.mono.schemas.balances.Balance _Balance = 11;
  optional com.repldriven.mono.schemas.transactions.Transaction _Transaction = 12;
  optional com.repldriven.mono.schemas.transactions.TransactionLeg _TransactionLeg = 13;
  optional com.repldriven.mono.schemas.payments.InternalPayment _InternalPayment = 14;
  optional com.repldriven.mono.schemas.payments.InboundPayment _InboundPayment = 15;
  optional com.repldriven.mono.schemas.payments.OutboundPayment _OutboundPayment = 16;
  reserved 17;
  optional com.repldriven.mono.schemas.payee_check.PayeeCheck _PayeeCheck = 18;
  optional com.repldriven.mono.schemas.policies.Policy _Policy = 19;
  optional com.repldriven.mono.schemas.policies.PolicyBinding _PolicyBinding = 20;
  optional com.repldriven.mono.schemas.idempotency.Idempotency _Idempotency = 21;
  optional com.repldriven.mono.schemas.users.User _User = 22;
  optional com.repldriven.mono.schemas.memberships.Membership _Membership = 23;
  optional com.repldriven.mono.schemas.assertion.Assertion _Assertion = 24;
  optional com.repldriven.mono.schemas.company.Company _Company = 25;
}
