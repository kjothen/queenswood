syntax = "proto2";

package com.repldriven.mono.schemas.types;

option java_outer_classname = "ProductTypeProto";

// Product type, carried by every cash-account product and cash-account.
// PRODUCT_TYPE_GENERAL_LEDGER tags the bank's own chart-of-accounts
// entries; the PRODUCT_TYPE_SUB_LEDGER_* values tag customer-facing
// instruments. PRODUCT_TYPE_UNKNOWN stays as the proto-default.
enum ProductType {
  PRODUCT_TYPE_UNKNOWN = 0;
  PRODUCT_TYPE_GENERAL_LEDGER = 1;
  PRODUCT_TYPE_SUB_LEDGER_CURRENT = 2;
  PRODUCT_TYPE_SUB_LEDGER_SAVINGS = 3;
  PRODUCT_TYPE_SUB_LEDGER_TERM_DEPOSIT = 4;
}
