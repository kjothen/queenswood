<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<script>
  // Excalidraw resolves its font woff2 files (Excalifont, …) relative to
  // this path at export time, then inlines them into the SVG as base64.
  // The exporter server (export-diagrams.mjs) serves the library's dist
  // assets under /assets.
  window.EXCALIDRAW_ASSET_PATH = location.origin + '/assets/';
</script>
<script src="./excalidraw-bundle.js"></script>
</head>
<body>
<script>
  window.doExport = async (scene, dark) => {
    const { exportToSvg } = window.ExcalidrawLib;
    const svg = await exportToSvg({
      elements: scene.elements,
      appState: {
        ...(scene.appState || {}),
        exportBackground: false,
        exportWithDarkMode: dark,
        exportEmbedScene: false,
      },
      files: scene.files || null,
    });
    return svg.outerHTML;
  };
</script>
</body>
</html>
