<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

      html, body, #app { margin: 0; padding: 0; height: 100%; }
    </style>

    <div id="app"></div>
    <!-- Runtime config — synthesised by nginx in prod, ignored 404
         in Vite dev (auth.mjs falls back to VITE_KEYCLOAK_* env vars). -->

    <script type="module" src="/src/main.js"></script>
  </body>
