system:
  pulsar: !include bank-monolith/pulsar-test.yml
  message-bus: !include bank-monolith/message-bus-test.yml
  fdb: !include bank/fdb-test.yml
  avro: !include avro/avro-test.yml
  keycloak: !include bank/keycloak-test.yml
  banks: !include bank/bank-test.yml
  cash-accounts: !include bank/cash-account-test.yml
  cash-account-products: !include bank/cash-account-product-test.yml
  parties: !include bank/party-test.yml
  payments: !include bank/payment-test.yml
  interest: !include bank/interest-test.yml
  transactions: !include bank/transaction-test.yml
  idv: !include bank/idv-test.yml
  payee-checks: !include bank/payee-check-test.yml
  policies: !include bank/policy-test.yml
  templates: !include bank/templates-test.yml
  telemetry:
    otel-sdk: !profile
      dev: !system/component
        system/component-kind: telemetry/otel-sdk
        service-name: bank-monolith
        endpoint: http://localhost:4318/v1/traces
  server:
    handler: !system/required-component
    interceptors: !system/component
      system/component-kind: server/interceptors
      identity-provider: !system/ref keycloak.identity-provider
      # All identity-provider instances the auth interceptor may use
      # to verify an incoming JWT. The interceptor extracts the
      # unverified `iss` claim, picks the matching provider, then
      # verifies. queenswood = bank-console; queenswood-ops = bank-app.
      identity-providers:
        - !system/ref keycloak.identity-provider
        - !system/ref keycloak.identity-provider-ops
      expected-audiences:
        - queenswood-api-test
        - queenswood-api-live
        # SPA user JWTs carry the public client id as aud (audience
        # mapper points the client at itself).
        - queenswood-console
        - queenswood-app
      # The Keycloak public client ids whose JWTs the auth interceptor
      # treats as user JWTs (azp == one of these); anything else is
      # treated as a service JWT.
      user-client-ids:
        - queenswood-console
        - queenswood-app
      audiences-by-status:
        bank-status-test: queenswood-api-test
        bank-status-live: queenswood-api-live
      dispatchers:
        banks: !system/ref banks.dispatcher
        cash-accounts: !system/ref cash-accounts.dispatcher
        cash-account-products: !system/ref cash-account-products.dispatcher
        parties: !system/ref parties.dispatcher
        payments: !system/ref payments.dispatcher
        interest: !system/ref interest.dispatcher
        transactions: !system/ref transactions.dispatcher
        payee-checks: !system/ref payee-checks.dispatcher
      avro: !system/ref avro.serde
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
      companies-house-url: !system/ref companies-house-simulator-server.http-url
    jetty-adapter: !system/component
      system/component-kind: server/jetty-adapter
      handler: !system/ref server.handler
      interceptors: !system/ref server.interceptors
      options: !profile
        dev:
          port: 8080
        default:
          port: 0
  clearbank-simulator-server: !include bank-monolith/clearbank-simulator-test.yml
  clearbank-adapter-server: !include bank-monolith/clearbank-adapter-server-test.yml
  clearbank-adapter: !include bank-monolith/clearbank-adapter-test.yml
  onfido-simulator-server: !include bank-monolith/onfido-simulator-test.yml
  onfido-adapter-server: !include bank-monolith/onfido-adapter-server-test.yml
  onfido-adapter: !include bank-monolith/onfido-adapter-test.yml
  companies-house-simulator-server: !include bank-monolith/companies-house-simulator-test.yml
