# node-modules linker (not PnP) so Vite + vite-plugin-svelte resolve
# workspace-sibling Svelte sources through plain `node_modules`
# symlinks. PnP works in theory but every JS toolchain has a
# different opinion about it; node-modules is the boring choice.
nodeLinker: node-modules

# Yarn itself is resolved via corepack, driven by the
# `packageManager` field in package.json. No bundled binary needed.
enableGlobalCache: true
