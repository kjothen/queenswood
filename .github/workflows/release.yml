name: Release

# Builds every Queenswood service image, pushes to ghcr.io with the
# `:latest` tag, packages the Helm chart, and updates a single
# GitHub release tagged `latest` with the chart `.tgz` + a local-k8s
# quickstart README. Runs only from `main` (push) or manual trigger.
#
# First-run setup: GHCR packages are private by default. After the
# first successful run, visit
#   https://github.com/users/<owner>/packages/container/<service>/settings
# for each service AND for the `queenswood` chart artifact, and
# flip the visibility to "public". The quickstart's OCI one-liner
# (`helm install ... oci://ghcr.io/<owner>/queenswood`) and image
# pulls into the kind cluster both rely on public access — the
# alternative would be `helm registry login` plus a per-namespace
# imagePullSecret.

on:
  push:
    branches: [main]
  workflow_dispatch:

# `latest` is a single moving tag — serialise concurrent runs to
# avoid two pushes racing to update the same release.
concurrency:
  group: release-latest
  cancel-in-progress: false

permissions:
  contents: write       # create/move tags + manage releases
  packages: write       # push images to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # QEMU is needed to build linux/arm64 layers on the amd64 runner.
      # The cross-arch JVM compile is the slow part; GHA layer cache
      # (configured below) makes unchanged layers instant on re-runs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The bake file's default `output = ["type=docker"]` loads
      # images into the local daemon (right for `just
      # docker-build-all`). Override to push directly to the
      # registry from the buildx builder — no intermediate
      # `docker push` step, no local daemon required.
      #
      # Caching strategy:
      # - `MULTI_ARCH=1` flips bake.hcl to publish linux/amd64 +
      #   linux/arm64. Local builds stay single-arch by default.
      # - `cache-from`/`cache-to=type=gha` persists BuildKit layer
      #   cache across workflow runs via the GitHub Actions cache.
      # - The Dockerfile's `--mount=type=cache` for /root/.m2 shares
      #   the Maven cache across the 13 service builds in a single
      #   bake invocation (deps downloaded once, not 13×).
      - name: Build and push all service images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: latest
          MULTI_ARCH: "1"
        run: |
          docker buildx bake \
            -f infra/docker/bake.hcl \
            --set "*.output=type=registry,push=true" \
            --set "*.cache-from=type=gha,scope=release" \
            --set "*.cache-to=type=gha,scope=release,mode=max"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # Pin the chart's default image.tag to `latest` for the
      # packaged release so `helm install <tgz>` works out of the
      # box without `--set image.tag=...`. The dev chart in the
      # repo keeps `0.0.0` so local builds aren't pinned to the
      # CI tag.
      - name: Pin packaged chart to image.tag=latest
        run: |
          sed -i 's/^  tag: .*/  tag: "latest"/' \
            infra/helm/queenswood/values.yaml

      - name: Resolve subchart deps and package
        run: |
          helm dependency update infra/helm/queenswood
          mkdir -p release
          helm package infra/helm/queenswood -d release

      # Publish the chart to GHCR as an OCI artifact so consumers
      # can run `helm install queenswood oci://ghcr.io/<owner>/queenswood
      # --version <ver>` directly. Helm 3.8+ does share ~/.docker/config.json
      # with the docker/login-action above, but be explicit — it's
      # one line and removes a debug-time gotcha if the auth path
      # ever drifts.
      - name: Helm registry login (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Push Helm chart to GHCR (OCI)
        run: |
          helm push release/queenswood-*.tgz oci://ghcr.io/${{ github.repository_owner }}

      - name: Write quickstart README
        run: |
          # Single-quoted heredoc keeps shell metacharacters
          # (`$ADMIN_KEY`, backticks, `$(...)`) literal. The two
          # build-time values — chart version and owner — are
          # left as `__VERSION__` / `__OWNER__` placeholders and
          # replaced with sed afterwards.
          cat > release/README.md <<'EOF'
          # Queenswood — local Kubernetes quickstart

          This release publishes the Helm chart at
          `oci://ghcr.io/__OWNER__/queenswood:__VERSION__`. The chart
          deploys the entire Queenswood platform (API, processors,
          adapters/simulators, the Svelte front-end, Pulsar,
          FoundationDB) into a local Kubernetes cluster.

          ## Prerequisites

          - Docker
          - [kind](https://kind.sigs.k8s.io/)
          - [Helm](https://helm.sh/) (>= 3.14)
          - kubectl

          ## Deploy

          1. **Create a local cluster:**
             ```bash
             kind create cluster --name queenswood
             ```

          2. **Install the chart** straight from the OCI registry —
             generates a one-off admin API key (save it; it's how you
             authenticate against the admin endpoints):
             ```bash
             ADMIN_KEY=$(openssl rand -hex 16)
             helm install queenswood \
               oci://ghcr.io/__OWNER__/queenswood --version __VERSION__ \
               --set secrets.adminApiKey=$ADMIN_KEY \
               --wait --timeout 10m
             echo "Admin API key: $ADMIN_KEY"
             ```

          3. **Port-forward** the API and the front-end
             (separate terminals):
             ```bash
             kubectl port-forward svc/queenswood-bank-api-service 8080:8080
             kubectl port-forward svc/queenswood-bank-app          8081:8080
             ```

          4. **Smoke-test the API:**
             ```bash
             curl -H "Authorization: Bearer $ADMIN_KEY" \
               http://localhost:8080/v1/tiers
             ```

             OpenAPI docs at <http://localhost:8080/scalar>.

          5. **Open the bank-app:** <http://localhost:8081>. The
             nginx in front of the SPA proxies `/v1/*` to the
             in-cluster bank-api service, so the UI works with no
             extra configuration.

          ## Recover the admin API key

          The chart stores the key in a Secret named
          `queenswood-admin-api-key`:
          ```bash
          kubectl get secret queenswood-admin-api-key \
            -o jsonpath='{.data.MONO_ADMIN_API_KEY}' | base64 -d
          ```

          ## Tear down

          ```bash
          helm uninstall queenswood
          kind delete cluster --name queenswood
          ```
          EOF
          CHART_VERSION=$(awk '/^version:/ {print $2}' \
            infra/helm/queenswood/Chart.yaml)
          OWNER="${{ github.repository_owner }}"
          sed -i "s/__VERSION__/$CHART_VERSION/g; s/__OWNER__/$OWNER/g" \
            release/README.md

      # `gh release create` fails if the release already exists, so
      # delete the previous `latest` release (and its tag) first.
      # `--cleanup-tag` removes the tag too. `|| true` because the
      # very first run has no prior release to delete.
      - name: Replace `latest` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "Latest" \
            --notes-file release/README.md \
            --target ${{ github.sha }} \
            release/*.tgz \
            release/README.md
