name: Release Images

# Builds every Queenswood service image and pushes to ghcr.io with
# the `:latest` tag. Runs from `main` (push) or manual trigger.
#
# Intentionally does NOT package or publish the Helm chart — that's
# `release-chart.yml`, which is manual-only. Splitting saves ~20
# minutes on chart-only edits (the multi-arch JVM compile is the
# slow part).
#
# First-run setup: GHCR packages are private by default. After the
# first successful run, visit
#   https://github.com/users/<owner>/packages/container/<service>/settings
# for each service and flip the visibility to "public". Pulls into
# the kind cluster rely on public access — the alternative would be
# `helm registry login` plus a per-namespace imagePullSecret.

on:
  push:
    branches: [main]
    # Skip when only chart/infra/docs changed — the chart workflow
    # handles those and there's no reason to burn 20 minutes
    # rebuilding identical images.
    paths-ignore:
      - 'infra/helm/**'
      - 'infra/bootstrap/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/release-chart.yml'
  workflow_dispatch:

# `latest` is a single moving tag — serialise concurrent runs to
# avoid two pushes racing to update the same image tag.
concurrency:
  group: release-images-latest
  cancel-in-progress: false

permissions:
  contents: read
  packages: write       # push images to ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # QEMU is needed to build linux/arm64 layers on the amd64 runner.
      # The cross-arch JVM compile is the slow part; GHA layer cache
      # (configured below) makes unchanged layers instant on re-runs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The bake file's default `output = ["type=docker"]` loads
      # images into the local daemon (right for `just
      # docker-build-all`). Override to push directly to the
      # registry from the buildx builder — no intermediate
      # `docker push` step, no local daemon required.
      #
      # Caching strategy:
      # - `MULTI_ARCH=1` flips bake.hcl to publish linux/amd64 +
      #   linux/arm64. Local builds stay single-arch by default.
      # - `cache-from`/`cache-to=type=gha` persists BuildKit layer
      #   cache across workflow runs via the GitHub Actions cache.
      # - The Dockerfile's `--mount=type=cache` for /root/.m2 shares
      #   the Maven cache across the 13 service builds in a single
      #   bake invocation (deps downloaded once, not 13×).
      - name: Build and push all service images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: latest
          MULTI_ARCH: "1"
        run: |
          docker buildx bake \
            -f infra/docker/bake.hcl \
            --set "*.output=type=registry,push=true" \
            --set "*.cache-from=type=gha,scope=release" \
            --set "*.cache-to=type=gha,scope=release,mode=max"
