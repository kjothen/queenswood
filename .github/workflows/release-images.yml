name: Release Images

# Builds every Queenswood service image and pushes to ghcr.io with
# the `:latest` tag. Runs from `main` (push) or manual trigger.
#
# Strategy: fan out by architecture, not by service. Each matrix arm
# runs natively on a GitHub-hosted runner of the right arch (no QEMU,
# which is the wall-clock dominator), uses `docker buildx bake` to
# build every service in parallel on that one runner, and pushes
# `:latest-<arch>` tags. A final `manifest` job stitches the two
# per-arch tags into a single multi-arch `:latest` manifest with
# `docker buildx imagetools create`.
#
# Why not matrix-per-service: bake's intra-runner parallelism shares
# the Clojure base layer and the Maven `--mount=type=cache` across
# every JVM service in one invocation. Splitting per service loses
# that cache entirely and burns a multiple of the runner minutes for a slower
# wall clock.
#
# First-run setup: GHCR packages are private by default. After the
# first successful run, visit
#   https://github.com/users/<owner>/packages/container/<service>/settings
# for each service and flip the visibility to "public". Pulls into
# the kind cluster rely on public access — the alternative would be
# `helm registry login` plus a per-namespace imagePullSecret.

on:
  push:
    branches: [main]
    # Skip when only chart/infra/docs changed — the chart workflow
    # handles those and there's no reason to burn runner minutes
    # rebuilding identical images.
    paths-ignore:
      - 'infra/helm/**'
      - 'infra/bootstrap/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/release-chart.yml'
  workflow_dispatch:

# `latest` is a single moving tag — serialise concurrent runs to
# avoid two pushes racing to update the same image tag.
concurrency:
  group: release-images-latest
  cancel-in-progress: false

permissions:
  contents: read
  packages: write       # push images to ghcr.io

jobs:
  build:
    strategy:
      # An amd64 failure shouldn't kill the arm64 run (or vice versa);
      # better to push one arch's `:latest-<arch>` and skip the
      # manifest step than to lose both.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native arch per runner means MULTI_ARCH stays unset (bake's
      # `platforms_default = []` lets BuildKit fall back to the host
      # platform) — no QEMU emulation, no cross-arch JVM compile
      # penalty.
      #
      # Tag with the arch suffix so the two arms don't clobber each
      # other. The `manifest` job below stitches `:latest-amd64` +
      # `:latest-arm64` into the canonical `:latest`.
      #
      # `cache-from`/`cache-to=type=gha` scoped per arch so each
      # runner has its own layer cache.
      - name: Build and push all service images (${{ matrix.arch }})
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/queenswood
          TAG: latest-${{ matrix.arch }}
          # Provenance for the OCI labels in bake.hcl. The published tag
          # is `latest`, so the commit is otherwise unrecoverable from a
          # pulled image. CREATED is computed in the step body because
          # `env:` cannot run a command.
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CREATED
          docker buildx bake \
            -f infra/docker/bake.hcl \
            --set "*.platform=${{ matrix.platform }}" \
            --set "*.output=type=registry,push=true" \
            --set "*.cache-from=type=gha,scope=release-${{ matrix.arch }}" \
            --set "*.cache-to=type=gha,scope=release-${{ matrix.arch }},mode=max"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create -t :latest :latest-amd64 :latest-arm64`
      # produces a manifest list for each image whose two referenced
      # manifests are the per-arch images pushed above. No image data
      # is re-uploaded — only the manifest list is created.
      #
      # The service list is the same one bake.hcl defines; kept in
      # sync by hand. (Bake can emit it, but the extra dependency to
      # parse JSON output from `docker buildx bake --print` isn't
      # worth saving 15 lines here.)
      - name: Stitch multi-arch manifests
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/queenswood
        run: |
          images=(
            migrator-service
            bootstrap-service
            api-service
            monolith-service
            financial-processors-service
            operational-processors-service
            exclusive-dispatchers-service
            external-adapters-service
            console
          )
          for img in "${images[@]}"; do
            docker buildx imagetools create \
              -t "$REGISTRY/$img:latest" \
              "$REGISTRY/$img:latest-amd64" \
              "$REGISTRY/$img:latest-arm64"
          done
