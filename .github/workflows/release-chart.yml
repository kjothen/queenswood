name: Release Chart

# Packages all three deployable Helm charts and publishes them:
#   - `queenswood`         (app: bank-* services + frontend)
#   - `queenswood-keycloak` (per-env Keycloak CR + plumbing)
#   - `keycloak-operator`  (vendored upstream operator + CRDs)
#
# Each pushes as an OCI artifact `oci://ghcr.io/<owner>/<name>:<version>`.
# Only `queenswood` also lands on the `latest` GitHub release page (with
# the quickstart README) — the other two are infra-side and consumed by
# Crossplane provider-helm `Release` resources templated from
# queenswood-platform.
#
# Manual-only: chart-template patches don't require an image rebuild,
# so this is decoupled from `release-images.yml`. Run from the
# Actions UI after merging a chart change to main. The queenswood
# chart pins `image.tag: latest`, so it picks up whatever images are
# currently published — no version coupling between this workflow
# and the image builds.

on:
  workflow_dispatch:

concurrency:
  group: release-chart-latest
  cancel-in-progress: false

permissions:
  contents: write       # create/move tags + manage releases
  packages: write       # push chart to ghcr.io as OCI artifact

jobs:
  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # Pin the chart's default image.tag to `latest` for the
      # packaged release so `helm install <tgz>` works out of the
      # box without `--set image.tag=...`. The dev chart in the
      # repo keeps `0.0.0` so local builds aren't pinned to the
      # CI tag.
      - name: Pin packaged chart to image.tag=latest
        run: |
          sed -i 's/^  tag: .*/  tag: "latest"/' \
            infra/helm/queenswood/values.yaml

      - name: Resolve subchart deps and package all three charts
        run: |
          mkdir -p release
          for chart in queenswood queenswood-keycloak keycloak-operator; do
            if [ -f "infra/helm/$chart/Chart.yaml" ]; then
              # Only `queenswood` has subchart deps today, but
              # `helm dependency update` is a no-op when there are
              # none — safe to call unconditionally.
              helm dependency update "infra/helm/$chart"
              helm package "infra/helm/$chart" -d release
            fi
          done

      # Publish each chart to GHCR as an OCI artifact so consumers can
      # `helm install <name> oci://ghcr.io/<owner>/<name> --version <ver>`
      # directly. Crossplane provider-helm pulls the two infra charts
      # via the same OCI URL — see queenswood-platform/templates/
      # *-release.yaml. Helm 3.8+ shares ~/.docker/config.json with
      # docker/login-action, but logging in explicitly removes a
      # debug-time gotcha if that auth path ever drifts.
      - name: Helm registry login (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Push all chart tarballs to GHCR (OCI)
        run: |
          for tgz in release/*.tgz; do
            helm push "$tgz" oci://ghcr.io/${{ github.repository_owner }}
          done

      - name: Write quickstart README
        run: |
          # Single-quoted heredoc keeps shell metacharacters
          # (backticks, `$(...)`) literal. The two build-time
          # values — chart version and owner — are left as
          # `__VERSION__` / `__OWNER__` placeholders and replaced
          # with sed afterwards.
          cat > release/README.md <<'EOF'
          # Queenswood — local Kubernetes quickstart

          This release publishes the Helm chart at
          `oci://ghcr.io/__OWNER__/queenswood:__VERSION__`. The chart
          deploys the entire Queenswood platform (API, processors,
          adapters/simulators, the Svelte front-end, Pulsar,
          FoundationDB) into a local Kubernetes cluster.

          ## Prerequisites

          - Docker
          - [kind](https://kind.sigs.k8s.io/)
          - [Helm](https://helm.sh/) (>= 3.14)
          - kubectl

          ## Deploy

          1. **Create a local cluster:**
             ```bash
             kind create cluster --name queenswood
             ```

          2. **Install the chart** straight from the OCI registry:
             ```bash
             helm install queenswood \
               oci://ghcr.io/__OWNER__/queenswood --version __VERSION__ \
               -n queenswood --create-namespace \
               --wait --timeout 10m
             ```

          3. **Port-forward** the API and the SPAs
             (separate terminals):
             ```bash
             kubectl -n queenswood port-forward svc/queenswood-bank-api-service 8080:8080
             kubectl -n queenswood port-forward svc/queenswood-bank-app          8081:8080
             kubectl -n queenswood port-forward svc/queenswood-bank-console      8082:8080
             ```

          4. **Sign in via Keycloak.** Open
             <http://localhost:8081> for the operator console
             (`bank-app`) or <http://localhost:8082> for the
             organisation console (`bank-console`). Both redirect to
             the bundled Keycloak; tokens flow back to the SPA, and
             nginx proxies `/v1/*` to the in-cluster bank-api
             service. OpenAPI docs at
             <http://localhost:8080/scalar>.

          ## Tear down

          ```bash
          helm uninstall queenswood -n queenswood
          kind delete cluster --name queenswood
          ```
          EOF
          CHART_VERSION=$(awk '/^version:/ {print $2}' \
            infra/helm/queenswood/Chart.yaml)
          OWNER="${{ github.repository_owner }}"
          sed -i "s/__VERSION__/$CHART_VERSION/g; s/__OWNER__/$OWNER/g" \
            release/README.md

      # `gh release create` fails if the release already exists, so
      # delete the previous `latest` release (and its tag) first.
      # `--cleanup-tag` removes the tag too. `|| true` because the
      # very first run has no prior release to delete.
      - name: Replace `latest` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          # `queenswood-[0-9]*.tgz` matches `queenswood-0.5.3.tgz`
          # but NOT `queenswood-keycloak-0.2.0.tgz` — the GH release
          # is the user-facing quickstart, which only ships the app
          # chart.
          gh release create latest \
            --title "Latest" \
            --notes-file release/README.md \
            --target ${{ github.sha }} \
            release/queenswood-[0-9]*.tgz \
            release/README.md
